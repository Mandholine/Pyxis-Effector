[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxis-core"
version = "0.1.0"
description = "Core node-based subtitle effector and renderer engine for ASS subtitles"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE*"]
authors = [
    { name = "Pyxis Effector contributors" }
]
keywords = ["aegisub", "subtitles", "ass", "node-engine", "vfx", "motion-graphics", "clean-architecture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "pyclipper>=1.3",
    "freetype-py>=2.4",
    "psutil>=5.9",
    "lupa>=2.0",
]

[project.optional-dependencies]
gpu = [
    "cupy>=12.0",
]
dev = [
    "pytest>=7.0",
    "black",
    "flake8",
    "build",
    "twine",
]

[project.scripts]
pyxis-core = "pyxis_core.cli:main"

[project.urls]
Homepage = "https://github.com/Pyxis-Effector/Pyxis-Effector"
Documentation = "https://github.com/Pyxis-Effector/Pyxis-Effector/tree/main/pyxis_core/docs"
Repository = "https://github.com/Pyxis-Effector/Pyxis-Effector"
Issues = "https://github.com/Pyxis-Effector/Pyxis-Effector/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pyxis_core*"]

[tool.setuptools.package-data]
"*" = ["*.ass", "*.json", "*.md", "*.png", "*.txt"]
"pyxis_core" = [
    "infrastructure/engine/data/*",
    "infrastructure/engine/data/templates/*",
    "infrastructure/engine/bin/img2ass*",
    "infrastructure/engine/bin/potrace*",
    "infrastructure/engine/bin/libass_profiler*",
    "infrastructure/engine/bin/README.md",
    "infrastructure/engine/bin/ass/*",
    "infrastructure/engine/bin/images/*",
]

[tool.setuptools.exclude-package-data]
"*" = ["*.o", "*.lo", "*.la", "*.lai", "*.a", ".DS_Store", "__pycache__/*"]
"pyxis_core" = [
    "infrastructure/engine/bin/potrace_native/*",
    "infrastructure/engine/bin/potrace_native/**/*",
    "infrastructure/engine/bin/libass_profiler_native/*",
    "infrastructure/engine/bin/libass_profiler_native/**/*",
]
