                        const textNodeW = Math.max(200, reqBoxW + 24);
                        const textNodeH = Math.max(88, 48 + lCount * 20 + 16);

                        const reqNodeW = Math.max(node._manual_width || 200, textNodeW);
                        const reqNodeH = Math.max(node._manual_height || 88, textNodeH);

                        node.properties[propertyName] = val;
                        if (varWidget) varWidget.value = val;

                        node.size[0] = reqNodeW;
                        node.size[1] = reqNodeH;

                        if (canvas.setDirtyCanvas) canvas.setDirtyCanvas(true, true);
                        if (canvas.draw) canvas.draw(true, true);

                        const curScale = canvas.ds ? canvas.ds.scale : 1.0;
                        const curOffset = canvas.ds ? canvas.ds.offset : [0, 0];
                        const curRect = canvas.canvas.getBoundingClientRect();

                        const newScreenX = curRect.left + (node.pos[0] + margin + curOffset[0]) * curScale;
                        const newScreenY = curRect.top + (node.pos[1] + drawY + curOffset[1]) * curScale;
                        const newScreenW = (node.size[0] - 24) * curScale;
                        const newScreenH = Math.max((lCount * 20 + 8), (node.size[1] - drawY - 12)) * curScale;

                        container.style.left = newScreenX + "px";
                        container.style.top = newScreenY + "px";
                        container.style.width = newScreenW + "px";
                        container.style.height = newScreenH + "px";

                        editorDiv.style.left = (5 * curScale) + "px";
                        editorDiv.style.top = (2 * curScale) + "px";
                        editorDiv.style.width = `calc(100% - ${(7 * curScale)}px)`;
                        editorDiv.style.height = `calc(100% - ${(4 * curScale)}px)`;

                        aceEditor.resize();
                    } finally {
                        isSyncing = false;
                    }
                };

                aceEditor.session.on('change', syncSizeAndCanvas);

                aceEditor.commands.addCommand({
                    name: "pyxisSaveAndClose",
                    bindKey: { win: "Ctrl-Enter", mac: "Command-Enter" },
                    exec: function() {
                        saveAndClose();
                    }
                });

                aceEditor.commands.addCommand({
                    name: "pyxisCloseOnEsc",
                    bindKey: { win: "Escape", mac: "Escape" },
                    exec: function() {
                        saveAndClose();
                    }
                });
            }

            let closed = false;
            function saveAndClose() {
                if (closed) return;
                closed = true;
                delete node._is_editing_vars;
                const finalVal = aceEditor ? aceEditor.getValue() : "";
                node.properties[propertyName] = finalVal;
                if (varWidget) varWidget.value = finalVal;
                if (node.computeSize) {
                    const minSz = node.computeSize();
                    node.size[0] = Math.max(node.size[0] || 200, minSz[0]);
                    node.size[1] = Math.max(node.size[1] || 88, minSz[1]);
                }
                if (node.setDirtyCanvas) node.setDirtyCanvas(true, true);
                if (canvas.setDirtyCanvas) canvas.setDirtyCanvas(true, true);
                if (canvas.draw) canvas.draw(true, true);
                if (window.PyxisUndoManager) window.PyxisUndoManager.recordState("def-vars-edit");
                if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                window.removeEventListener("mousedown", onDocMouseDown, true);
                if (aceEditor) {
                    try { aceEditor.destroy(); } catch(e){}
                }
                container.remove();
            }
            container._saveAndClose = saveAndClose;

            const onDocMouseDown = (e) => {
                if (container.contains(e.target) || (e.target.closest && (e.target.closest('.ace_autocomplete') || e.target.closest('.ace_editor')))) {
                    return;
                }
                saveAndClose();
            };
            setTimeout(() => {
                window.addEventListener("mousedown", onDocMouseDown, true);
            }, 60);
        }

        function showFloatingDefinirVarsEditor(node, propertyName, titleName, clickEvent) {
            openInlineDefinirVarsEditor(node, propertyName);
        }

        function renderPythonHighlightedLine(ctx, text, startX, y) {
            if (!text) return;
            const tokenRegex = /("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|#[^\r\n]*|\b\d+(?:\.\d+)?\b|[=+*/%<>&|!~^-]+|\b(?:and|as|assert|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|not|or|pass|raise|return|try|while|with|yield)\b|[a-zA-Z_]\w*|\s+|[^\s\w])/g;
            let match;
            let curX = startX;
            while ((match = tokenRegex.exec(text)) !== null) {
                const tok = match[0];
                if (!tok) continue;
                let color = "#f8f8f2";
                if (tok.startsWith("#")) {
                    color = "#6272a4";
                } else if (tok.startsWith('"') || tok.startsWith("'")) {
                    color = "#f1fa8c";
                } else if (/^\d/.test(tok)) {
                    color = "#bd93f9";
                } else if (/^[=+*/%<>&|!~^-]+$/.test(tok)) {
                    color = "#ff79c6";
                } else if (/^(and|as|assert|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|not|or|pass|raise|return|try|while|with|yield)$/.test(tok)) {
                    color = "#ff79c6";
                }
                ctx.fillStyle = color;
                ctx.fillText(tok, curX, y);
                curX += ctx.measureText(tok).width;
            }
        }

        function setupDefinirVarsNode(node) {
            const varWidget = node.widgets ? node.widgets.find(w => w.property === "variables") : null;
            if (!varWidget) return;

            varWidget.type = "custom";

            node.onResize = function(size) {
                const minSz = this.computeSize ? this.computeSize() : [200, 88];
                if (size[0] <= minSz[0] + 5) {
                    delete this._manual_width;
                } else {
                    this._manual_width = size[0];
                }
                if (size[1] <= minSz[1] + 5) {
                    delete this._manual_height;
                } else {
                    this._manual_height = size[1];
                }
            };

            varWidget.mouse = function(event, pos, node) {
                if (event.type === "mousedown" || event.type === "click") {
                    openInlineDefinirVarsEditor(node, "variables");
                    return true;
                }
            };

            varWidget.callback = function(value, canvas, node, pos, event) {
                openInlineDefinirVarsEditor(node, "variables");
            };

            node.onDblClick = function(event, pos) {
                if (pos && pos[1] < 0) return false;
                openInlineDefinirVarsEditor(this, "variables");
                return true;
            };

            node.updateVarsSize = function() {
                if (node.computeSize) {
                    const minSz = node.computeSize();
                    node.size[0] = Math.max(node.size[0] || 200, minSz[0]);
                    node.size[1] = Math.max(node.size[1] || 88, minSz[1]);
                }
            };

            node.computeSize = function() {
                const text = String(node.properties.variables || "").trim();
                const lines = text ? text.split('\n') : [];
                
                let maxTw = 0;
                lines.forEach(l => {
                    const tw = getExactTextWidth(l, "bold 12px Consolas, monospace");
                    if (tw > maxTw) maxTw = tw;
                });

                const lineCount = Math.max(1, lines.length);
                const boxW = Math.max(176, Math.ceil(maxTw + 28));
                const minReqW = Math.max(200, boxW + 24);
                const minReqH = Math.max(88, 48 + lineCount * 20 + 16);

                return [minReqW, minReqH];
            };

            varWidget.computeSize = function(width) {
                const text = String(node.properties.variables || "").trim();
                const lines = text ? text.split('\n') : [];
                const lineCount = Math.max(1, lines.length);
                return [width - 24, Math.max(lineCount * 20 + 8, (node.size ? node.size[1] - 48 - 12 : 36))];
            };

            varWidget.draw = function(ctx, node, width, y, height) {
                varWidget.last_y = y;
                if (node._is_editing_vars) {
                    return; // El editor in-situ se encarga del renderizado en vivo; evita duplicados o bordes dobles
                }
                const text = String(node.properties.variables || varWidget.value || "");
                const trimmed = text.trim();
                const lines = trimmed ? text.split('\n') : [];
                const margin = 12;
                const wWidth = width - 24;
                const lineCount = Math.max(1, lines.length);
                const wHeight = Math.max(lineCount * 20 + 8, (node.size[1] - y - 12));

                ctx.save();
                ctx.fillStyle = "#12161f";
                ctx.strokeStyle = "#8b5cf6";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(margin, y, wWidth, wHeight, 8);
                else ctx.rect(margin, y, wWidth, wHeight);
                ctx.fill();
                ctx.stroke();

                if (!trimmed) {
                    ctx.fillStyle = "#64748b";
                    ctx.font = "italic 11px sans-serif";
                    ctx.textAlign = "left";
                    var placeholder = window.PyxisI18n ? window.PyxisI18n.t("nodes.placeholders.vars_empty") : "(click to define vars...)";
                    ctx.fillText(placeholder, margin + 10, y + 17);
                } else {
                    ctx.font = "bold 12px Consolas, monospace";
                    ctx.textAlign = "left";

                    for (let i = 0; i < lines.length; i++) {
                        renderPythonHighlightedLine(ctx, lines[i], margin + 10, y + 17 + i * 20);
                    }
                }
                ctx.restore();
            };

            const oldConfigure = node.onConfigure;
            node.onConfigure = function(info) {
                if (oldConfigure) oldConfigure.call(this, info);
                if (this.updateVarsSize) this.updateVarsSize();
            };

            if (node.updateVarsSize) node.updateVarsSize();
        }

        function setupMainLoopNode(node) {
            if (!node.properties) node.properties = {};
            if (!node.properties.iterador) node.properties.iterador = "syl";
            if (!node.properties.noblank) node.properties.noblank = "No Blank (Ignorar Espacios)";

            node.widgets = [];

            node.computeSize = function() {
                return [255, 96];
            };
            if (node.size) {
                node.size[0] = Math.max(node.size[0], 255);
                node.size[1] = Math.max(node.size[1], 96);
            }

            const oldDraw = node.onDrawForeground;
            node.onDrawForeground = function(ctx) {
                if (oldDraw) oldDraw.call(this, ctx);
                if (this.flags && this.flags.collapsed) return;

                ctx.save();
                ctx.font = "bold 10px monospace";
                const badgeH = 20;
                const badgeY = -25;

                // 1. Draw Unit Toggle Badge Button (Rightmost Title Bar)
                const iter = String(this.properties.iterador || "syl");
                const unitText = iter.toUpperCase();
                const unitTextW = ctx.measureText(unitText).width;
                const unitBadgeW = Math.max(48, unitTextW + 14);
                const unitBadgeX = this.size[0] - unitBadgeW - 8;

                this._unit_badge_bounds = { x: unitBadgeX, y: badgeY, w: unitBadgeW, h: badgeH };

                ctx.fillStyle = "rgba(18, 22, 31, 0.85)";
                ctx.strokeStyle = "#0ea5e9";
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(unitBadgeX, badgeY, unitBadgeW, badgeH, 10);
                else ctx.rect(unitBadgeX, badgeY, unitBadgeW, badgeH);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "#38bdf8";
                ctx.textAlign = "center";
                ctx.fillText(unitText, unitBadgeX + unitBadgeW / 2, badgeY + 14);

                // 2. Draw Blank Mode Toggle Badge Button (Left of Unit Badge)
                const isNoBlank = !String(this.properties.noblank || "").includes("Con") && !String(this.properties.noblank || "").includes("With");
                const blankText = window.PyxisI18n ? window.PyxisI18n.getBlankBadgeText(isNoBlank) : (isNoBlank ? "NO BLANK" : "WITH BLANK");
                const blankTextW = ctx.measureText(blankText).width;
                const blankBadgeW = Math.max(68, blankTextW + 14);
                const blankBadgeX = unitBadgeX - blankBadgeW - 6;

                this._blank_badge_bounds = { x: blankBadgeX, y: badgeY, w: blankBadgeW, h: badgeH };

                ctx.fillStyle = "rgba(18, 22, 31, 0.85)";
                ctx.strokeStyle = isNoBlank ? "#10b981" : "#64748b";
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(blankBadgeX, badgeY, blankBadgeW, badgeH, 10);
                else ctx.rect(blankBadgeX, badgeY, blankBadgeW, badgeH);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = isNoBlank ? "#a7f3d0" : "#94a3b8";
                ctx.textAlign = "center";
                ctx.fillText(blankText, blankBadgeX + blankBadgeW / 2, badgeY + 14);

                // 3. Draw Footer Loop Counter Text
                ctx.font = "italic 11px monospace";
                ctx.fillStyle = "#94a3b8";
                ctx.textAlign = "center";
                const iterStr = String(this.properties.iterador || "syl").toLowerCase();
                const mainLoopCounterText = `${iterStr}.i, ${iterStr}.n`;
                ctx.fillText(mainLoopCounterText, this.size[0] / 2, this.size[1] - 6);

                ctx.restore();
            };

            const oldMouseDown = node.onMouseDown;
            node.onMouseDown = function(e, pos, canvas) {
                if (oldMouseDown && oldMouseDown.call(this, e, pos, canvas)) return true;

                if (this._unit_badge_bounds) {
                    const b = this._unit_badge_bounds;
                    if (pos[0] >= b.x && pos[0] <= b.x + b.w &&
                        pos[1] >= b.y && pos[1] <= b.y + b.h) {

                        const units = ["syl", "line", "word", "char"];
                        let idx = units.indexOf(this.properties.iterador);
                        if (idx === -1) idx = 0;
                        const nextIdx = (idx + 1) % units.length;
                        this.properties.iterador = units[nextIdx];

                        if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                        if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                        return true;
                    }
                }

                if (this._blank_badge_bounds) {
                    const b = this._blank_badge_bounds;
                    if (pos[0] >= b.x && pos[0] <= b.x + b.w &&
                        pos[1] >= b.y && pos[1] <= b.y + b.h) {

                        const isNoBlank = !String(this.properties.noblank || "").includes("Con");
                        this.properties.noblank = isNoBlank ? "Con Blanks (Todos)" : "No Blank (Ignorar Espacios)";

                        if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                        if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                        return true;
                    }
                }
            };
        }

        const MAXLOOP_MODES = [
            { full: "Normal", short: "NORMAL" },
            { full: "FBF", short: "FBF" }
        ];

        function setupMaxLoopNode(node) {
            if (!node.properties) node.properties = {};
            if (node.properties.modo === undefined) node.properties.modo = "Normal";
            if (node.properties.veces === undefined) node.properties.veces = "3";
            if (node.properties.step_ms === undefined) node.properties.step_ms = "41.7";
            if (node.properties.start_time === undefined) node.properties.start_time = "start_time";
            if (node.properties.end_time === undefined) node.properties.end_time = "end_time";
            if (node.properties.var_name === undefined) node.properties.var_name = "j";

            node.widgets_up = true;

            function updateMaxLoopInputs() {
                const curMode = String(node.properties.modo || "Normal");
                const isFBF = (curMode.toLowerCase() === "fbf");

                const oldInputs = node.inputs ? [...node.inputs] : [];

                if (isFBF) {
                    const reqInputs = [
                        { name: "Loop In", type: "bucle", label: "Loop In", pos: [10, 18] },
                        { name: "Start", type: "data", label: " ", pos: [10, 66], property: "start_time" },
                        { name: "End", type: "data", label: " ", pos: [10, 89], property: "end_time" }
                    ];

                    node.inputs = [];
                    reqInputs.forEach((req, idx) => {
                        const oldInp = oldInputs.find(i => i && (i.name === req.name || i.property === req.property)) || oldInputs[idx];
                        const linkId = oldInp ? oldInp.link : null;
                        node.inputs.push({
                            name: req.name,
                            type: req.type,
                            label: req.label,
                            pos: req.pos,
                            link: linkId,
                            property: req.property
                        });
                    });
                } else {
                    const link0 = (oldInputs && oldInputs.length > 0 && oldInputs[0]) ? oldInputs[0].link : null;
                    node.inputs = [{ name: "Loop In", type: "bucle", label: "Loop In", pos: [10, 18], link: link0 }];
                }

                const varName = String(node.properties.var_name || "j").trim() || "j";
                if (!node.outputs || node.outputs.length < 3) {
                    node.outputs = [
                        { name: "Loop Out", type: "bucle" },
                        { name: "Counter", type: "data" },
                        { name: "Total", type: "data" }
                    ];
                } else {
                    node.outputs[1].name = "Counter";
                    node.outputs[2].name = "Total";
                }

                node.widgets = [];

                const propsConfig = isFBF ? [
                    { name: "Step (ms)", prop: "step_ms", default: "41.7", y: 34 },
                    { name: "Inicio (ms)", prop: "start_time", default: "start_time", y: 57 },
                    { name: "Fin (ms)", prop: "end_time", default: "end_time", y: 80 },
                    { name: "Var Name (j)", prop: "var_name", default: "j", y: 103 }
                ] : [
                    { name: "Iterations (N)", prop: "veces", default: "3", y: 34 },
                    { name: "Var Name (j)", prop: "var_name", default: "j", y: 57 }
                ];

                propsConfig.forEach((item) => {
                    const curVal = String(node.properties[item.prop] !== undefined ? node.properties[item.prop] : item.default);
                    const w = node.addWidget("text", item.name, curVal, function(val) {
                        const cleanVal = String(val || "").replace(/[\r\n]+/g, " ");
                        node.properties[item.prop] = cleanVal;
                        if (item.prop === "var_name") {
                            updateMaxLoopInputs();
                        }
                        if (node.computeSize) node.size = node.computeSize();
                        if (node.setDirtyCanvas) node.setDirtyCanvas(true, true);
                        if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                    });
                    w.property = item.prop;
                    w.last_y = item.y;
                    w.y = item.y;
                    setupSingleLineTextWidget(node, w, item.name, item.prop);
                });

                if (node.computeSize) {
                    node.size = node.computeSize();
                }
                if (node.setDirtyCanvas && node.graph) node.setDirtyCanvas(true, true);
            }

            node.computeSize = function() {
                const curMode = String(this.properties ? (this.properties.modo || "Normal") : "Normal");
                const isFBF = (curMode.toLowerCase() === "fbf");
                let base_w = isFBF ? 215 : 195;
                let text_req_w = 0;
                if (this.properties) {
                    ["veces", "step_ms", "start_time", "end_time", "var_name"].forEach(k => {
                        const val = String(this.properties[k] || "");
                        if (val.length > 0) {
                            const tw = getExactTextWidth(val, "bold 11px Consolas, monospace");
                            text_req_w = Math.max(text_req_w, tw);
                        }
                    });
                }
                const right_space = getNodeRightReserve(this);
                const boxW = Math.max(65, Math.ceil(text_req_w + 28));
                const req_h = isFBF ? 144 : 96;
                return [Math.max(base_w, 22 + boxW + right_space), req_h];
            };

            const oldMouseDown = node.onMouseDown;
            node.onMouseDown = function(e, local_pos, canvas) {
                if (local_pos && local_pos[1] < 0) {
                    const curMode = String(this.properties ? (this.properties.modo || "Normal") : "Normal");
                    let curIdx = MAXLOOP_MODES.findIndex(m => m.full.toLowerCase() === curMode.toLowerCase() || m.short.toLowerCase() === curMode.toLowerCase());
                    if (curIdx < 0) curIdx = 0;
                    const btnText = MAXLOOP_MODES[curIdx].short;
                    const font = "bold 10px monospace";
                    let textW = 50;
                    if (canvas && canvas.ctx) {
                        canvas.ctx.font = font;
                        textW = canvas.ctx.measureText(btnText).width;
                    }
                    const btnW = Math.max(55, textW + 14);
                    const btnX = this.size[0] - btnW - 8;

                    if (local_pos[0] >= btnX - 4 && local_pos[0] <= btnX + btnW + 6) {
                        const nextIdx = (curIdx + 1) % MAXLOOP_MODES.length;
                        this.properties.modo = MAXLOOP_MODES[nextIdx].full;
                        updateMaxLoopInputs();
                        if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                        if (window.PyxisUndoManager) window.PyxisUndoManager.recordState("maxloop-mode-change");
                        if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                        return true;
                    }
                }
                if (oldMouseDown) return oldMouseDown.call(this, e, local_pos, canvas);
            };

            const oldDraw = node.onDrawForeground;
            node.onDrawForeground = function(ctx) {
                if (oldDraw) oldDraw.call(this, ctx);
                if (this.flags && this.flags.collapsed) return;

                // Render Title Bar Cyclic Mode Button
                const curMode = String(this.properties ? (this.properties.modo || "Normal") : "Normal");
                const mObj = MAXLOOP_MODES.find(m => m.full.toLowerCase() === curMode.toLowerCase() || m.short.toLowerCase() === curMode.toLowerCase()) || MAXLOOP_MODES[0];
                const isFBF = (mObj.short === "FBF");

                ctx.save();
                ctx.font = "bold 10px monospace";
                const textW = ctx.measureText(mObj.short).width;
                const btnW = Math.max(50, textW + 14);
                const btnH = 20;
                const btnX = this.size[0] - btnW - 8;
                const btnY = -25;

                ctx.fillStyle = isFBF ? "rgba(6, 78, 59, 0.85)" : "rgba(18, 22, 31, 0.85)";
                ctx.strokeStyle = isFBF ? "#10b981" : "#8b5cf6";
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(btnX, btnY, btnW, btnH, 10);
                else ctx.rect(btnX, btnY, btnW, btnH);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = isFBF ? "#6ee7b7" : "#a7f3d0";
                ctx.textAlign = "center";
                ctx.fillText(mObj.short, btnX + btnW / 2, btnY + 14);
                ctx.restore();

                if (isFBF) {
                    if (this.widgets && this.widgets.length >= 4) {
                        this.widgets[0].y = 34; this.widgets[0].last_y = 34;
                        this.widgets[1].y = 57; this.widgets[1].last_y = 57;
                        this.widgets[2].y = 80; this.widgets[2].last_y = 80;
                        this.widgets[3].y = 103; this.widgets[3].last_y = 103;
                    }
                    if (this.inputs && this.inputs.length >= 3) {
                        this.inputs[0].label = "Loop In";
                        this.inputs[0].pos = [10, 18];
                        this.inputs[1].label = " ";
                        this.inputs[1].pos = [10, 66];
                        this.inputs[2].label = " ";
                        this.inputs[2].pos = [10, 89];
                    }
                } else {
                    if (this.widgets && this.widgets.length >= 2) {
                        this.widgets[0].y = 34; this.widgets[0].last_y = 34;
                        this.widgets[1].y = 57; this.widgets[1].last_y = 57;
                    }
                    if (this.inputs && this.inputs.length >= 1) {
                        this.inputs[0].label = "Loop In";
                        this.inputs[0].pos = [10, 18];
                    }
                }

                // 3. Draw Footer Loop Counter Text
                ctx.save();
                ctx.font = "italic 11px monospace";
                ctx.fillStyle = "#94a3b8";
                ctx.textAlign = "center";
                const varName = String(this.properties.var_name || "j").trim() || "j";
                const maxLoopCounterText = `${varName}, max${varName}`;
                ctx.fillText(maxLoopCounterText, this.size[0] / 2, this.size[1] - 6);
                ctx.restore();
            };

            const oldConfigure = node.onConfigure;
            node.onConfigure = function(info) {
                if (oldConfigure) oldConfigure.call(this, info);
                updateMaxLoopInputs();
            };

            updateMaxLoopInputs();
        }

        function setupSalidaNode(node) {
            if (!node.properties) node.properties = {};
            if (!node.properties.apply_to) node.properties.apply_to = "Sel. Lines";
            if (node.properties.queue_id === undefined) node.properties.queue_id = "";
            if (node.properties.queue_order === undefined) node.properties.queue_order = "";
            if (node.properties.origin_align === undefined) node.properties.origin_align = 5;

            const ALIGN_POINTS = {

                8: { col: 1, row: 0, name: "Top-Center" },
                9: { col: 2, row: 0, name: "Top-Right" },
                4: { col: 0, row: 1, name: "Mid-Left" },
                5: { col: 1, row: 1, name: "Center" },
                6: { col: 2, row: 1, name: "Mid-Right" },
                1: { col: 0, row: 2, name: "Bottom-Left" },
                2: { col: 1, row: 2, name: "Bottom-Center" },
                3: { col: 2, row: 2, name: "Bottom-Right" }
            };

            function getGridPointCoords(n, alignNum) {
                const info = ALIGN_POINTS[alignNum] || ALIGN_POINTS[5];
                const cx = (n.size[0] || 200) - 55;
                const cy = 82;
                const sp = 33;
                return {
                    x: cx + (info.col - 1) * sp,
                    y: cy + (info.row - 1) * sp,

                };

            const reqInputs = [
                { name: "Loop / Domain", type: "bucle", label: "Loop / Domain" },
                { name: "Layer", type: "data", label: "Layer" },
                { name: "Start Time", type: "data", label: "Start Time" },
                { name: "End Time", type: "data", label: "End Time" },

            node.computeSize = function() {

            function updateSalidaInputs() {

                const curQueueOrder = String(node.properties.queue_order !== undefined ? node.properties.queue_order : "");

            const oldDraw = node.onDrawForeground;
            node.onDrawForeground = function(ctx) {
                if (oldDraw) oldDraw.call(this, ctx);
                if (this.flags && this.flags.collapsed) return;

                if (this.widgets && this.widgets.length >= 2) {

                    this.widgets[1].y = 168;
                    this.widgets[1].last_y = 168;
                }

                if (this.inputs && this.inputs.length >= 8) {
                    this.inputs[6].label = " ";
                    this.inputs[6].pos = [10, 154];

                ctx.font = "bold 10px monospace";
                const applyTextW = ctx.measureText(applyText).width;
                const applyBadgeW = Math.max(54, applyTextW + 14);
                const badgeH = 20;
                const applyBadgeX = this.size[0] - applyBadgeW - 8;
                const badgeY = -25;

                this._apply_badge_bounds = { x: applyBadgeX, y: badgeY, w: applyBadgeW, h: badgeH };

                ctx.fillStyle = "rgba(18, 22, 31, 0.85)";
                ctx.strokeStyle = "#0ea5e9";

                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(applyBadgeX, badgeY, applyBadgeW, badgeH, 10);
                else ctx.rect(applyBadgeX, badgeY, applyBadgeW, badgeH);

                ctx.stroke();

                ctx.fillStyle = "#38bdf8";
                ctx.textAlign = "center";

                // ==========================================

                const cx = (this.size[0] || 200) - 55;
                const cy = 82;
                const sp = 33;

                // 1. Líneas de Red (Connecting Grid Lines)

                ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                for (let r = 0; r < 3; r++) {
                    const y = cy + (r - 1) * sp;
                    ctx.moveTo(cx - sp, y);
                    ctx.lineTo(cx + sp, y);
                }
                for (let c = 0; c < 3; c++) {
                    const x = cx + (c - 1) * sp;
                    ctx.moveTo(x, cy - sp);
                    ctx.lineTo(x, cy + sp);
                }
                ctx.stroke();
                ctx.restore();

                // 2. Puntos de anclaje (con hover aislado individual)
                const hoveredAlign = this._hovered_align_point;
                for (let a = 1; a <= 9; a++) {
                    const pt = getGridPointCoords(this, a);

                    ctx.beginPath();
                    if (hoveredAlign === a) {

                        ctx.shadowColor = "rgba(16, 185, 129, 0.95)";

                        ctx.fill();
                    }
                    ctx.restore();
                }

                // 3. Bola Verde Activa con Animación Suave (Lerp)
                const activeAlign = Number(this.properties.origin_align || 5);
                const targetPt = getGridPointCoords(this, activeAlign);

                if (this._anim_ball_x === undefined || this._anim_ball_y === undefined || this._last_cx !== cx || this._last_cy !== cy) {
                    this._anim_ball_x = targetPt.x;
                    this._anim_ball_y = targetPt.y;
                    this._last_cx = cx;
                    this._last_cy = cy;
                } else {
                    const dx = targetPt.x - this._anim_ball_x;
                    const dy = targetPt.y - this._anim_ball_y;
                    if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
                        this._anim_ball_x += dx * 0.28;
                        this._anim_ball_y += dy * 0.28;
                        if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                    } else {
                        this._anim_ball_x = targetPt.x;
                        this._anim_ball_y = targetPt.y;
                    }
                }

                const bx = this._anim_ball_x;
                const by = this._anim_ball_y;

                // Capa iluminadora posterior (glow pyxis) perfectamente concéntrica
                ctx.save();
                ctx.shadowColor = "transparent";
                ctx.shadowBlur = 0;
                const glowGrad = ctx.createRadialGradient(bx, by, 0, bx, by, 18);
                glowGrad.addColorStop(0, "rgba(34, 197, 94, 0.70)");
                glowGrad.addColorStop(0.40, "rgba(16, 185, 129, 0.30)");
                glowGrad.addColorStop(1, "rgba(16, 185, 129, 0)");
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(bx, by, 18, 0, Math.PI * 2);
                ctx.fill();

                // Núcleo verde esmeralda vibrante
                ctx.beginPath();
                ctx.arc(bx, by, 6.8, 0, Math.PI * 2);
                ctx.fillStyle = "#10B981";
                ctx.fill();

                // Anillo de borde circular gris metálico claro
                ctx.lineWidth = 1.8;
                ctx.strokeStyle = "#F3F4F6";
                ctx.stroke();
                ctx.restore();

                // 4. Etiqueta "Align" debajo de la matriz
                ctx.save();
                ctx.font = "bold 10px sans-serif";
                ctx.fillStyle = "rgba(156, 163, 175, 0.75)";
                ctx.textAlign = "center";
                var alignLabel = window.PyxisI18n ? window.PyxisI18n.getAlignTitle() : "Align";
                ctx.fillText(alignLabel, cx, cy + sp + 15);
                ctx.restore();

                ctx.restore();
            };

            const oldMouseMove = node.onMouseMove;
            node.onMouseMove = function(e, pos, canvas) {
                if (oldMouseMove && oldMouseMove.call(this, e, pos, canvas)) return true;
                if (this.flags && this.flags.collapsed) return;

                let closestAlign = null;
                let minDist = 15;
                for (let a = 1; a <= 9; a++) {
                    const pt = getGridPointCoords(this, a);
                    const dist = Math.hypot(pos[0] - pt.x, pos[1] - pt.y);
                    if (dist < minDist) {
                        minDist = dist;
                        closestAlign = a;
                    }
                }

                if (this._hovered_align_point !== closestAlign) {

            const oldMouseLeave = node.onMouseLeave;

                    this._hovered_align_point = null;
                    if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                }
            };

            const oldMouseDown = node.onMouseDown;
            node.onMouseDown = function(e, pos, canvas) {
                if (oldMouseDown && oldMouseDown.call(this, e, pos, canvas)) return true;

                if (this._apply_badge_bounds) {
                    const b = this._apply_badge_bounds;
                    if (pos[0] >= b.x && pos[0] <= b.x + b.w &&
                        pos[1] >= b.y && pos[1] <= b.y + b.h) {

                        const modes = ["Sel. Lines", "Style Lines", "All Lines"];
                        let idx = modes.indexOf(this.properties.apply_to);
                        if (idx === -1) idx = 0;
                        const nextIdx = (idx + 1) % modes.length;
                        this.properties.apply_to = modes[nextIdx];

                        if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                        if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                        return true;
                    }
                }

                // Check 3x3 origin align grid clicks
                let closestClick = null;
                let minClickDist = 16;
                for (let a = 1; a <= 9; a++) {
                    const pt = getGridPointCoords(this, a);
                    const dist = Math.hypot(pos[0] - pt.x, pos[1] - pt.y);
                    if (dist < minClickDist) {
                        minClickDist = dist;
                        closestClick = a;
                    }
                }

                if (closestClick !== null) {
                    if (this.properties.origin_align !== closestClick) {
                        this.properties.origin_align = closestClick;
                        if (window.PyxisUndoManager && typeof window.PyxisUndoManager.recordState === "function") {
                            window.PyxisUndoManager.recordState("change_origin_align");
                        }
                        if (this.graph) this.graph.change();
                        if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                        if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                    }
                    return true;
                }
            };

            const oldConfigure = node.onConfigure;
            node.onConfigure = function(info) {
                if (oldConfigure) oldConfigure.call(this, info);
                updateSalidaInputs();
            };

            updateSalidaInputs();
        }

        const WAVEFORM_MODES = [
            { full: "Osciloscopio", short: "Oscillo" },
            { full: "Barras FFT", short: "Bars" },
            { full: "Onda Rellena", short: "Filled" },

        function setupAudioWaveformNode(node) {

            node.computeSize = function() {

                    const tw = getExactTextWidth(val || spec.name, "bold 11px Consolas, monospace");
                    if (tw > max_input_w) max_input_w = tw;

                const neededBoxW = Math.max(65, Math.ceil(max_input_w + 36));
                const rightReserve = 110;
                const req_w = Math.max(225, 22 + neededBoxW + rightReserve);

            node.onConfigure = function(info) {

                ctx.lineWidth = 1.6;

                if (ctx.roundRect) ctx.roundRect(cardX, cardY, cardW, cardH, 10);
                else ctx.rect(cardX, cardY, cardW, cardH);
                ctx.fill();
                ctx.stroke();

                let curShape = String((this.properties && (this.properties.forma || this.properties.shape || this.properties.modo)) || "Circulo");
                let def = getShapeDefinition(curShape);
                if (!def && typeof SHAPES_LIB_GALLERY_DEFINITIONS !== 'undefined') {
                    def = SHAPES_LIB_GALLERY_DEFINITIONS["Circulo"];
                }

                const cardCenterX = cardX + cardW / 2;
                const cardCenterY = cardY + cardH / 2;

                if (curShape.toLowerCase().replace(/[\s\-_áéíóú]/g, '') === "pixel") {
                    // Pixel: Cuadrado verde nítido de 14x14 px relleno y centrado
                    const pw = 14;
                    const ph = 14;
                    ctx.save();
                    ctx.fillStyle = "#a7f3d0";
                    ctx.strokeStyle = "#a7f3d0";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(cardCenterX - pw / 2, cardCenterY - ph / 2, pw, ph, 2);
                    else ctx.rect(cardCenterX - pw / 2, cardCenterY - ph / 2, pw, ph);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                } else if (def && def.path) {
                    if (!this._cachedShapePath || this._cachedShapeKey !== curShape) {
                        const svgD = assPathToSvg(def.path);
                        this._cachedShapePath = new Path2D(svgD);
                        this._cachedShapeKey = curShape;
                    }

                    const bbox = getAssPathBBox(def.path);
                    const availW = cardW - 24;
                    const availH = cardH - 24;
                    const scale = Math.min(availW / bbox.w, availH / bbox.h);

                    ctx.save();
                    ctx.translate(cardCenterX, cardCenterY);
                    ctx.scale(scale, scale);
                    ctx.translate(-bbox.cx, -bbox.cy);

                    ctx.fillStyle = "rgba(139, 92, 246, 0.35)";
                    ctx.strokeStyle = "#a7f3d0";
                    ctx.lineWidth = 3.5 / Math.max(0.01, scale);
                    ctx.lineJoin = "round";
                    ctx.lineCap = "round";
                    ctx.fill(this._cachedShapePath);
                    ctx.stroke(this._cachedShapePath);
                    ctx.restore();
                }
                ctx.restore();

            const oldMouseDown = node.onMouseDown;

            node.onDblClick = function(e, pos) {

        const _PREVIEW_IMG_CACHE = {};
        function loadPreviewImage(nodeObj, pPath) {
            if (!pPath || !nodeObj) return;
            if (_PREVIEW_IMG_CACHE[pPath]) {
                nodeObj._imgObj = _PREVIEW_IMG_CACHE[pPath];

            if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.get_image_file_data_url === 'function') {

                }).catch(() => {

        function setupImgToShapeNode(node) {

            // Handler de clic del ratón para el botón cíclico de modo, slider de GIF y botón manual de recarga (Refresh)
            const oldMouseDown = node.onMouseDown;
            node.onMouseDown = function(e, local_pos, canvas) {
                if (local_pos) {
                    const nodeW = this.size ? this.size[0] : 380;

                                    const scale = (canvasObj.ds && canvasObj.ds.scale) ? canvasObj.ds.scale : 1.0;

                                    const graphX = (eMove.clientX - rect.left) / scale - tx;
                                    const nodeLocalX = graphX - selfNode.pos[0];

                                    const ratio = Math.max(0, Math.min(1, (nodeLocalX - trackX) / Math.max(1, trackW)));
                                    const newFrame = Math.round(1 + ratio * (selfNode._totalFrames - 1));
                                    if (newFrame !== selfNode._currentFrame) {
                                        scheduleImgToShapeFetch(selfNode, newFrame);
                                    }
                                };

                                updateFrameFromEvent(e);

                                const onWindowMove = (eMove) => { updateFrameFromEvent(eMove); };
                                const onWindowUp = (eUp) => {
                                    window.removeEventListener("pointermove", onWindowMove);
                                    window.removeEventListener("pointerup", onWindowUp);
                                    window.removeEventListener("mousemove", onWindowMove);
                                    window.removeEventListener("mouseup", onWindowUp);
                                };

                                window.addEventListener("pointermove", onWindowMove);
                                window.addEventListener("pointerup", onWindowUp);
                                window.addEventListener("mousemove", onWindowMove);
                                window.addEventListener("mouseup", onWindowUp);

                                return true;
                            }
                        }
                    }

                    // Botones ubicados DEBAJO de la tarjeta de previsualización
                    const barY = cardY + cardH + 8;
                    const barH = 18;
                    const btnH = 18;
                    const barTotalW = 150;
                    const barStartX = Math.floor(cardX + (cardW - barTotalW) / 2);

                    const btnW = 118;
                    const btnX = barStartX;
                    const refreshW = 28;
                    const refreshX = barStartX + 122;
                    const pad = 4;

                    if (local_pos[1] >= barY - pad && local_pos[1] <= barY + barH + pad) {
                        // 1. Clic en Botón Cíclico de Vista
                        if (local_pos[0] >= btnX - pad && local_pos[0] <= btnX + btnW + 2) {
                            const VIEW_MODES = ["Superposición", "Imagen", "Vector"];
                            const curV = (this.properties && this.properties.view_mode) ? this.properties.view_mode : "Superposición";
                            let curIdx = VIEW_MODES.indexOf(curV);

            // Cálculo de tamaño 1:1 con tarjeta central y márgenes simétricos

                const req_w = Math.max(380, left_col_end + side_margin + card_w + side_margin + right_col_w, 25 + titleW + 20 + modeW + 14);
                const req_h = Math.max(280, 11 + num_in * 23 + 24);
