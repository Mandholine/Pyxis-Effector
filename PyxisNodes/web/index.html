<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Pyxis Node Engine</title>
    <link rel="stylesheet" type="text/css" href="litegraph.css">
    <link rel="stylesheet" type="text/css" href="pyxis_ui.css">
    <script type="text/javascript" src="litegraph.js"></script>
    <script type="text/javascript" src="i18n.js"></script>
    <script type="text/javascript" src="theme_manager.js"></script>
    <script type="text/javascript" src="libs/artplayer/artplayer.js"></script>
    <script type="text/javascript" src="libs/jassub/jassub.umd.js"></script>
    <script type="text/javascript" src="libs/ace/ace.js"></script>
    <script type="text/javascript" src="libs/ace/ext-language_tools.js"></script>
    <script type="text/javascript" src="libs/ace/mode-python.js"></script>
    <script type="text/javascript" src="libs/ace/mode-lua.js"></script>
    <script type="text/javascript" src="libs/ace/theme-dracula.js"></script>
    <script type="text/javascript" src="libs/ace/snippets/python.js"></script>
    <script type="text/javascript" src="libs/ace/snippets/lua.js"></script>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="shortcut icon" href="icon.png">
</head>
<body>
    <!-- Cosmic Startup Loading Overlay: Deep Nebula, Focused Gas & Slowly Rotating Stars -->
    <div id="pyxis-loading-overlay">
        <div class="pyxis-cosmic-universe">
            <!-- Capa de nebulosa profunda con alto desenfoque -->
            <div class="pyxis-nebula-deep">
                <div class="pyxis-nebula-cloud cloud-1"></div>
                <div class="pyxis-nebula-cloud cloud-2"></div>
                <div class="pyxis-nebula-cloud cloud-3"></div>
                <div class="pyxis-nebula-cloud cloud-4"></div>
            </div>
            <!-- Capa de filamentos de gas más enfocados -->
            <div class="pyxis-gas-upper">
                <div class="pyxis-gas-filament gas-1"></div>
                <div class="pyxis-gas-filament gas-2"></div>
                <div class="pyxis-gas-filament gas-3"></div>
            </div>
            <!-- Partículas blancas de estrellas girando lentamente -->
            <div class="pyxis-starfield starfield-slow">
                <div class="pyxis-stars-layer stars-layer-1"></div>
                <div class="pyxis-stars-layer stars-layer-2"></div>
                <div class="pyxis-stars-layer stars-layer-3"></div>
            </div>
        </div>
        <div class="pyxis-loader-content">
            <img src="loadingB.gif" class="pyxis-loader-gif" alt="Loading..." data-i18n-alt="common.loading">
            <div class="pyxis-loader-title">Pyxis Node Engine</div>
            <div class="pyxis-loader-status" id="pyxis-loader-status-text" data-i18n="loader.status">Initializing Python IPC bridge...</div>
        </div>
    </div>

    <!-- Top Bar: Program-level actions -->
    <div class="top-bar">
        <div class="top-bar-left">
            <div class="brand-title">
                <img src="icon.png" class="brand-icon" style="width: 42px; height: 42px; border-radius: 50%; object-fit: cover;">
                <span>PYXIS EFFECTOR</span>
            </div>
            <span class="brand-badge">v1.0.6</span>

            <!-- Botones de Acción de Programa -->
            <button class="pyxis-btn" id="btn-save-main" onclick="triggerSave()" data-i18n-tooltip="topbar.save_tooltip" data-tooltip="Guardar cambios en la plantilla activa">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                <span data-i18n="topbar.save">Guardar</span>
            </button>

            <button class="pyxis-btn" id="btn-save-as-main" onclick="triggerSaveAs()" data-i18n-tooltip="topbar.save_as_tooltip" data-tooltip="Guardar como archivo externo (.json)">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
                <span data-i18n="topbar.save_as">Guardar como...</span>
            </button>

            <button class="pyxis-btn" id="btn-library-main" onclick="triggerLibrary()" data-i18n-tooltip="topbar.library_tooltip" data-tooltip="Abrir biblioteca de plantillas">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                <span data-i18n="topbar.library">Biblioteca</span>
            </button>

            <button class="pyxis-btn pyxis-btn-icon pyxis-btn-quick-save" id="btn-quick-save-template" onclick="quickSaveActiveTemplate()" style="display: none;" data-i18n-tooltip="topbar.quick_save_tooltip" data-tooltip="Guardar cambios en plantilla de biblioteca">
                <svg class="svg-icon" style="width: 18px; height: 18px; color: #a7f3d0;" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            </button>
        </div>

        <div class="top-bar-right">
            <!-- Settings Button (Gear SVG) -->
            <button class="pyxis-btn pyxis-btn-icon" id="btn-settings-open" onclick="PyxisThemeManager.openSettingsModal();" data-i18n-tooltip="topbar.settings_tooltip" data-tooltip="Ajustes y temas visuales">
                <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>

            <!-- Dynamic Generar Capas Button with Progress Fill & Pre-Estimation -->
            <div class="btn-generate-wrapper" onmouseenter="showWorkloadEstimation(this)" onmouseleave="hideWorkloadEstimation()">
                <button class="btn-generate" id="btn-generate-main" onclick="handleGenerateClick()" onmouseenter="onGenerateBtnHover(true)" onmouseleave="onGenerateBtnHover(false)">
                    <div class="btn-progress-fill" id="btn-progress-bar"></div>
                    <svg class="svg-icon" id="btn-generate-icon" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                    <span id="btn-generate-label" data-i18n="topbar.generate">Generar Capas</span>
                </button>
                <!-- Floating Estimation Tooltip Card -->
                <div id="pyxis-estimation-tooltip" class="pyxis-estimation-card" style="display: none; opacity: 0;">
                    <div class="est-header">
                        <span class="est-title" data-i18n="estimation.title">Estimación de Carga</span>
                        <span class="est-badge" id="est-complexity-badge" data-i18n="estimation.calculating">Calculando...</span>
                    </div>
                    <div class="est-grid">
                        <div class="est-item est-item-main">
                            <span class="est-lbl" data-i18n="estimation.lines_to_generate">Líneas a generar</span>
                            <span class="est-val" id="est-lines-val">--</span>
                        </div>
                        <div class="est-item">
                            <span class="est-lbl" data-i18n="estimation.input_lines">Líneas entrada</span>
                            <span class="est-val" id="est-inputs-val">--</span>
                        </div>
                        <div class="est-item">
                            <span class="est-lbl" data-i18n="estimation.base_units">Unidades base</span>
                            <span class="est-val" id="est-units-val">--</span>
                        </div>
                    </div>
                    <div class="est-alert" id="est-alert-msg" style="display: none;">
                        Carga masiva de eventos. Podría tomar más tiempo de lo habitual.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Workspace & Floating Canvas Toolbar -->
    <div class="workspace">
        <video id="canvas_bg_video" class="canvas-bg-video" autoplay loop muted playsinline style="display: none;"></video>
        <canvas id="canvas_bg_video_tile" class="canvas-bg-video" style="display: none;"></canvas>
        <canvas id="node_canvas"></canvas>
        <div id="pyxis-canvas-players-layer"></div>
        <div class="pyxis-canvas-toolbar">
            <button class="pyxis-tb-btn disabled" id="btn-tb-undo" onclick="window.PyxisUndoManager && window.PyxisUndoManager.undo()" data-i18n-tooltip="toolbar.undo" data-tooltip="Deshacer (Ctrl+Z)" disabled>
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
            </button>
            <button class="pyxis-tb-btn disabled" id="btn-tb-redo" onclick="window.PyxisUndoManager && window.PyxisUndoManager.redo()" data-i18n-tooltip="toolbar.redo" data-tooltip="Rehacer (Ctrl+Y)" disabled>
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
            </button>
            <div class="pyxis-tb-divider"></div>
            <button class="pyxis-tb-btn" onclick="resetView()" data-i18n-tooltip="toolbar.reset_view" data-tooltip="Centrar vista (Inicio)">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </button>
            <button class="pyxis-tb-btn" onclick="zoomIn()" data-i18n-tooltip="toolbar.zoom_in" data-tooltip="Acercar (+)">
                <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            </button>
            <button class="pyxis-tb-btn" onclick="zoomOut()" data-i18n-tooltip="toolbar.zoom_out" data-tooltip="Alejar (-)">
                <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            </button>
            <div class="pyxis-tb-divider"></div>
            <button class="pyxis-tb-btn" onclick="loadDefaultGraph(); resetView();" data-i18n-tooltip="toolbar.load_default" data-tooltip="Restablecer preset por defecto">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
        </div>
    </div>

    <script>
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            const errStr = `${msg} at ${lineNo}:${columnNo}`;
            console.error("[Pyxis JS ERROR]", errStr, error);
            if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.log_js_error === "function") {
                window.pywebview.api.log_js_error(errStr);
            }
            return false;
        };

        window.gridMode = 0;
        window.backgroundImageSettings = {
            path: "",
            mode: "contain",
            opacity: 0.5
        };
        let bgImageElement = null;

        function normalizeSize(size, defaultW, defaultH) {
            if (Array.isArray(size) && size.length >= 2) {
                return [Number(size[0]), Number(size[1])];
            }
            if (size && typeof size === "object") {
                let w = Number(size[0] !== undefined ? size[0] : (size["0"] !== undefined ? size["0"] : defaultW));
                let h = Number(size[1] !== undefined ? size[1] : (size["1"] !== undefined ? size["1"] : defaultH));
                return [w, h];
            }
            return [defaultW, defaultH];
        }

        // Toast Notification System (Compact & Elegant with i18n support)
        function showPyxisToast(message, type = "success", duration = 2400, params = null) {
            let toastContainer = document.getElementById("pyxis-toast-container");
            if (!toastContainer) {
                toastContainer = document.createElement("div");
                toastContainer.id = "pyxis-toast-container";
                toastContainer.style.cssText = "position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 6px; pointer-events: none;";
                document.body.appendChild(toastContainer);
            }

            const isKey = typeof message === "string" && (message.startsWith("toast.") || message.startsWith("preview.") || message.startsWith("common."));
            const finalMsg = (window.t && isKey) ? window.t(message, params) : message;

            const toast = document.createElement("div");
            let bgColor = "#064e3b";
            let borderColor = "#10b981";
            let textColor = "#a7f3d0";
            let iconSvg = `<svg style="width:14px;height:14px;color:#10b981;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;

            if (type === "loading") {
                bgColor = "#082f49";
                borderColor = "#0284c7";
                textColor = "#bae6fd";
                iconSvg = `<svg class="pyxis-spin" style="width:14px;height:14px;color:#38bdf8;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>`;
            } else if (type === "source" || type === "note" || type === "info") {
                bgColor = "#064e3b";
                borderColor = "#10b981";
                textColor = "#a7f3d0";
                iconSvg = `<svg style="width:14px;height:14px;color:#10b981;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>`;
            } else if (type === "warning") {
                bgColor = "#78350f";
                borderColor = "#f59e0b";
                textColor = "#fde68a";
                iconSvg = `<svg style="width:14px;height:14px;color:#f59e0b;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 1 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;
            } else if (type === "error") {
                bgColor = "#7f1d1d";
                borderColor = "#ef4444";
                textColor = "#fca5a5";
                iconSvg = `<svg style="width:14px;height:14px;color:#ef4444;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;
            }

            toast.style.cssText = `background: ${bgColor}; border: 1px solid ${borderColor}; color: ${textColor}; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; font-family: sans-serif; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.4); pointer-events: auto; opacity: 0; transform: translateY(8px); transition: all 0.2s ease;`;
            toast.innerHTML = `${iconSvg}<span ${isKey ? `data-i18n="${message}"` : ""}>${finalMsg}</span>`;
            
            toastContainer.appendChild(toast);

            requestAnimationFrame(() => {
                toast.style.opacity = "1";
                toast.style.transform = "translateY(0)";
            });

            let dismissTimer = null;
            if (duration > 0) {
                dismissTimer = setTimeout(() => {
                    toast.style.opacity = "0";
                    toast.style.transform = "translateY(8px)";
                    setTimeout(() => toast.remove(), 200);
                }, duration);
            }

            return {
                element: toast,
                close: function() {
                    if (dismissTimer) clearTimeout(dismissTimer);
                    toast.style.opacity = "0";
                    toast.style.transform = "translateY(8px)";
                    setTimeout(() => toast.remove(), 200);
                }
            };
        }
        window.showPyxisToast = showPyxisToast;

        function updateTemplateUIState() {
            const btnTop = document.getElementById("btn-quick-save-template");
            if (window.__pyxis_is_loading_template) {
                if (btnTop) btnTop.style.display = "none";
                return;
            }

            const activeId = window.__pyxis_active_template_id;
            const activeName = window.__pyxis_active_template_name;

            if (!btnTop) return;

            if (!activeId || !activeName) {
                btnTop.style.display = "none";
                return;
            }

            let hasChanges = false;
            if (typeof window.has_template_changes === "function") {
                hasChanges = window.has_template_changes();
            } else {
                hasChanges = true;
            }

            if (hasChanges) {
                if (btnTop.style.display !== "inline-flex") {
                    btnTop.style.display = "inline-flex";
                }
                btnTop.setAttribute("data-tooltip", `Guardar cambios en "${activeName}" (1 clic)`);
            } else {
                btnTop.style.display = "none";
            }
        }
        window.updateTemplateUIState = updateTemplateUIState;

        window.addEventListener("mouseup", () => setTimeout(updateTemplateUIState, 50));
        window.addEventListener("keyup", () => setTimeout(updateTemplateUIState, 50));

        async function quickSaveActiveTemplate() {
            const activeId = window.__pyxis_active_template_id;
            const activeName = window.__pyxis_active_template_name;

            if (!activeId || !activeName) {
                if (typeof window.open_template_save_dialog === "function") {
                    window.open_template_save_dialog();
                }
                return;
            }

            if (!window.graph || typeof window.graph.serialize !== "function") return;

            if (typeof window.syncWidgetsToProperties === "function") {
                window.syncWidgetsToProperties();
            }

            const serialized = window.graph.serialize();
            if (!serialized || !Array.isArray(serialized.nodes) || serialized.nodes.length === 0) {
                showPyxisToast("toast.graph_empty", "warning");
                return;
            }

            try {
                if (window.pywebview && window.pywebview.api && window.pywebview.api.save_template) {
                    const meta = await window.pywebview.api.save_template(activeName, "", serialized, activeId);
                    window.__pyxis_active_template_id = meta.template_id;
                    window.__pyxis_active_template_name = meta.name;
                    if (meta.template_id) {
                        localStorage.setItem("pyxis_active_template_id", meta.template_id);
                        localStorage.setItem("pyxis_active_template_name", meta.name);
                        localStorage.setItem("pyxis_last_used_template_id", meta.template_id);
                    }
                    if (typeof window.syncWidgetsToProperties === "function") {
                        window.syncWidgetsToProperties();
                    }
                    if (typeof window.update_checkpoint === "function") {
                        window.update_checkpoint();
                    } else if (typeof window.update_template_checkpoint === "function") {
                        window.update_template_checkpoint();
                    }
                    if (typeof window.__pyxis_schedule_save === "function") {
                        window.__pyxis_schedule_save(50);
                    }
                    const btnTop = document.getElementById("btn-quick-save-template");
                    if (btnTop) btnTop.style.display = "none";
                    updateTemplateUIState();
                    showPyxisToast("toast.template_saved", "success");
                }
            } catch (err) {
                console.error("Pyxis: Error al guardar cambios en la plantilla", err);
                showPyxisToast("toast.template_save_error", "error");
            }
        }
        window.quickSaveActiveTemplate = quickSaveActiveTemplate;

        let __pyxis_save_timer = null;
        function scheduleSessionSave(delayMs = 100) {
            if (window.__pyxis_is_loading_template || !window.graph || typeof window.graph.serialize !== "function") return;
            if (__pyxis_save_timer) clearTimeout(__pyxis_save_timer);
            __pyxis_save_timer = setTimeout(async () => {
                __pyxis_save_timer = null;
                try {
                    if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.save_session === "function") {
                        if (typeof window.syncWidgetsToProperties === "function") {
                            window.syncWidgetsToProperties();
                        }
                        const serialized = window.graph.serialize();
                        if (serialized && Array.isArray(serialized.nodes) && serialized.nodes.length > 0) {
                            if (!serialized.extra) serialized.extra = {};
                            serialized.extra.active_template_id = window.__pyxis_active_template_id || null;
                            serialized.extra.active_template_name = window.__pyxis_active_template_name || null;
                            await window.pywebview.api.save_session(serialized);
                        }
                    }
                } catch (e) {
                    console.warn("[Pyxis scheduleSessionSave warning]", e);
                }
            }, delayMs);
        }
        window.__pyxis_schedule_save = scheduleSessionSave;

        // Trigger Handlers para los Botones de Programa
        function triggerSave() {
            if (typeof window.open_save_dialog === "function") {
                window.open_save_dialog();
            } else {
                alert("El módulo de guardado se está inicializando...");
            }
        }

        function triggerSaveAs() {
            if (typeof window.open_save_as_dialog === "function") {
                window.open_save_as_dialog();
            } else {
                alert("El módulo de guardado se está inicializando...");
            }
        }

        function triggerLibrary() {
            if (typeof window.open_template_library_modal === "function") {
                window.open_template_library_modal();
            } else {
                alert("La biblioteca de plantillas se está inicializando...");
            }
        }

        if (LiteGraph.clearRegisteredTypes) LiteGraph.clearRegisteredTypes();
        else LiteGraph.registered_node_types = {};

        // Configuración Global de LiteGraph para Alto Contraste y Dimensiones Ajustadas
        LiteGraph.NODE_TITLE_COLOR = "#FFFFFF";

        // --- MOTOR DE DESHACER / REHACER PROFESIONAL (UNDO / REDO ENGINE) ---

            function updateUI() {
                const btnUndo = document.getElementById("btn-tb-undo");
                const btnRedo = document.getElementById("btn-tb-redo");

                const undoPossible = canUndo();
                const redoPossible = canRedo();

                if (btnUndo) {
                    btnUndo.disabled = !undoPossible;
                    if (undoPossible) {
                        btnUndo.classList.remove("disabled");
                    } else {
                        btnUndo.classList.add("disabled");

                if (btnRedo) {
                    btnRedo.disabled = !redoPossible;

            function canUndo() {
                return pointer > 0;

            function canRedo() {
                return pointer >= 0 && pointer < history.length - 1;

            function recordState(reason) {
                if (isExecuting || window.__pyxis_is_loading_template || !window.graph) return;

                const currentSnap = getSnapshot();
                if (!currentSnap) return;

                if (pointer >= 0 && history[pointer] === currentSnap) {

                    }
                    return;
                }

                if (pointer < history.length - 1) {

                }

                history.push(currentSnap);

                cleanHistory();
                updateUI();

                if (typeof window.updateTemplateUIState === "function") {

            function scheduleRecordState(delayMs = 100) {

                if (batchTimer) clearTimeout(batchTimer);

            function initInitialState() {

            function undo() {

                    }
                    updateUI();
                    return;
                }

                if (batchTimer) {
                    clearTimeout(batchTimer);
                    batchTimer = null;
                }

                isExecuting = true;
                try {
                    pointer--;
                    const targetSnap = history[pointer];
                    const parsed = JSON.parse(targetSnap);
                    if (window.canvas && typeof window.canvas.deselectAllNodes === "function") {
                        window.canvas.deselectAllNodes();
                    }
                    window.graph.clear();
                    window.graph.configure(parsed);

                    if (typeof window.syncWidgetsToProperties === "function") {

                    }
                    if (typeof window.updateTemplateUIState === "function") {

                } finally {

                    if (batchTimer) {
                        clearTimeout(batchTimer);
                        batchTimer = null;
                    }

                }
            }

            function redo() {

        function closeAllActiveNodeEditors(save = true) {

        let currentPromptFinish = null;

        LGraphCanvas.prototype.prompt = function(title, value, callback, event, multiline) {
            if (currentPromptFinish) {
                currentPromptFinish(true);

            const canvasEl = this.canvas;
            if (!canvasEl) return;
            const rect = canvasEl.getBoundingClientRect();
            const scale = this.ds.scale || 1.0;
            const offset = this.ds.offset || [0, 0];

            if (event && this.graph) {
                const mouseCanvasX = (event.clientX - rect.left - offset[0] * scale) / scale;
                const mouseCanvasY = (event.clientY - rect.top - offset[1] * scale) / scale;

            const node = (clickedNode)
                ? clickedNode
                : ((this.node_widget && this.node_widget[0])

                        ? Object.values(this.selected_nodes)[0]

            let widget = (clickedNode && clickedNode === (this.node_widget && this.node_widget[0])) ? this.node_widget[1] : null;

                node.title === "Interpolador Tiempo" ||

                node.title === "IMG to Shape" ||
                node.title === "Bezier Curve" ||
                node.title === "Curva Bézier" ||
                node.title === "Text on Path" ||
                node.title === "Concentric Borders" ||
                node.title === "Bordes Concéntricos" ||
                (node.type && (
                    String(node.type).includes("Polares") ||
                    String(node.type).includes("Concatenate") ||
                    String(node.type).includes("Previewer") ||
                    String(node.type).includes("Text to Shape") ||
                    String(node.type).includes("Text on Path") ||
                    String(node.type).includes("Concentric") ||
                    String(node.type).includes("Bordes") ||
                    String(node.type).includes("IMG to Shape") ||
                    String(node.type).includes("Bezier") ||
                    String(node.type).includes("Curva") ||
                    String(node.type).includes("preview") ||
                    String(node.type).includes("Time") ||
                    String(node.type).includes("Audio") ||
                    String(node.type).includes("Interpolator")
                ))
            ));
            const isInlineWidgetNode = isSalidaNode || isPolaresNode;
            const promptMargin = isInlineWidgetNode ? 22 : 12;

            if (node && node.pos) {
                const nodeScreenX = rect.left + (node.pos[0] + offset[0]) * scale;
                const nodeScreenY = rect.top + (node.pos[1] + offset[1]) * scale;
                
                const lastY = (widget && widget.last_y !== undefined) ? widget.last_y : null;
                const wY = lastY !== null ? (lastY * scale) : (38 * scale);
                const wX = promptMargin * scale;
                
                if (isSalidaNode) {
                    const minSalidaBoxW = 75;
                    const promptVal = (widget && widget.value !== undefined && widget.value !== null)
                        ? String(widget.value)
                        : (value !== undefined && value !== null ? String(value) : "");
                    const dispText = promptVal.length > 0 ? promptVal : (widget ? widget.name || title || "" : title || "");
                    const tw = (typeof getExactTextWidth === "function") ? getExactTextWidth(dispText, "bold 11px Consolas, monospace") : (dispText.length * 6.0);
                    const calcW = Math.max(minSalidaBoxW, Math.ceil(tw + 25));
                    const maxW = Math.max(minSalidaBoxW, (node.size ? node.size[0] : 200) - promptMargin - 20);
                    widgetW = Math.min(maxW, calcW) * scale;
                    widgetH = 18 * scale;
                } else if (isPolaresNode) {
                    const promptVal = (widget && widget.value !== undefined && widget.value !== null)
                        ? String(widget.value)
                        : (value !== undefined && value !== null ? String(value) : "");
                    const dispText = promptVal.length > 0 ? promptVal : (widget ? widget.name || title || "" : title || "");
                    const tw = (typeof getExactTextWidth === "function") ? getExactTextWidth(dispText, "bold 11px Consolas, monospace") : (dispText.length * 6.0);
                    const calcW = Math.max(65, Math.ceil(tw + 36));
                    const maxW = Math.max(50, (node.size ? node.size[0] : 200) - promptMargin - 20);
                    widgetW = Math.min(maxW, calcW) * scale;
                    widgetH = 18 * scale;
                } else if (isInlineWidgetNode) {
                    const promptVal = (widget && widget.value !== undefined && widget.value !== null)
                        ? String(widget.value)
                        : (value !== undefined && value !== null ? String(value) : "");
                    const dispText = promptVal.length > 0 ? promptVal : (widget ? widget.name || title || "" : title || "");
                    const calcW = Math.max(120, dispText.length * 8.5 + 24);
                    widgetW = Math.min(node.size[0] - promptMargin - 12, calcW) * scale;
                    widgetH = 26 * scale;
                } else {
                    widgetW = (node.size[0] - 24) * scale;

        // --- CONTROLES DE CANVAS ---
        function resetView() {

            canvas.resize();
            const w = (canvas.canvas.offsetWidth > 0) ? canvas.canvas.offsetWidth : (canvas.canvas.width > 0 ? canvas.canvas.width : 1280);
            const h = (canvas.canvas.offsetHeight > 0) ? canvas.canvas.offsetHeight : (canvas.canvas.height > 0 ? canvas.canvas.height : 720);
            
            canvas.ds.scale = 1.0;
            if (graph._nodes && graph._nodes.length > 0) {
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                for (let i = 0; i < graph._nodes.length; ++i) {
                    let n = graph._nodes[i];
                    let sz = normalizeSize(n.size, 200, 100);
                    let nw = sz[0];
                    let nh = sz[1];
                    if (!n.pos || !Array.isArray(n.pos) || isNaN(n.pos[0]) || isNaN(n.pos[1])) {
                        n.pos = [200 + i * 250, 250];
                    }
                    if (n.pos[0] < minX) minX = n.pos[0];
                    if (n.pos[1] < minY) minY = n.pos[1];
                    if (n.pos[0] + nw > maxX) maxX = n.pos[0] + nw;
                    if (n.pos[1] + nh > maxY) maxY = n.pos[1] + nh;
                }
                let centerX = (minX + maxX) / 2;
                let centerY = (minY + maxY) / 2;
                canvas.ds.offset = [ Math.round((w / 2) - centerX), Math.round((h / 2) - centerY) ];
            } else {
                canvas.ds.offset = [0, 0];
            }
            canvas.setDirty(true, true);
        }

            if (videoEl && typeof videoEl.cancelVideoFrameCallback === "function" && videoTileCallbackId !== null) {

        function startVideoTileLoop() {
            if (videoTileLoopActive) return;
            videoTileLoopActive = true;
            const videoEl = document.getElementById("canvas_bg_video");
            const tileCanvas = document.getElementById("canvas_bg_video_tile");
            if (!videoEl || !tileCanvas) return;
            const ctx = tileCanvas.getContext("2d");

            function onFrame() {
                if (!videoTileLoopActive) return;
                const bgSettings = window.backgroundImageSettings || {};
                if (!bgSettings.hasBg || bgSettings.mode !== "tile") {
                    videoTileLoopActive = false;
                    return;
                }
                const cw = tileCanvas.clientWidth || window.innerWidth;
                const ch = tileCanvas.clientHeight || window.innerHeight;
                if (tileCanvas.width !== cw || tileCanvas.height !== ch) {
                    tileCanvas.width = cw;
                    tileCanvas.height = ch;
                }
                if (videoEl.videoWidth > 0 && videoEl.videoHeight > 0) {
                    ctx.clearRect(0, 0, tileCanvas.width, tileCanvas.height);
                    try {
                        const pattern = ctx.createPattern(videoEl, "repeat");
                        if (pattern) {
                            ctx.fillStyle = pattern;
                            ctx.fillRect(0, 0, tileCanvas.width, tileCanvas.height);
                        }
                    } catch(e) {}
                }
                if (typeof videoEl.requestVideoFrameCallback === "function") {
                    videoTileCallbackId = videoEl.requestVideoFrameCallback(onFrame);
                } else {
                    videoTileCallbackId = requestAnimationFrame(onFrame);
                }
            }

            if (typeof videoEl.requestVideoFrameCallback === "function") {
                videoTileCallbackId = videoEl.requestVideoFrameCallback(onFrame);
            } else {
                videoTileCallbackId = requestAnimationFrame(onFrame);

        window.updateBgMediaElement = function() {
            const videoEl = document.getElementById("canvas_bg_video");
            const tileCanvas = document.getElementById("canvas_bg_video_tile");
            if (!videoEl) return;
            const bgSettings = window.backgroundImageSettings || {};
            const isVideoBg = bgSettings.hasBg && (bgSettings.mediaType === "video" || bgSettings.videoUrl);
            if (isVideoBg && bgSettings.videoUrl) {
                const vUrl = bgSettings.videoUrl;
                videoEl.muted = true;
                videoEl.loop = true;
                videoEl.playsInline = true;
                videoEl.setAttribute("playsinline", "");
                videoEl.setAttribute("muted", "");
                videoEl.setAttribute("loop", "");
                if (bgSettings.posterUrl) {

                const activeTheme = (window.PyxisThemeManager && PyxisThemeManager.getCurrentTheme()) || "teal";
                const allThemes = (window.PyxisThemeManager && PyxisThemeManager.getAllThemes()) || {};
                const themeData = allThemes[activeTheme] || (window.PyxisThemeManager && PyxisThemeManager.THEMES[activeTheme]) || {};
                const themeBg = themeData.canvasBg || "#081116";

                videoEl.style.backgroundColor = themeBg;
                if (tileCanvas) tileCanvas.style.backgroundColor = themeBg;

                const mode = bgSettings.mode || "contain";

                if (mode === "tile") {

                    startVideoTileLoop();

                    videoEl.style.display = "block";
                    videoEl.style.opacity = opacity;

                    if (mode === "cover") {
                        videoEl.style.objectFit = "cover";
                        videoEl.style.objectPosition = "center";
                    } else if (mode === "stretch") {
                        videoEl.style.objectFit = "fill";
                        videoEl.style.objectPosition = "center";
                    } else if (mode === "center") {

                        videoEl.style.objectFit = "contain";

                if (videoEl.src !== vUrl) {
                    videoEl.src = vUrl;

        canvas.onRenderBackground = function(html_canvas, ctx) {
            try {
                ctx.save();
                const activeTheme = (window.PyxisThemeManager && PyxisThemeManager.getCurrentTheme()) || "teal";
                const allThemes = (window.PyxisThemeManager && PyxisThemeManager.getAllThemes()) || {};
                const themeData = allThemes[activeTheme] || (window.PyxisThemeManager && PyxisThemeManager.THEMES[activeTheme]) || {};
                const themeBg = themeData.canvasBg || "#081116";

                const bgSettings = window.backgroundImageSettings || {};
                const isVideoBg = bgSettings.hasBg && (bgSettings.mediaType === "video" || bgSettings.videoUrl);

                if (isVideoBg) {
                    // Limpieza transparente para que el video nativo acelerado por GPU se vea fluido detrás
                    ctx.clearRect(0, 0, html_canvas.width, html_canvas.height);
                } else {
                    // 1. Pintar el color de fondo del tema
                    ctx.fillStyle = themeBg;
                    ctx.fillRect(0, 0, html_canvas.width, html_canvas.height);

                    // 2. Pintar la imagen de fondo si está seleccionada
                    if (bgSettings.dataUrl) {
                        const dataUrl = bgSettings.dataUrl;
                        if (!bgImageElement || bgImageElement.src !== dataUrl) {
                            bgImageElement = new Image();
                            bgImageElement.onload = function() {
                                if (canvas) { canvas.setDirty(true, true); canvas.draw(true, true); }
                            };
                            bgImageElement.src = dataUrl;
                        }
                        if (bgImageElement.complete && bgImageElement.naturalWidth > 0) {
                            ctx.globalAlpha = Math.min(1.0, Math.max(0.0, bgSettings.opacity));
                            
                            const w = html_canvas.width;
                            const h = html_canvas.height;
                            const imgW = bgImageElement.naturalWidth;
                            const imgH = bgImageElement.naturalHeight;
                            const mode = bgSettings.mode || "contain";

                            if (mode === "stretch") {
                                ctx.drawImage(bgImageElement, 0, 0, w, h);
                            } else if (mode === "center") {
                                ctx.drawImage(bgImageElement, (w - imgW) / 2, (h - imgH) / 2, imgW, imgH);
                            } else if (mode === "tile") {
                                const pattern = ctx.createPattern(bgImageElement, "repeat");
                                if (pattern) {
                                    ctx.fillStyle = pattern;
                                    ctx.fillRect(0, 0, w, h);
                                }
                            } else if (mode === "contain" || mode === "cover") {
                                const scaleX = w / imgW;
                                const scaleY = h / imgH;
                                const scale = (mode === "contain") ? Math.min(scaleX, scaleY) : Math.max(scaleX, scaleY);
                                const drawW = imgW * scale;
                                const drawH = imgH * scale;
                                ctx.drawImage(bgImageElement, (w - drawW) / 2, (h - drawH) / 2, drawW, drawH);
                            }
                        }
                    }
                }
            } catch (err) {
                console.error("Pyxis BG Render Error:", err);
            } finally {
                ctx.globalAlpha = 1.0;
                ctx.restore();
                ctx.globalAlpha = 1.0;
            }
            return true;
        };

        canvas.onDrawBackground = function(ctx, visible_area) {
            try {
                if (window.gridMode === 2) return;

                const step = 20;
                const majorStep = 100;
                const startX = Math.floor(visible_area[0] / step) * step;
                const endX = Math.ceil((visible_area[0] + visible_area[2]) / step) * step;
                const startY = Math.floor(visible_area[1] / step) * step;
                const endY = Math.ceil((visible_area[1] + visible_area[3]) / step) * step;

                if (window.gridMode === 0) {
                    // Rejilla de Líneas Vectoriales
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.04)";
                    ctx.beginPath();
                    for (let x = startX; x <= endX; x += step) {
                        if (x % majorStep !== 0) {
                            ctx.moveTo(x, startY); ctx.lineTo(x, endY);
                        }
                    }
                    for (let y = startY; y <= endY; y += step) {
                        if (y % majorStep !== 0) {
                            ctx.moveTo(startX, y); ctx.lineTo(endX, y);
                        }
                    }
                    ctx.stroke();

                    ctx.strokeStyle = "rgba(255, 255, 255, 0.09)";
                    ctx.beginPath();
                    for (let x = startX; x <= endX; x += step) {
                        if (x % majorStep === 0) {
                            ctx.moveTo(x, startY); ctx.lineTo(x, endY);
                        }
                    }
                    for (let y = startY; y <= endY; y += step) {
                        if (y % majorStep === 0) {
                            ctx.moveTo(startX, y); ctx.lineTo(endX, y);
                        }
                    }
                    ctx.stroke();
                } else if (window.gridMode === 1) {
                    // Rejilla de Puntos
                    ctx.fillStyle = "rgba(255, 255, 255, 0.18)";
                    for (let x = startX; x <= endX; x += step) {
                        for (let y = startY; y <= endY; y += step) {
                            ctx.fillRect(x - 0.75, y - 0.75, 1.5, 1.5);
                        }
                    }
                }
            } catch (err) {
                console.error("Pyxis Grid Draw Error:", err);
            }
        };

        function updateEstimationUI(data) {

            const badge = document.getElementById("est-complexity-badge");

            const unitLin = window.t ? window.t("estimation.unit_lines") : "lín";
            const unitU = window.t ? window.t("estimation.unit_units") : "u";

            if (linesVal) linesVal.innerText = (data.estimated_lines || 0).toLocaleString() + " " + unitLin;
            if (inputsVal) inputsVal.innerText = (data.input_lines || 0) + " " + unitLin;
            if (unitsVal) unitsVal.innerText = (data.base_units || 0) + " " + unitU;
            if (badge) {
                let badgeText = data.complexity || "Normal";
                const compStr = String(data.complexity_key || data.complexity || "").toLowerCase();
                if (window.t) {
                    if (compStr === "baja" || compStr === "low") {
                        badgeText = window.t("estimation.complexity_low");
                    } else if (compStr === "normal" || compStr === "media" || compStr === "medium" || compStr === "med") {
                        badgeText = window.t("estimation.complexity_normal");
                    } else if (compStr === "alta" || compStr === "high") {
                        badgeText = window.t("estimation.complexity_high");
                    } else if (compStr === "extrema" || compStr === "extreme") {

        window.__pyxis_on_progress = function (data) {
            if (typeof data === "number") {
                const numP = Math.min(100, Math.max(0, Math.floor(data)));
                targetP = Math.max(targetP, numP);
            } else if (typeof data === "object" && data !== null) {
                const pVal = (data.percent !== undefined) ? data.percent : (data.pct || 0);
                const numP = Math.min(100, Math.max(0, Math.floor(pVal)));
                targetP = Math.max(targetP, numP);
                if (data.lines_generated !== undefined) {
                    generatedLinesCount = Math.max(generatedLinesCount, data.lines_generated);
                }
                if (data.phase) {
                    currentProgressPhase = data.phase;
                }
                if (data.speed) {
                    currentProgressSpeed = data.speed;
                }
            }
        };

                if (label) label.innerText = "Deteniendo...";
                if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.cancel_generation === "function") {

        function applyGraph() {
            hideWorkloadEstimation();
            syncWidgetsToProperties();
            const wrapper = document.querySelector(".btn-generate-wrapper");
            const btn = document.getElementById("btn-generate-main");
            const label = document.getElementById("btn-generate-label");
            const progressBar = document.getElementById("btn-progress-bar");

            isGenerating = true;
            cancelRequested = false;
            currentP = 1;
            targetP = 1;
            generatedLinesCount = 0;
            let displayLines = 0;
            currentProgressPhase = "Iniciando generación...";
            currentProgressSpeed = 0;
            const startTime = performance.now();

            if (wrapper) wrapper.classList.add("generating");
            if (btn) btn.classList.add("generating");
            if (progressBar) {
                progressBar.style.width = "1%";
                progressBar.style.background = "";
            }
            if (label) label.innerText = "Iniciando...";

            const renderInterval = setInterval(() => {
                if (!isGenerating) {
                    clearInterval(renderInterval);
                    return;
                }
                const diff = targetP - currentP;
                if (diff > 0) {
                    currentP += Math.max(0.5, diff * 0.22);
                } else if (diff < 0) {
                    currentP = targetP;
                }

                if (generatedLinesCount > displayLines) {
                    displayLines += Math.max(1, Math.ceil((generatedLinesCount - displayLines) * 0.35));
                } else {
                    displayLines = generatedLinesCount;
                }
                
                const displayVal = Math.min(99, Math.floor(currentP));
                if (progressBar) progressBar.style.width = displayVal + "%";
                if (label) {
                    const unitLin = window.t ? window.t("estimation.unit_lines") : "lín";
                    if (cancelRequested) {
                        label.innerText = window.t ? window.t("topbar.stopping") : "Deteniendo...";
                    } else if (isHoveringGenerateBtn) {
                        label.innerText = window.t ? window.t("topbar.stop") : "Detener";
                    } else if (displayLines > 0) {
                        const lStr = Math.floor(displayLines).toLocaleString();
                        if (currentProgressSpeed > 0) {
                            label.innerText = `${lStr} ${unitLin} (${displayVal}%) • ${currentProgressSpeed.toLocaleString()} l/s`;
                        } else {
                            label.innerText = `${lStr} ${unitLin} (${displayVal}%)`;
                        }
                    } else if (currentProgressPhase) {
                        label.innerText = `${currentProgressPhase} (${displayVal}%)`;
                    } else {
                        const genText = window.t ? window.t("topbar.generating") : "Generando...";
                        label.innerText = `${genText} ${displayVal}%`;
                    }
                }
            }, 25);

            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.process_graph(graph.serialize()).then((res) => {
                    const elapsed = (performance.now() - startTime) / 1000.0;
                    if (res && res.cancelled) {
                        clearInterval(renderInterval);
                        finishGeneration(res, elapsed);
                        return;
                    }
                    targetP = 100;
                    const finishCheckInterval = setInterval(() => {
                        if (currentP >= 98 || !isGenerating) {
                            clearInterval(finishCheckInterval);
                            clearInterval(renderInterval);
                            currentP = 100;
                            finishGeneration(res, elapsed);
                        }
                    }, 30);
                }).catch(err => {
                    console.error("Error al procesar el grafo:", err);
                    clearInterval(renderInterval);
                    finishGeneration({ success: false, error: String(err) }, 0);
                });
            } else {
                const interval = setInterval(() => {
                    if (cancelRequested) {
                        clearInterval(interval);
                        clearInterval(renderInterval);
                        finishGeneration({ success: false, cancelled: true }, 0);
                        return;
                    }
                    targetP += 3;
                    generatedLinesCount += 120;
                    if (targetP >= 100) {
                        clearInterval(interval);
                        clearInterval(renderInterval);
                        targetP = 100; currentP = 100;
                        const elapsed = (performance.now() - startTime) / 1000.0;
                        finishGeneration({ success: true, lines_generated: generatedLinesCount }, elapsed);
                    }
                }, 35);
            }
        }

        function finishGeneration(result, elapsedSeconds) {
            const wrapper = document.querySelector(".btn-generate-wrapper");
            const btn = document.getElementById("btn-generate-main");
            const label = document.getElementById("btn-generate-label");
            const progressBar = document.getElementById("btn-progress-bar");

            const isCancel = cancelRequested || (result && result.cancelled);
            const isError = result && result.success === false && !isCancel;

            if (progressBar) {
                progressBar.style.width = "100%";
                if (isCancel) {
                    progressBar.style.background = "linear-gradient(90deg, #f43f5e, #e11d48)";
                } else if (isError) {
                    progressBar.style.background = "linear-gradient(90deg, #ef4444, #b91c1c)";
                } else {
                    progressBar.style.background = "linear-gradient(90deg, #10b981, #059669)";
                }
            }

            if (label) {
                if (isCancel) {
                    label.innerText = "Generación cancelada";
                } else if (isError) {
                    label.innerText = "Error en generación";
                } else {
                    const finalTotal = (result && result.lines_generated !== undefined) ? result.lines_generated : generatedLinesCount;
                    const timeStr = elapsedSeconds > 0 ? ` (${elapsedSeconds.toFixed(1)}s)` : "";
                    label.innerText = `¡${finalTotal.toLocaleString()} líneas creadas!${timeStr}`;
                }
            }

            if (isCancel || isError) {
                // Al cancelar o dar error: Pyxis NO se cierra. Se restablece el botón para que el usuario pueda seguir editando.
                setTimeout(() => {
                    isGenerating = false;
                    cancelRequested = false;
                    generatedLinesCount = 0;
                    currentProgressPhase = "";
                    currentProgressSpeed = 0;
                    if (wrapper) wrapper.classList.remove("generating");
                    if (btn) btn.classList.remove("generating");
                    if (progressBar) {
                        progressBar.style.width = "0%";
                        progressBar.style.background = "";
                    }
                    if (label) label.innerText = "Generar Capas";
                }, 1500);
            } else {
                // Éxito: Retener 2.2 segundos para mostrar el total de líneas y luego ocultar ventana
                setTimeout(() => {
                    if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.complete_and_hide === "function") {
                        window.pywebview.api.complete_and_hide();
                    }

                    isGenerating = false;
                    cancelRequested = false;
                    generatedLinesCount = 0;
                    currentProgressPhase = "";
                    currentProgressSpeed = 0;
                    if (wrapper) wrapper.classList.remove("generating");
                    if (btn) btn.classList.remove("generating");
                    if (progressBar) {
                        progressBar.style.width = "0%";
                        progressBar.style.background = "";
                    }
                    if (label) label.innerText = "Generar Capas";
                }, 2200);
            }
        }

        function openInlineMultilineEditor(node, propertyName, titleName) {
            const canvasEl = LGraphCanvas.active_canvas ? LGraphCanvas.active_canvas.canvas : null;

            overlay.style.outline = "none";
            overlay.style.resize = "none";
            overlay.style.display = "block";

            overlay.value = curVal;

            const syncOverlayHeight = () => {
                const lCount = Math.max(1, overlay.value.split('\n').length);
                const newH = (lCount * 18 + 12) * scale;
                overlay.style.height = Math.max(26 * scale, newH) + "px";
                node.properties[propertyName] = overlay.value;
                if (node.computeSize) node.size = node.computeSize();
                if (canvasObj.setDirtyCanvas) canvasObj.setDirtyCanvas(true, true);
            };

            overlay.oninput = syncOverlayHeight;

            setTimeout(() => {
                overlay.focus();
                const len = overlay.value ? overlay.value.length : 0;
                if (typeof overlay.setSelectionRange === "function") {
                    overlay.setSelectionRange(len, len);
                }
            }, 10);

            let submitted = false;
            const finish = (save) => {
                if (submitted) return;
                submitted = true;
                overlay.style.display = "none";
                overlay.onkeydown = null;
                overlay.onblur = null;
                overlay.oninput = null;
                overlay._finish = null;

                if (save) {
                    node.properties[propertyName] = overlay.value;
                    if (node.computeSize) node.size = node.computeSize();
                    if (canvasObj.setDirtyCanvas) canvasObj.setDirtyCanvas(true, true);
                }
            };
            overlay._finish = finish;

            overlay.onkeydown = function(e) {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    finish(true);
                } else if (e.key === "Escape") {
                    e.preventDefault();
                    finish(false);
                }
            };

            overlay.onblur = function() {
                finish(true);
            };
        }

        // --- HELPER CONVERSIONS FOR COLOR PICKER ---
        function cpHsvToRgb(h, s, v) {
            let r, g, b;
            let i = Math.floor(h * 6);
            let f = h * 6 - i;
            let p = v * (1 - s);
            let q = v * (1 - f * s);
            let t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: r = v; g = t; b = p; break;
                case 1: r = q; g = v; b = p; break;
                case 2: r = p; g = v; b = t; break;
                case 3: r = p; g = q; b = v; break;
                case 4: r = t; g = p; b = v; break;
                case 5: r = v; g = p; b = q; break;
            }
            return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
        }

        function cpRgbToHsv(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, v = max;
            let d = max - min;
            s = max === 0 ? 0 : d / max;
            if (max === min) {
                h = 0;
            } else {
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return [Math.round(h * 360), Math.round(s * 100), Math.round(v * 100)];
        }

        function intVal(str, s, e) {
            return parseInt(str.substring(s, e), 16) || 0;
        }

        function cpAssToRgb(assStr) {
            let clean = String(assStr).replace(/&[hH]?/g, "").replace(/&/g, "").trim();
            if (clean.length === 6) {
                // BBGGRR
                const b = intVal(clean, 0, 2);
                const g = intVal(clean, 2, 4);
                const r = intVal(clean, 4, 6);
                return [r, g, b];
            } else if (clean.length === 8) {
                // AABBGGRR
                const b = intVal(clean, 2, 4);
                const g = intVal(clean, 4, 6);
                const r = intVal(clean, 6, 8);
                return [r, g, b];
            } else if (clean.length === 3) {
                const b = parseInt(clean[0] + clean[0], 16) || 0;
                const g = parseInt(clean[1] + clean[1], 16) || 0;
                const r = parseInt(clean[2] + clean[2], 16) || 0;
                return [r, g, b];
            }
            return [255, 255, 255];
        }

        function cpHexToRgb(hexStr) {
            let clean = String(hexStr).replace("#", "").trim();
            if (clean.startsWith("&H") || clean.startsWith("&h") || clean.endsWith("&")) {
                return cpAssToRgb(clean);
            }
            if (clean.length === 6) {
                return [intVal(clean, 0, 2), intVal(clean, 2, 4), intVal(clean, 4, 6)];
            } else if (clean.length === 8) {
                return [intVal(clean, 2, 4), intVal(clean, 4, 6), intVal(clean, 6, 8)];
            } else if (clean.length === 3) {
                const r = parseInt(clean[0] + clean[0], 16) || 0;
                const g = parseInt(clean[1] + clean[1], 16) || 0;
                const b = parseInt(clean[2] + clean[2], 16) || 0;
                return [r, g, b];
            }
            return [255, 255, 255];
        }

        function cpRgbToHex(r, g, b) {
            const hex = (v) => ("0" + Math.max(0, Math.min(255, Math.round(v))).toString(16)).slice(-2).toUpperCase();
            return `#${hex(r)}${hex(g)}${hex(b)}`;
        }

        function cpRgbToAss(r, g, b) {
            const hex = (v) => ("0" + Math.max(0, Math.min(255, Math.round(v))).toString(16)).slice(-2).toUpperCase();
            return `&H${hex(b)}${hex(g)}${hex(r)}&`;
        }

        // --- SELECTOR DE COLOR PROFESIONAL (PYXIS / AEGISUB) ---
        function showProColorPickerModal(node, propertyName, titleName, onSaveCallback, clickEvent, onLiveCallback) {

            function updateUI(skipInputId) {
                const [r, g, b] = cpHsvToRgb(curH / 360, curS, curV);
                const hex = cpRgbToHex(r, g, b);
                const ass = cpRgbToAss(r, g, b);

                satValBox.style.backgroundColor = `hsl(${curH}, 100%, 50%)`;
                container.querySelector("#cp_hue_handle").style.top = `${(curH / 360) * 100}%`;

                if (skipInputId !== "cp_inp_hex") container.querySelector("#cp_inp_hex").value = hex;
                if (skipInputId !== "cp_inp_ass") container.querySelector("#cp_inp_ass").value = ass;
                if (skipInputId !== "cp_inp_r") container.querySelector("#cp_inp_r").value = r;
                if (skipInputId !== "cp_inp_g") container.querySelector("#cp_inp_g").value = g;
                if (skipInputId !== "cp_inp_b") container.querySelector("#cp_inp_b").value = b;
                if (skipInputId !== "cp_inp_h") container.querySelector("#cp_inp_h").value = Math.round(curH);
                if (skipInputId !== "cp_inp_s") container.querySelector("#cp_inp_s").value = Math.round(curS * 100);
                if (skipInputId !== "cp_inp_v") container.querySelector("#cp_inp_v").value = Math.round(curV * 100);

                const rect = satValBox.getBoundingClientRect();
                let x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
                let y = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
                curS = x / rect.width;
                curV = 1 - (y / rect.height);
                updateUI();
            };

            const handleHueDrag = (e) => {
                const rect = hueBar.getBoundingClientRect();
                let y = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
                curH = (y / rect.height) * 360;
                updateUI();

            satValBox.onmousedown = (e) => { isDraggingBox = true; handleBoxDrag(e); };
            hueBar.onmousedown = (e) => { isDraggingHue = true; handleHueDrag(e); };

            // Auto-seleccionar texto al hacer clic o foco en las cajas de entrada del selector

        window.showProColorPickerModal = showProColorPickerModal;

        function setupColorPickerNode(node) {
            if (!node) return;
            node.resizable = false;
            if (!node.properties) node.properties = {};
            if (Array.isArray(node.properties.colors)) {
                node.properties.colors = [...node.properties.colors];
            } else {
                node.properties.colors = [node.properties.color || "#FFFFFF"];
            }
            if (Array.isArray(node.properties.formats)) {
                node.properties.formats = [...node.properties.formats];
            } else {
                node.properties.formats = ["ASS"];
            }
            
            node.widgets_up = false;

            // Anulamos la lista de widgets internos ya que todo el renderizado y clics lo hacemos custom
            node.updateColorPickerUI = function() {
                if (!this.properties.colors || !Array.isArray(this.properties.colors) || this.properties.colors.length === 0) {
                    this.properties.colors = ["#FFFFFF"];
                }
                if (!this.properties.formats || !Array.isArray(this.properties.formats)) {
                    this.properties.formats = ["ASS"];
                }
                while (this.properties.formats.length < this.properties.colors.length) {
                    this.properties.formats.push("ASS");
                }

                const count = this.properties.colors.length;

                if (!this.outputs) this.outputs = [];
                while (this.outputs.length < count) {
                    this.addOutput("", "data");
                }
                while (this.outputs.length > count) {
                    this.removeOutput(this.outputs.length - 1);
                }

                for (let i = 0; i < count; i++) {
                    this.outputs[i].name = ""; 
                    this.outputs[i].type = "data";
                }

                this.widgets = [];

                if (this.computeSize) {
                    const sz = this.computeSize();
                    if (!this.flags || !this.flags.collapsed) {
                        this.size = [210, sz[1]];
                    }
                }
            };

            node.computeSize = function(out) {
                out = out || new Float32Array([0, 0]);
                const count = (this.properties && this.properties.colors && this.properties.colors.length) || 1;
                out[0] = 210;
                out[1] = 30 + count * 22 + 6;
                return out;
            };

            node.getConnectionPos = function(is_input, slot_number, out) {
                out = out || new Float32Array(2);
                if (this.flags && this.flags.collapsed) {
                    var w = this._collapsed_width || LiteGraph.NODE_COLLAPSED_WIDTH;
                    if (is_input) {
                        out[0] = this.pos[0];
                    } else {
                        out[0] = this.pos[0] + w;
                    }
                    out[1] = this.pos[1] - LiteGraph.NODE_TITLE_HEIGHT * 0.5;
                    return out;
                }
                if (!is_input && this.outputs && slot_number < this.outputs.length) {
                    out[0] = this.pos[0] + this.size[0] - 10;
                    out[1] = this.pos[1] + 30 + slot_number * 22 + 11;
                } else {
                    out[0] = this.pos[0] + 10;
                    out[1] = this.pos[1] + 26;
                }
                return out;
            };

            node.onDrawForeground = function(ctx) {
                if (this.flags && this.flags.collapsed) return;
                
                const count = this.properties.colors ? this.properties.colors.length : 0;
                const nodeW = this.size[0];

                // 1. RENGLÓN SUPERIOR DE BOTONES (Exactamente 6px de margen bajo el título)
                const btnY = 6;
                const btnW = 30;
                const btnH = 20;
                const centerX = nodeW / 2;
                const btnPlusX = centerX - btnW - 4;
                const btnMinusX = centerX + 4;
                const canMinus = count > 1;

                // Botón [+]
                ctx.fillStyle = "#1e293b";
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(btnPlusX, btnY, btnW, btnH, 4);
                else ctx.rect(btnPlusX, btnY, btnW, btnH);
                ctx.fill();
                ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = "#38bdf8";
                ctx.font = "bold 14px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("+", btnPlusX + btnW / 2, btnY + btnH / 2 + 4);

                // Botón [-] (Si hay 1 solo color se atenúa visualmente)
                ctx.fillStyle = canMinus ? "#1e293b" : "#0f172a";
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(btnMinusX, btnY, btnW, btnH, 4);
                else ctx.rect(btnMinusX, btnY, btnW, btnH);
                ctx.fill();
                ctx.strokeStyle = canMinus ? "rgba(255, 255, 255, 0.25)" : "rgba(255, 255, 255, 0.1)";
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = canMinus ? "#f43f5e" : "#475569";
                ctx.font = "bold 14px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("-", btnMinusX + btnW / 2, btnY + btnH / 2 + 4);

                // 2. FILAS DE COLORES (Abajo de los botones)
                const startY = 30; 
                const margin = 12;
                
                for (let i = 0; i < count; i++) {
                    const colorIdx = i;
                    const widgetName = `Color ${i + 1}`; // Siempre "Color 1", "Color 2", etc. para ancho consistente
                    const currentHex = (this.properties.colors[colorIdx] || "#FFFFFF").toUpperCase();
                    const rawFmt = (this.properties.formats[colorIdx] || "ASS").toUpperCase();
                    const isHtml = (rawFmt === "HTML" || rawFmt === "HEX");
                    const fmtLabel = isHtml ? "HTML" : "ASS";
                    
                    const y = startY + i * 22;
                    const h = 22;
                    
                    // Muestra de Color
                    const swatchW = 20;
                    const swatchH = 15;
                    const swatchY = y + Math.floor((h - swatchH) / 2);
                    
                    ctx.fillStyle = currentHex;
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(margin, swatchY, swatchW, swatchH, 3);
                    else ctx.rect(margin, swatchY, swatchW, swatchH);
                    ctx.fill();
                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    
                    // Etiqueta
                    let currentX = margin + swatchW + 6;
                    ctx.fillStyle = "#cbd5e1";
                    ctx.font = "bold 11px sans-serif";
                    ctx.textAlign = "left";
                    ctx.fillText(widgetName, currentX, y + h / 2 + 4);
                    
                    // Hexadecimal
                    currentX += ctx.measureText(widgetName).width + 6;
                    ctx.fillStyle = "#38bdf8";
                    ctx.font = "bold 10px monospace";
                    ctx.fillText(currentHex, currentX, y + h / 2 + 3);
                    
                    // Botón Formato
                    const fmtBtnW = 44;
                    const fmtBtnH = 16;
                    const fmtBtnX = 142; 
                    const fmtBtnY = y + Math.floor((h - fmtBtnH) / 2);
                    
                    ctx.fillStyle = "#1e293b";
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(fmtBtnX, fmtBtnY, fmtBtnW, fmtBtnH, 3);
                    else ctx.rect(fmtBtnX, fmtBtnY, fmtBtnW, fmtBtnH);
                    ctx.fill();
                    ctx.strokeStyle = isHtml ? "#f43f5e" : "#38bdf8";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    ctx.fillStyle = isHtml ? "#f43f5e" : "#38bdf8";
                    ctx.font = "bold 10px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(fmtLabel, fmtBtnX + fmtBtnW / 2, y + h / 2 + 4);
                }
            };

            node.onMouseDown = function(e, pos, canvas) {
                if (this.flags && this.flags.collapsed) return false;
                const x = pos[0];
                const y = pos[1];
                const count = this.properties.colors ? this.properties.colors.length : 0;
                const nodeW = this.size[0];
                const centerX = nodeW / 2;

                // 1. Clic en Renglón de Botones (+ / -)
                if (y >= 0 && y < 30) {
                    const btnW = 30;
                    const btnPlusX = centerX - btnW - 4;
                    const btnMinusX = centerX + 4;

                    if (x >= btnPlusX && x <= btnPlusX + btnW) {
                        this.properties.colors.push("#FFFFFF");
                        this.properties.formats.push("ASS");
                        this.updateColorPickerUI();
                        this.setDirtyCanvas(true, true);
                        if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                        return true;
                    }
                    if (x >= btnMinusX && x <= btnMinusX + btnW) {
                        if (count > 1) {
                            this.properties.colors.pop();
                            this.properties.formats.pop();
                            this.updateColorPickerUI();
                            this.setDirtyCanvas(true, true);
                            if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                        }
                        return true;
                    }
                    return false;
                }

                // 2. Clic en Filas de Colores
                const startY = 30;
                if (y >= startY && y < startY + count * 22) {
                    const i = Math.floor((y - startY) / 22);
                    if (i >= 0 && i < count) {
                        const widgetName = `Color ${i + 1}`;
                        const fmtBtnX = 142;
                        const fmtBtnW = 44;
                        
                        if (x >= fmtBtnX - 2 && x <= fmtBtnX + fmtBtnW + 4) {
                            const curr = (this.properties.formats[i] || "ASS").toUpperCase();
                            this.properties.formats[i] = (curr === "ASS") ? "HTML" : "ASS";
                            this.updateColorPickerUI();
                            this.setDirtyCanvas(true, true);
                            if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                            return true;
                        } else if (x < fmtBtnX - 2) {
                            showProColorPickerModal(this, i, widgetName, (hexVal) => {
                                this.properties.colors[i] = hexVal;
                                this.setDirtyCanvas(true, true);
                                if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                            }, e, (liveHex) => {
                                this.properties.colors[i] = liveHex;
                                this.setDirtyCanvas(true, true);
                            });
                            return true;
                        }
                    }
                }
                return false;
            };

            const oldConfig = node.onConfigure;
            node.onConfigure = function(info) {
                if (oldConfig) oldConfig.call(this, info);
                if (this.updateColorPickerUI) this.updateColorPickerUI();
            };

            node.updateColorPickerUI();
        }

        // --- SISTEMA DE TAGS ASS MAESTRO (TAG DINÁMICO) ---
        const TAG_DEFINITIONS = {
            "pos": { name: "pos (Position)", desc: "position", params: ["X", "Y"], defaults: { X: "0", Y: "0" } },

            "fade": { name: "fade (Complex Fade)", desc: "complex fade", params: ["A1", "A2", "A3", "T1", "T2", "T3", "T4"], defaults: { A1: "255", A2: "0", A3: "255", T1: "0", T2: "100", T3: "200", T4: "300" } },
            "clip": { name: "clip (Mask/Drawing)", desc: "mask / drawing", params: ["Value"], defaults: { Value: "" } },

            "1c": { name: "1c (Primary Color)", desc: "primary color", params: ["Value"], defaults: { Value: "&HFFFFFF&" } },
            "2c": { name: "2c (Secondary Color)", desc: "secondary color", params: ["Value"], defaults: { Value: "&HFFFFFF&" } },
            "3c": { name: "3c (Border Color)", desc: "border color", params: ["Value"], defaults: { Value: "&H000000&" } },
            "4c": { name: "4c (Shadow Color)", desc: "shadow color", params: ["Value"], defaults: { Value: "&H000000&" } },
            "alpha": { name: "alpha (Transparency)", desc: "general transparency", params: ["Value"], defaults: { Value: "0" } },
            "1a": { name: "1a (Primary Alpha)", desc: "primary transparency", params: ["Value"], defaults: { Value: "0" } },
            "2a": { name: "2a (Secondary Alpha)", desc: "secondary transparency", params: ["Value"], defaults: { Value: "0" } },
            "3a": { name: "3a (Border Alpha)", desc: "border transparency", params: ["Value"], defaults: { Value: "0" } },
            "4a": { name: "4a (Shadow Alpha)", desc: "shadow transparency", params: ["Value"], defaults: { Value: "0" } },
            "fscx": { name: "fscx (Scale X)", desc: "horizontal scale X", params: ["Value"], defaults: { Value: "100" } },
            "fscy": { name: "fscy (Scale Y)", desc: "vertical scale Y", params: ["Value"], defaults: { Value: "100" } },
            "frz": { name: "frz (Rotation Z)", desc: "rotation along Z axis", params: ["Value"], defaults: { Value: "0" } },
            "frx": { name: "frx (Rotation X)", desc: "rotation along X axis", params: ["Value"], defaults: { Value: "0" } },
            "fry": { name: "fry (Rotation Y)", desc: "rotation along Y axis", params: ["Value"], defaults: { Value: "0" } },
            "fax": { name: "fax (Shear X)", desc: "shear along X axis", params: ["Value"], defaults: { Value: "0" } },
            "fay": { name: "fay (Shear Y)", desc: "shear along Y axis", params: ["Value"], defaults: { Value: "0" } },
