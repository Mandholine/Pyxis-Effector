        function getParamValueForPreview(node, paramName, visited) {
            visited = visited || new Set();
            if (visited.has(node.id)) return String(node.properties ? (node.properties[paramName] || "") : "");
            visited.add(node.id);

            if (!node.inputs) return String(node.properties ? (node.properties[paramName] || "") : "");
            const inp = node.inputs.find(i => i.name === paramName);
            if (inp && inp.link !== null && inp.link !== undefined && node.graph && node.graph.links) {
                const link = node.graph.links[inp.link];
                if (link) {
                    const originNode = node.graph.getNodeById(link.origin_id);
                    if (originNode) {
                        const typeName = String(originNode.type || originNode.title || "").toLowerCase();
                        if (typeName.includes("condicionador")) {
                            return getParamValueForPreview(originNode, "If True", visited);
                        }
                        if (typeName.includes("color picker") || originNode.updateColorPickerUI) {
                            if (originNode.properties && Array.isArray(originNode.properties.colors) && originNode.properties.colors.length > 0) {
                                const slotIdx = (link.origin_slot !== undefined && link.origin_slot !== null) ? link.origin_slot : 0;
                                const col = originNode.properties.colors[slotIdx] || originNode.properties.colors[0];
                                return String(col);
                            }
                        }
                        if (originNode.properties) {
                            if (originNode.properties.valor !== undefined && originNode.properties.valor !== "") {
                                return String(originNode.properties.valor);
                            }
                            if (originNode.properties.value !== undefined && originNode.properties.value !== "") {
                                return String(originNode.properties.value);
                            }
                            if (originNode.properties.Formato !== undefined && originNode.properties.Formato !== "") {
                                return String(originNode.properties.Formato);
                            }
                        }
                        if (originNode.widgets && originNode.widgets.length > 0) {
                            const firstW = originNode.widgets[0];
                            if (firstW && firstW.value !== undefined && firstW.value !== null && firstW.value !== "") {
                                return String(firstW.value);
                            }
                        }
                    }
                }
            }
            return String(node.properties && node.properties[paramName] !== undefined ? node.properties[paramName] : "");
        }

        function formatPreviewVal(tagKey, val) {
            val = String(val).trim();
            if (!val) return "";
            if (["c", "1c", "2c", "3c", "4c"].includes(tagKey)) {
                if (val.startsWith("#") && val.length === 7) {
                    const r = val.substring(1, 3);
                    const g = val.substring(3, 5);
                    const b = val.substring(5, 7);
                    return "&H" + (b + g + r).toUpperCase() + "&";
                }
            } else if (["alpha", "1a", "2a", "3a", "4a"].includes(tagKey)) {
                const num = parseInt(val, 10);
                if (!isNaN(num) && !val.includes("&H")) {
                    const hex = Math.max(0, Math.min(255, num)).toString(16).toUpperCase().padStart(2, "0");
                    return "&H" + hex + "&";
                }
            }
            return val;
        }

            document.body.appendChild(overlay);

            const searchInput = overlay.querySelector("#pyxis-tag-picker-search-input");
            const bodyContent = overlay.querySelector("#pyxis-tag-picker-body-content");
            const btnClose = overlay.querySelector("#btn-close-tag-picker");

            function renderTags(filterText = "") {
                const cleanFilter = filterText.toLowerCase().replace(/^\\/, "").trim();
                bodyContent.innerHTML = "";

                let matchCount = 0;

                TAG_CATEGORIES.forEach(cat => {
                    const matchingTags = cat.tags.filter(t => {
                        const def = TAG_DEFINITIONS[t];
                        const nameStr = def ? def.name.toLowerCase() : t;
                        const descStr = def ? def.desc.toLowerCase() : "";
                        return t.includes(cleanFilter) || nameStr.includes(cleanFilter) || descStr.includes(cleanFilter);
                    });

                    if (matchingTags.length > 0) {
                        matchCount += matchingTags.length;
                        const catDiv = document.createElement("div");
                        catDiv.className = "pyxis-tag-category";

                        const catTitle = document.createElement("div");
                        catTitle.className = "pyxis-tag-cat-title";
                        catTitle.innerHTML = `${cat.icon || ""} <span>${cat.title}</span>`;
                        catDiv.appendChild(catTitle);

                        const grid = document.createElement("div");
                        grid.className = "pyxis-tag-grid";

                        matchingTags.forEach(t => {
                            const def = TAG_DEFINITIONS[t];
                            const label = "\\" + t;
                            const translatedDesc = window.PyxisI18n ? window.PyxisI18n.getTagDesc(t) : "";
                            const titleAttr = translatedDesc || (def ? def.desc || def.name : t);

                            const btn = document.createElement("button");
                            btn.className = "pyxis-tag-btn" + (t === currentTag ? " active" : "");

                            };

                        });

                        catDiv.appendChild(grid);
                        bodyContent.appendChild(catDiv);

                if (matchCount === 0) {
                    const emptyMsg = isEs ? `No se encontraron tags que coincidan con "${filterText}"` : `No tags matching "${filterText}"`;

                overlay.remove();
                if (node.properties.tag_type !== tagKey) {

                    if (widget) widget.value = tagKey;
                    if (typeof node.updateTagInputs === "function") {
                        node.updateTagInputs();
                    }
                    if (window.PyxisUndoManager) {
                        window.PyxisUndoManager.recordState("tag-type-change");
                    }
                    if (node.setDirtyCanvas) {
                        node.setDirtyCanvas(true, true);
                    }
                }

            if (searchInput) {

        function openMeshGridPicker(node, widget, event) {
            const existing = document.getElementById("pyxis-mesh-picker-overlay");
            if (existing) existing.remove();

            const overlay = document.createElement("div");
            overlay.id = "pyxis-mesh-picker-overlay";
            overlay.className = "pyxis-mesh-picker-overlay";

            const currentMesh = String(node.properties.modo || "Rejilla 1D/2D");

            overlay.innerHTML = `
                <div class="pyxis-mesh-picker-dialog">
                    <div class="pyxis-tag-picker-header">
                        <div class="pyxis-tag-picker-title">
                            <svg class="svg-icon" viewBox="0 0 24 24" style="stroke: var(--accent-primary, #8b5cf6); width:18px; height:18px;"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                            <span>Galería de Mallas y Patrones de Corte (Shape Slicer)</span>
                        </div>
                        <input type="text" class="pyxis-tag-picker-search" id="pyxis-mesh-picker-search-input" placeholder="Buscar motor (ej: voronoi, hex, bez)..." autofocus>
                        <button class="pyxis-modal-close" id="btn-close-mesh-picker" style="background:transparent; border:none; color:var(--text-muted); cursor:pointer;">
                            <svg class="svg-icon" viewBox="0 0 24 24" style="width:18px; height:18px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                    <div class="pyxis-tag-picker-body" id="pyxis-mesh-picker-body-content">
                    </div>
                </div>
            `;

            document.body.appendChild(overlay);

            const searchInput = overlay.querySelector("#pyxis-mesh-picker-search-input");
            const bodyContent = overlay.querySelector("#pyxis-mesh-picker-body-content");
            const btnClose = overlay.querySelector("#btn-close-mesh-picker");

            const categories = Array.from(new Set(Object.values(MESH_DEFINITIONS).map(m => m.cat)));

            function renderMeshes(filterText = "") {
                const cleanFilter = filterText.toLowerCase().trim();
                bodyContent.innerHTML = "";
                let matchCount = 0;

                categories.forEach(catName => {
                    const keys = Object.keys(MESH_DEFINITIONS).filter(k => {
                        const m = MESH_DEFINITIONS[k];
                        if (m.cat !== catName) return false;
                        if (!cleanFilter) return true;
                        return k.toLowerCase().includes(cleanFilter) || m.name.toLowerCase().includes(cleanFilter) || m.desc.toLowerCase().includes(cleanFilter);
                    });

                    if (keys.length > 0) {
                        matchCount += keys.length;
                        const catDiv = document.createElement("div");
                        catDiv.className = "pyxis-tag-category";

                        const catTitle = document.createElement("div");
                        catTitle.className = "pyxis-tag-cat-title";
                        catTitle.innerHTML = `<span>${catName}</span>`;
                        catDiv.appendChild(catTitle);

                        const grid = document.createElement("div");
                        grid.className = "pyxis-mesh-grid";

                        keys.forEach(k => {
                            const def = MESH_DEFINITIONS[k];
                            const card = document.createElement("div");
                            card.className = "pyxis-mesh-card" + (k === currentMesh ? " active" : "");
                            
                            card.innerHTML = `
                                <div class="pyxis-mesh-svg-box">
                                    <svg viewBox="0 0 48 48" style="width:40px; height:40px;">
                                        ${def.svg}
                                    </svg>
                                </div>
                                <div class="pyxis-mesh-title">${def.name}</div>
                                <div class="pyxis-mesh-desc">${def.desc}</div>
                            `;

                            card.onclick = () => {
                                selectMesh(k);
                            };

                            grid.appendChild(card);
                        });

                        catDiv.appendChild(grid);
                        bodyContent.appendChild(catDiv);
                    }
                });

                if (matchCount === 0) {
                    bodyContent.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px; font-size: 13px;">No se encontraron motores de malla que coincidan con "${filterText}"</div>`;
                }
            }

            function selectMesh(meshKey) {
                overlay.remove();
                if (node.properties.modo !== meshKey) {
                    node.properties.modo = meshKey;
                    if (widget) widget.value = meshKey;
                    if (node.updateTagInputs) node.updateTagInputs();
                    else if (typeof updateNodeModeInputs === "function") updateNodeModeInputs(node);
                    if (window.PyxisUndoManager) {
                        window.PyxisUndoManager.recordState("mesh-mode-change");
                    }
                    if (node.setDirtyCanvas) {
                        node.setDirtyCanvas(true, true);
                    }
                }
            }

            renderMeshes();
            setTimeout(() => {
                const activeCard = bodyContent.querySelector(".pyxis-mesh-card.active");
                if (activeCard) {
                    activeCard.scrollIntoView({ block: "center", behavior: "instant" });
                }
            }, 30);

            if (searchInput) {
                searchInput.oninput = function() {
                    renderMeshes(this.value);
                };
                setTimeout(() => searchInput.focus(), 20);
            }

            if (btnClose) {
                btnClose.onclick = () => overlay.remove();
            }

            overlay.onclick = (e) => {
                if (e.target === overlay) overlay.remove();
            };

            const escKeyHandler = (e) => {
                if (e.key === "Escape") {
                    overlay.remove();
                    window.removeEventListener("keydown", escKeyHandler);
                }
            };
            window.addEventListener("keydown", escKeyHandler);
        }

        function getShapeDefinition(shapeNameOrPath) {
            if (!shapeNameOrPath) return null;
            let s = String(shapeNameOrPath).trim();
            if (s.toLowerCase().startsWith("shape.")) {
                s = s.substring(6).trim();
            }
            if (typeof SHAPES_LIB_ALIASES !== 'undefined' && SHAPES_LIB_ALIASES[s]) {
                s = SHAPES_LIB_ALIASES[s];
            }
            if (typeof SHAPES_LIB_GALLERY_DEFINITIONS !== 'undefined') {
                if (SHAPES_LIB_GALLERY_DEFINITIONS[s]) return SHAPES_LIB_GALLERY_DEFINITIONS[s];
                const cleanS = s.toLowerCase().replace(/[\s\-_.]/g, '').replace(/[á]/g, 'a').replace(/[é]/g, 'e').replace(/[í]/g, 'i').replace(/[ó]/g, 'o').replace(/[ú]/g, 'u');
                for (const k in SHAPES_LIB_GALLERY_DEFINITIONS) {
                    const cleanK = k.toLowerCase().replace(/[\s\-_.]/g, '').replace(/[á]/g, 'a').replace(/[é]/g, 'e').replace(/[í]/g, 'i').replace(/[ó]/g, 'o').replace(/[ú]/g, 'u');
                    if (cleanK === cleanS) return SHAPES_LIB_GALLERY_DEFINITIONS[k];
                }
            }
            return null;
        }

        function getAssPathBBox(assPath) {
            if (!assPath) return { minX: 0, minY: 0, maxX: 100, maxY: 100, w: 100, h: 100, cx: 50, cy: 50 };
            const tokens = assPath.trim().split(/\s+/);
            const nums = [];
            for (let i = 0; i < tokens.length; i++) {
                const n = parseFloat(tokens[i]);
                if (!isNaN(n)) nums.push(n);
            }
            if (nums.length < 2) return { minX: 0, minY: 0, maxX: 100, maxY: 100, w: 100, h: 100, cx: 50, cy: 50 };
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (let i = 0; i < nums.length - 1; i += 2) {
                const x = nums[i];
                const y = nums[i + 1];
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
            }
            if (!isFinite(minX) || !isFinite(minY)) return { minX: 0, minY: 0, maxX: 100, maxY: 100, w: 100, h: 100, cx: 50, cy: 50 };
            const w = Math.max(0.001, maxX - minX);
            const h = Math.max(0.001, maxY - minY);
            return {
                minX: minX,
                minY: minY,
                maxX: maxX,
                maxY: maxY,
                w: w,
                h: h,
                cx: (minX + maxX) / 2,
                cy: (minY + maxY) / 2
            };
        }

        function assPathToSvg(assPath) {
            if (!assPath) return "";
            const tokens = assPath.trim().split(/\s+/);
            let cmd = "";
            const svgTokens = [];
            let i = 0;
            while (i < tokens.length) {
                const t = tokens[i];
                if (!t) { i++; continue; }
                const lower = t.toLowerCase();
                if (lower === "m" || lower === "l" || lower === "b" || lower === "c") {
                    cmd = lower;
                    i++;
                    if (cmd === "c") svgTokens.push("Z");
                    continue;
                }
                if (cmd === "m" && i + 1 < tokens.length) {
                    svgTokens.push(`M ${tokens[i]} ${tokens[i+1]}`);
                    i += 2;
                } else if (cmd === "l" && i + 1 < tokens.length) {
                    svgTokens.push(`L ${tokens[i]} ${tokens[i+1]}`);
                    i += 2;
                } else if (cmd === "b" && i + 5 < tokens.length) {
                    svgTokens.push(`C ${tokens[i]} ${tokens[i+1]}, ${tokens[i+2]} ${tokens[i+3]}, ${tokens[i+4]} ${tokens[i+5]}`);
                    i += 6;
                } else {
                    i++;
                }
            }
            return svgTokens.join(" ");
        }

            `;

            document.body.appendChild(overlay);

            const searchInput = overlay.querySelector("#pyxis-shapes-picker-search-input");
            const bodyContent = overlay.querySelector("#pyxis-shapes-picker-body-content");
            const btnClose = overlay.querySelector("#btn-close-shapes-picker");

            const categories = ["Formas", "Corazones", "Brillos", "Especiales", "Musica", "Estrellas", "Sakura", "Nieve", "Flores", "Geometria"];

            function renderShapes(filterText = "") {
                const cleanFilter = filterText.toLowerCase().trim();
                bodyContent.innerHTML = "";

                categories.forEach(catName => {
                    // Obtener lista única de formas pertenecientes a esta categoría
                    const matchedKeys = Object.keys(SHAPES_LIB_GALLERY_DEFINITIONS).filter(shapeKey => {
                        const item = SHAPES_LIB_GALLERY_DEFINITIONS[shapeKey];
                        if (item.cat !== catName) return false;
                        if (!cleanFilter) return true;
                        return shapeKey.toLowerCase().includes(cleanFilter) || item.name.toLowerCase().includes(cleanFilter);
                    });

                    if (matchedKeys.length === 0) return;

                    const section = document.createElement("div");
                    section.className = "pyxis-mesh-picker-section";
                    section.innerHTML = `<div class="pyxis-mesh-picker-section-title">${catName} (${matchedKeys.length})</div>`;

                    const grid = document.createElement("div");
                    grid.className = "pyxis-mesh-grid";

                    matchedKeys.forEach(shapeKey => {
                        const def = SHAPES_LIB_GALLERY_DEFINITIONS[shapeKey];
                        const card = document.createElement("div");
                        const isActive = (shapeKey === currentShape || def.name === currentShape);
                        card.className = `pyxis-mesh-card ${isActive ? 'active' : ''}`;
                        
                        let svgContent = "";
                        if (def.name === "Pixel" || shapeKey === "Pixel") {
                            // Pixel: Cuadrado verde sólido estilizado de 10x10
                            svgContent = `<svg viewBox="-20 -20 40 40" style="width:40px; height:40px;">
                                <rect x="-5" y="-5" width="10" height="10" fill="#a7f3d0" stroke="#a7f3d0" stroke-width="1.5" rx="1.5"/>
                            </svg>`;
                        } else {
                            const svgPath = assPathToSvg(def.path);
                            const bbox = getAssPathBBox(def.path);
                            const maxDim = Math.max(bbox.w, bbox.h);
                            const pad = maxDim * 0.12;
                            const vbX = bbox.cx - (maxDim / 2 + pad);
                            const vbY = bbox.cy - (maxDim / 2 + pad);
                            const vbSize = maxDim + pad * 2;

                            svgContent = `<svg viewBox="${vbX} ${vbY} ${vbSize} ${vbSize}" style="width:40px; height:40px;">
                                <path d="${svgPath}" fill="rgba(139, 92, 246, 0.3)" stroke="#a7f3d0" stroke-width="${vbSize * 0.035}" stroke-linejoin="round" stroke-linecap="round"/>
                            </svg>`;
                        }

                        card.innerHTML = `
                            <div class="pyxis-mesh-svg-box">
                                ${svgContent}
                            </div>
                            <div class="pyxis-mesh-title">${def.name}</div>
                            <div class="pyxis-mesh-desc">${def.desc || ''}</div>
                        `;

                        card.onclick = () => {
                            if (!node.properties) node.properties = {};
                            node.properties.categoria = catName;
                            node.properties.forma = shapeKey;
                            if (node.widgets) {
                                const w = node.widgets.find(w => w.name === "forma" || w.name === "modo");
                                if (w) {
                                    w.value = shapeKey;
                                    if (w.callback) w.callback(w.value);
                                }
                            }
                            node._cachedShapePath = null;
                            if (node.setDirtyCanvas) node.setDirtyCanvas(true, true);
                            overlay.remove();
                        };

                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                    bodyContent.appendChild(section);
                });
            }

            renderShapes();
            setTimeout(() => {
                const activeCard = bodyContent.querySelector(".pyxis-mesh-card.active");
                if (activeCard) {
                    activeCard.scrollIntoView({ block: "center", behavior: "instant" });
                }
            }, 30);

            if (searchInput) {
                searchInput.oninput = (e) => renderShapes(e.target.value);
                setTimeout(() => searchInput.focus(), 20);
            }

            if (btnClose) {
                btnClose.onclick = () => overlay.remove();
            }

            overlay.onclick = (e) => {
                if (e.target === overlay) overlay.remove();
            };

            const escKeyHandler = (e) => {
                if (e.key === "Escape") {
                    overlay.remove();
                    document.removeEventListener("keydown", escKeyHandler);
                }
            };
            document.addEventListener("keydown", escKeyHandler);
        }

        function setupTagMasterNode(node) {
            if (!node.properties) node.properties = {};
            if (!node.properties.tag_type) node.properties.tag_type = "pos";
            node.widgets_up = true;

            node.computeSize = function() {
                const props = this.properties || node.properties || {};
                const tagKey = (props.tag_type || "pos").toLowerCase();
                const tagDef = TAG_DEFINITIONS[tagKey] || { params: ["Value"] };
                const reqParams = tagDef.params || ["Value"];
                
                let base_w = 210;
                let text_req_w = 0;
                for (const p in props) {
                    if (p === "tag_type") continue;
                    const val = String(props[p] || "");
                    if (val.length > 0) {
                        const tw = getExactTextWidth(val, "bold 11px Consolas, monospace");
                        if (tw > text_req_w) text_req_w = tw;
                    }
                }
                const right_space = getNodeRightReserve(this);
                const boxW = Math.max(65, Math.ceil(text_req_w + 28));
                return [Math.max(base_w, 22 + boxW + right_space), 11 + reqParams.length * 23 + 42];
            };

            node.updateTagInputs = updateTagInputs;

            function updateTagInputs() {
                const tagKey = (node.properties.tag_type || "pos").toLowerCase();
                const tagDef = TAG_DEFINITIONS[tagKey] || { params: ["Value"], defaults: { Valor: "" } };
                const reqParams = tagDef.params || ["Value"];
                
                const currentInputNames = (node.inputs || []).map(inp => inp.name);
                const matches = currentInputNames.length === reqParams.length &&
                                reqParams.every((p, idx) => currentInputNames[idx] === p);

                if (!matches) {
                    const oldLinks = {};
                    if (node.inputs) {
                        node.inputs.forEach((inp) => {
                            if (inp.link !== null && inp.link !== undefined) {
                                oldLinks[inp.name] = inp.link;
                            }
                        });
                    }

                    if (!node.inputs) node.inputs = [];

                    while (node.inputs.length > reqParams.length) {
                        node.removeInput(node.inputs.length - 1);
                    }

                    while (node.inputs.length < reqParams.length) {
                        const idx = node.inputs.length;
                        node.addInput(reqParams[idx], "data");
                    }

                    reqParams.forEach((paramName, idx) => {
                        const inputSlot = node.inputs[idx];
                        inputSlot.name = paramName;
                        inputSlot.type = "data";
                        inputSlot.label = " ";
                        inputSlot.pos = [10, 20 + idx * 23];

                        if (inputSlot.link === null || inputSlot.link === undefined) {
                            if (oldLinks[paramName] !== undefined && node.graph && node.graph.links) {
                                const linkId = oldLinks[paramName];
                                if (node.graph.links[linkId]) {
                                    inputSlot.link = linkId;
                                }
                            }
                        }
                    });
                } else {
                    node.inputs.forEach((inp, idx) => {
                        inp.label = " ";
                        inp.pos = [10, 20 + idx * 23];
                    });
                }

                if (node.widgets) {
                    node.widgets = node.widgets.filter(w => w.property === "tag_type");
                } else {
                    node.widgets = [];
                }

                reqParams.forEach((paramName, idx) => {
                    if (node.properties[paramName] === undefined) {
                        node.properties[paramName] = (tagDef.defaults && tagDef.defaults[paramName] !== undefined)
                            ? tagDef.defaults[paramName]
                            : "";

                let previewStr = getRandomLivePreview(this);
                const maxW = this.size[0] - 24;

                    let truncated = previewStr;
                    while (truncated.length > 0 && ctx.measureText(truncated + "...").width > maxW) {
                        truncated = truncated.slice(0, -1);

                ctx.fillText(previewStr, 12, this.size[1] - 8);

            const oldConfigure = node.onConfigure;

        function setupInlineSlotWidgetsNode(node) {
            if (!node) return;
            node.widgets_up = true;

            let widget_offset = 0;
            if (node.widgets) {
                for (let i = 0; i < node.widgets.length; i++) {
                    const w = node.widgets[i];
                    if (w && w.type === "combo") {
                        w.last_y = 6 + i * 30;
                        widget_offset++;
                    }
                }
            }

            if (node.inputs) {
                node.inputs.forEach((inp, idx) => {
                    inp.label = " ";
                    inp.pos = [0, 19 + (idx + widget_offset) * 30];
                });
            }

            if (node.widgets) {
                let text_idx = 0;
                node.widgets.forEach((w) => {
                    if (!w) return;
                    if (w.type === "combo") return;
                    
                    const slot_idx = text_idx + widget_offset;
                    w.last_y = 6 + slot_idx * 30;
                    text_idx++;

                    if (w.type === "text" && w.property) {
                        setupSingleLineTextWidget(node, w, w.name, w.property);
                    }
                });
            }

            node.computeSize = function() {
                let num_in = this.inputs ? this.inputs.length : 0;
                let num_wid = this.widgets ? this.widgets.length : 0;
                let rows = Math.max(num_in + widget_offset, num_wid, 1);

                let title_text = this.title || "";
                let base_w = Math.max(150, title_text.length * 8.5 + 40);

                if (this.properties) {
                    for (const p in this.properties) {
                        const val = String(this.properties[p] || "");
                        if (val.length > 0) {
                            const tw = (typeof getExactTextWidth === "function") ? getExactTextWidth(val, "bold 11px Consolas, monospace") : (val.length * 8.5);
                            base_w = Math.max(base_w, Math.ceil(tw + 60));
                        }
                    }
                }
                if (this.widgets) {
                    for (let i = 0; i < this.widgets.length; i++) {
                        const w = this.widgets[i];
                        if (w && w.value !== undefined && w.value !== null) {
                            const val = String(w.value || "");
                            if (val.length > 0) {
                                const tw = (typeof getExactTextWidth === "function") ? getExactTextWidth(val, "bold 11px Consolas, monospace") : (val.length * 8.5);
                                base_w = Math.max(base_w, Math.ceil(tw + 60));
                            }
                        }
                    }
                }

                let base_h = 12 + rows * 30;
                return [base_w, base_h];
            };

            if (node.computeSize) {
                node.size = node.computeSize();
            }
        }

        function setupCondicionadorNode(node) {
            if (!node.properties) node.properties = {};
            if (node.properties.condicion === undefined) node.properties.condicion = "True";
            if (node.properties.si_verdadero === undefined) node.properties.si_verdadero = "";
            if (node.properties.si_falso === undefined) node.properties.si_falso = "";
            node.widgets_up = true;

            node.computeSize = function() {
                let base_w = 195;
                let text_req_w = 0;
                const props = this.properties || node.properties || {};
                for (const p in props) {
                    const val = String(props[p] || "");
                    if (val.length > 0) {
                        const tw = getExactTextWidth(val, "bold 11px Consolas, monospace");
                        if (tw > text_req_w) text_req_w = tw;
                    }
                }
                const right_space = getNodeRightReserve(this);
                const boxW = Math.max(65, Math.ceil(text_req_w + 28));
                return [Math.max(base_w, 22 + boxW + right_space), 11 + 3 * 23 + 12];
            };

            function updateCondicionadorInputs() {
                const reqInputs = ["Condition", "If True", "If False"];

                const currentInputNames = (node.inputs || []).map(inp => inp.name);
                const matches = currentInputNames.length === reqInputs.length &&
                                reqInputs.every((p, idx) => currentInputNames[idx] === p);

                if (!matches) {
                    const oldLinks = {};
                    if (node.inputs) {
                        node.inputs.forEach((inp) => {
                            if (inp.link !== null && inp.link !== undefined) {
                                oldLinks[inp.name] = inp.link;
                            }
                        });
                    }

                    if (!node.inputs) node.inputs = [];

                    while (node.inputs.length > reqInputs.length) {
                        node.removeInput(node.inputs.length - 1);
                    }

                    while (node.inputs.length < reqInputs.length) {
                        const idx = node.inputs.length;
                        node.addInput(reqInputs[idx], "data");
                    }

                    reqInputs.forEach((paramName, idx) => {
                        const inputSlot = node.inputs[idx];
                        inputSlot.name = paramName;
                        inputSlot.type = "data";
                        inputSlot.label = " ";
                        inputSlot.pos = [10, 20 + idx * 23];

                        if (inputSlot.link === null || inputSlot.link === undefined) {
                            if (oldLinks[paramName] !== undefined && node.graph && node.graph.links) {
                                const linkId = oldLinks[paramName];
                                if (node.graph.links[linkId]) {
                                    inputSlot.link = linkId;
                                }
                            }
                        }
                    });
                } else {
                    node.inputs.forEach((inp, idx) => {
                        inp.label = " ";
                        inp.pos = [10, 20 + idx * 23];
                    });
                }

                node.widgets = [];

                reqInputs.forEach((paramName, idx) => {
                    let propKey = "condicion";
                    if (paramName === "If True") propKey = "si_verdadero";
                    else if (paramName === "If False") propKey = "si_falso";

                    if (node.properties[propKey] === undefined) {
                        node.properties[propKey] = (propKey === "condicion") ? "True" : "";
                    }

                    const curVal = String(node.properties[propKey] !== undefined ? node.properties[propKey] : "");
                    const w = node.addWidget("text", paramName, curVal, function(val) {
                        const cleanVal = String(val || "").replace(/[\r\n]+/g, " ");
                        node.properties[propKey] = cleanVal;
                        node.properties[paramName] = cleanVal;
                        if (node.computeSize) {
                            node.size = node.computeSize();
                        }
                        if (node.setDirtyCanvas) node.setDirtyCanvas(true, true);
                    });
                    w.property = propKey;
                    w.last_y = 11 + idx * 23;
                    w.y = 11 + idx * 23;
                    setupSingleLineTextWidget(node, w, paramName, propKey);
                });

                if (node.computeSize) {
                    node.size = node.computeSize();
                } else {
                    node.size = [195, 11 + reqInputs.length * 23 + 12];
                }
                if (node.setDirtyCanvas && node.graph) node.setDirtyCanvas(true, true);
            }

            const oldDraw = node.onDrawForeground;
            node.onDrawForeground = function(ctx) {
                if (oldDraw) oldDraw.call(this, ctx);
                if (this.flags && this.flags.collapsed) return;

                if (this.inputs && this.widgets) {
                    this.inputs.forEach((inp, idx) => {
                        inp.label = " ";
                        inp.pos = [10, 11 + idx * 23 + 9];
                    });
                }
            };

            const oldConfigure = node.onConfigure;
            node.onConfigure = function(info) {
                if (oldConfigure) oldConfigure.call(this, info);
                updateCondicionadorInputs();
            };

            updateCondicionadorInputs();
        }

        function setupCodigoScriptNode(node) {
            if (!node.properties) node.properties = {};
            if (!node.properties.lenguaje) node.properties.lenguaje = "Python";
            if (node.properties.script === undefined) {

            if (node.properties.inputs_count === undefined) {

            node.widgets_up = true;

            function updateCodigoScriptInputs() {
                const count = Math.max(1, parseInt(node.properties.inputs_count, 10) || 2);
                node.properties.inputs_count = count;

                const reqInputs = ["Loop In"];
                for (let i = 1; i <= count; i++) {
                    reqInputs.push("In" + i);
                }

                const currentInputNames = (node.inputs || []).map(inp => inp.name);
                const matches = currentInputNames.length === reqInputs.length &&
                                reqInputs.every((p, idx) => currentInputNames[idx] === p);

                if (!matches) {
                    const oldLinks = {};
                    if (node.inputs) {
                        node.inputs.forEach((inp) => {
                            if (inp.link !== null && inp.link !== undefined) {
                                oldLinks[inp.name] = inp.link;
                            }
                        });
                    }

                    if (!node.inputs) node.inputs = [];

                    while (node.inputs.length > reqInputs.length) {
                        node.removeInput(node.inputs.length - 1);
                    }

                    while (node.inputs.length < reqInputs.length) {
                        const idx = node.inputs.length;
                        const pName = reqInputs[idx];
                        const pType = (pName === "Loop In") ? "bucle" : "data";
                        node.addInput(pName, pType);
                    }

                    reqInputs.forEach((paramName, idx) => {
                        const inputSlot = node.inputs[idx];
                        inputSlot.name = paramName;
                        inputSlot.type = (paramName === "Loop In") ? "bucle" : "data";
                        inputSlot.label = (paramName === "Loop In") ? "Loop In" : " ";
                        if (idx === 0) {
                            inputSlot.pos = [10, 18];
                        } else {
                            inputSlot.pos = [10, 34 + (idx - 1) * 23 + 9];
                        }

                        if (inputSlot.link === null || inputSlot.link === undefined) {
                            if (oldLinks[paramName] !== undefined && node.graph && node.graph.links) {
                                const linkId = oldLinks[paramName];
                                if (node.graph.links[linkId]) {
                                    inputSlot.link = linkId;
                                }
                            }
                        }
                    });
                } else if (node.inputs && node.inputs[0]) {
                    node.inputs[0].name = "Loop In";
                    node.inputs[0].label = "Loop In";
                }

                if (!node.outputs || node.outputs.length < 2) {
                    node.outputs = [
                        { name: "Loop Out", type: "bucle", links: null },
                        { name: "Result", type: "data", links: null }
                    ];
                }

                node.widgets = [];

                for (let i = 1; i <= count; i++) {
                    const paramName = "In" + i;
                    const propKey = paramName;
                    if (node.properties[propKey] === undefined) {
                        node.properties[propKey] = "";
                    }

                    const curVal = String(node.properties[propKey] !== undefined ? node.properties[propKey] : "");
                    const w = node.addWidget("text", paramName, curVal, function(val) {
                        const cleanVal = String(val || "").replace(/[\r\n]+/g, " ");
                        node.properties[propKey] = cleanVal;
                        node.properties[paramName] = cleanVal;
                        if (node.computeSize) {
                            node.size = node.computeSize();
                        }
                        if (node.setDirtyCanvas) node.setDirtyCanvas(true, true);
                    });
                    w.property = propKey;
                    w.y = 34 + (i - 1) * 23;
                    w.last_y = 34 + (i - 1) * 23;
                    setupSingleLineTextWidget(node, w, paramName, propKey);
                }

                if (node.computeSize) {
                    node.size = node.computeSize();
                } else {
                    node.size = [230, 34 + count * 23 + 52];
                }
                if (node.setDirtyCanvas && node.graph) node.setDirtyCanvas(true, true);
            }

            node.computeSize = function() {
                const count = Math.max(1, parseInt(node.properties.inputs_count, 10) || 2);
                let base_w = 230;
                let text_req_w = 0;
                if (node.properties) {
                    for (const p in node.properties) {
                        if (p === "script" || p === "lenguaje" || p === "inputs_count") continue;
                        const val = String(node.properties[p] || "");
                        if (val.length > 0) {
                            const tw = getExactTextWidth(val, "bold 11px Consolas, monospace");
                            if (tw > text_req_w) text_req_w = tw;
                        }
                    }
                }
                const right_space = getNodeRightReserve(node);
                const boxW = Math.max(65, Math.ceil(text_req_w + 28));
                const contentH = 34 + count * 23 + 52;
                return [Math.max(base_w, 22 + boxW + right_space), contentH];
            };

            const oldDraw = node.onDrawForeground;
            node.onDrawForeground = function(ctx) {
                if (oldDraw) oldDraw.call(this, ctx);
                if (this.flags && this.flags.collapsed) return;

                const count = Math.max(1, parseInt(this.properties.inputs_count, 10) || 2);
                const nodeW = this.size[0];
                const centerX = nodeW / 2;

                if (this.inputs) {
                    this.inputs.forEach((inp, idx) => {
                        if (inp.name === "Loop In") {
                            inp.pos = [10, 18];
                            inp.label = "Loop In";
                        } else {
                            inp.label = " ";
                            inp.pos = [10, 34 + (idx - 1) * 23 + 9];
                        }
                    });
                }

                ctx.save();

                // 1. Draw Language Toggle Badge Button
                const lang = String(this.properties.lenguaje || "Python");
                const isPython = (lang === "Python");
                ctx.font = "bold 10px monospace";
                const langTextW = ctx.measureText(lang).width;
                const langBadgeW = Math.max(54, langTextW + 14);
                const langBadgeH = 20;
                const langBadgeX = nodeW - langBadgeW - 8;
                const langBadgeY = -25;

                ctx.fillStyle = "rgba(18, 22, 31, 0.85)";
                ctx.strokeStyle = isPython ? "#8b5cf6" : "#10b981";
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(langBadgeX, langBadgeY, langBadgeW, langBadgeH, 10);
                else ctx.rect(langBadgeX, langBadgeY, langBadgeW, langBadgeH);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = isPython ? "#c084fc" : "#a7f3d0";
                ctx.textAlign = "center";
                ctx.fillText(lang, langBadgeX + langBadgeW / 2, langBadgeY + 14);

                // 2. Draw + and - Input Extensible Buttons
                const btnW = 28;
                const btnH = 20;
                const btnY = 8;
                const btnPlusX = centerX - 32;
                const btnMinusX = centerX + 4;

                // Plus (+) Button
                ctx.fillStyle = "#1e293b";
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(btnPlusX, btnY, btnW, btnH, 4);
                else ctx.rect(btnPlusX, btnY, btnW, btnH);
                ctx.fill();
                ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.font = "bold 14px sans-serif";
                ctx.fillStyle = "#38bdf8";
                ctx.textAlign = "center";
                ctx.fillText("+", btnPlusX + btnW / 2, btnY + 14);

                if (ctx.roundRect) ctx.roundRect(btnMinusX, btnY, btnW, btnH, 4);
                else ctx.rect(btnMinusX, btnY, btnW, btnH);
                ctx.fill();
                ctx.strokeStyle = canMinus ? "rgba(255, 255, 255, 0.25)" : "rgba(255, 255, 255, 0.1)";
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.font = "bold 14px sans-serif";
                ctx.fillStyle = canMinus ? "#ef4444" : "#475569";
                ctx.textAlign = "center";
                ctx.fillText("-", btnMinusX + btnW / 2, btnY + 14);

                // 3. Draw Script Code Preview
                const previewY = 34 + count * 23 + 14;
                const scriptLines = String(this.properties.script || "").split('\n');
                const previewLine1 = scriptLines[0] || "";
                
                ctx.font = "italic 11px monospace";
                ctx.fillStyle = "#94A3B8";
                ctx.textAlign = "left";

                const maxW = nodeW - 24;

                    disp1 = disp1.substring(0, 26) + "...";
                }

                ctx.fillText(disp1, 12, previewY);

                // 4. Draw [ Abrir Editor Script ] Action Button
                const editorBtnX = 12;
                const editorBtnY = previewY + 10;
                const editorBtnW = nodeW - 24;
                const editorBtnH = 22;

                ctx.fillStyle = "#2563EB";
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(editorBtnX, editorBtnY, editorBtnW, editorBtnH, 5);
                else ctx.rect(editorBtnX, editorBtnY, editorBtnW, editorBtnH);
                ctx.fill();

                ctx.font = "bold 11px sans-serif";
                ctx.fillStyle = "#FFFFFF";
                ctx.textAlign = "center";
                var editorBtnText = window.PyxisI18n ? window.PyxisI18n.t("nodes.placeholders.open_script_editor") : "Open Script Editor";
                ctx.fillText(editorBtnText, editorBtnX + editorBtnW / 2, editorBtnY + 15);

                ctx.restore();
            };

            const oldMouseDown = node.onMouseDown;
            node.onMouseDown = function(e, pos, canvas) {
                if (oldMouseDown && oldMouseDown.call(this, e, pos, canvas)) return true;

                const count = Math.max(1, parseInt(this.properties.inputs_count, 10) || 2);
                const nodeW = this.size[0];
                const centerX = nodeW / 2;

                // Language Badge Click
                const langBadgeW = 64;
                const langBadgeH = 20;
                const langBadgeX = nodeW - langBadgeW - 8;
                const langBadgeY = -25;
                if (pos[0] >= langBadgeX && pos[0] <= langBadgeX + langBadgeW &&
                    pos[1] >= langBadgeY && pos[1] <= langBadgeY + langBadgeH) {
                    this.properties.lenguaje = (this.properties.lenguaje === "Python") ? "Lua" : "Python";
                    if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                    if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                    return true;
                }

                // Plus (+) Button Click
                const btnW = 28;
                const btnH = 20;
                const btnY = 8;
                const btnPlusX = centerX - 32;
                const btnMinusX = centerX + 4;

                if (pos[0] >= btnPlusX && pos[0] <= btnPlusX + btnW &&
                    pos[1] >= btnY && pos[1] <= btnY + btnH) {
                    this.properties.inputs_count = count + 1;
                    updateCodigoScriptInputs();
                    if (this.computeSize) this.size = this.computeSize();
                    if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                    if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                    return true;
                }

                // Minus (-) Button Click
                if (pos[0] >= btnMinusX && pos[0] <= btnMinusX + btnW &&
                    pos[1] >= btnY && pos[1] <= btnY + btnH) {
                    if (count > 1) {
                        this.properties.inputs_count = count - 1;
                        updateCodigoScriptInputs();
                        if (this.computeSize) this.size = this.computeSize();
                        if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                        if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                    }
                    return true;
                }

                // Check Input Text Boxes Click (In1..InN)
                for (let i = 1; i <= count; i++) {
                    const boxY = 34 + (i - 1) * 23;
                    const margin = 22;
                    const paramName = "In" + i;
                    const propKey = paramName;
                    const w = this.widgets ? this.widgets.find(widget => widget.property === propKey) : null;
                    const wWidth = getInlineBoxWidth(this, w, paramName, propKey);
                    const wHeight = 18;

                    if (pos[0] >= margin - 6 && pos[0] <= margin + wWidth + 10 &&
                        pos[1] >= boxY - 2 && pos[1] <= boxY + wHeight + 4) {
                        openInlineSingleLineEditor(this, w, propKey, paramName, e);
                        return true;
                    }
                }

                // Check Editor Action Button Click
                const previewY = 34 + count * 23 + 14;
                const editorBtnX = 12;
                const editorBtnY = previewY + 10;
                const editorBtnW = nodeW - 24;
                const editorBtnH = 22;

                if (pos[0] >= editorBtnX && pos[0] <= editorBtnX + editorBtnW &&
                    pos[1] >= editorBtnY && pos[1] <= editorBtnY + editorBtnH) {
                    openCodigoScriptModal(this);
                    return true;
                }

                if (pos[0] >= 0 && pos[0] <= nodeW && pos[1] >= 0 && pos[1] <= this.size[1]) {
                    return true;
                }

                return false;
            };

            node.onDblClick = null;

            const oldConfigure = node.onConfigure;
            node.onConfigure = function(info) {
                if (oldConfigure) oldConfigure.call(this, info);
                updateCodigoScriptInputs();
            };

            updateCodigoScriptInputs();
        }

                    // Sugerencias Contextuales Dinámicas para Objetos con Punto (syl.*, char.*, word.*, line.*, math.*, string.*)
                    if (prefix && prefix.includes(".")) {
                        const parts = prefix.split(".");
                        const obj = parts[0];
                        if (obj === "syl") {

                        } else if (obj === "line" || obj === "l") {

                                completions.push({
                                    caption: obj + "." + p,
                                    value: obj + "." + p,
                                    meta: obj,
                                    score: 2000
                                });

                        } else if (obj === "fx") {
                            ["pos_x", "pos_y", "x", "y", "i", "n", "start_time", "end_time", "dur", "align"].forEach(p => {
                                completions.push({
                                    caption: "fx." + p,
                                    value: "fx." + p,

                                });

                        } else if (obj === "math") {

                                completions.push({

        let __cached_user_code_templates = null;

        function loadStoredUserTemplates() {
            if (__cached_user_code_templates !== null) return __cached_user_code_templates;
            let templates = {};
            try {
                const local = localStorage.getItem("pyxis_code_script_templates");
                if (local) {
                    templates = JSON.parse(local) || {};
                }
            } catch (e) {
                console.warn("Pyxis: error al leer templates de localStorage", e);
            }
            __cached_user_code_templates = templates;
            return templates;
        }

        function persistUserTemplates(templates) {
            __cached_user_code_templates = templates;
            try {
                localStorage.setItem("pyxis_code_script_templates", JSON.stringify(templates));
            } catch (e) {
                console.warn("Pyxis: error al guardar en localStorage", e);
            }
            if (window.pywebview && window.pywebview.api && window.pywebview.api.save_code_templates) {
                window.pywebview.api.save_code_templates(templates).catch(err => {
                    console.warn("Pyxis: error al persistir user_code_templates en disco", err);
                });
            }
        }

        function refreshCodeTemplatesDropdown(selectedKey) {
            const select = document.getElementById("pyxis-code-template-select");
            if (!select) return;

            const node = window.__active_code_script_node;
            const currentLang = (node && node.properties && node.properties.lenguaje === "Lua") ? "Lua" : "Python";

            const userTemplates = loadStoredUserTemplates();
            const selectText = window.t ? window.t("code_editor.select_template") : "-- Seleccionar plantilla --";
            let html = `<option value="">${escapeHtml(selectText)}</option>`;

            const exampleGroupLabel = window.t ? window.t("code_editor.example_group", { lang: currentLang }) : `Plantilla de Ejemplo (${currentLang})`;
            const defaultTplName = window.t ? window.t(`code_editor.${currentLang.toLowerCase()}_default_tpl_name`) : `${currentLang}: Alternar colores por índice de sílaba`;

            if (currentLang === "Python") {
                html += `
                    <optgroup label="${escapeHtml(exampleGroupLabel)}">
                        <option value="python_default">${escapeHtml(defaultTplName)}</option>
                    </optgroup>
                `;
            } else {
                html += `
                    <optgroup label="${escapeHtml(exampleGroupLabel)}">
                        <option value="lua_default">${escapeHtml(defaultTplName)}</option>
                    </optgroup>
                `;
            }

            // Filtrar las plantillas guardadas exclusivamente por el lenguaje activo actual (Python o Lua)
            const userKeys = Object.keys(userTemplates).filter(key => {
                const tpl = userTemplates[key];
                return (tpl && (tpl.lang === currentLang || (!tpl.lang && currentLang === "Python")));
            });

            if (userKeys.length > 0) {
                const myTemplatesLabel = window.t ? window.t("code_editor.my_templates_group", { lang: currentLang }) : `Mis Plantillas (${currentLang})`;
                html += `<optgroup label="${escapeHtml(myTemplatesLabel)}">`;
                userKeys.forEach(key => {
                    const tpl = userTemplates[key];
                    const name = tpl.name || key;
                    html += `<option value="${escapeHtml(key)}">${escapeHtml(name)}</option>`;
                });
                html += `</optgroup>`;
            }

            select.innerHTML = html;
            if (selectedKey) {
                select.value = selectedKey;
            }
        }

        function saveCustomCodeTemplate() {
            let code = "";
            if (window.__pyxis_ace_editor) {
                code = window.__pyxis_ace_editor.getValue();
            } else {
                const textarea = document.getElementById("pyxis-code-textarea");
                if (textarea) code = textarea.value;
            }

            if (!code || !code.trim()) {
                alert(window.t ? window.t("code_editor.alert_empty") : "El editor de código está vacío. Escribe algo antes de guardarlo como plantilla.");
                return;
            }

            const node = window.__active_code_script_node;
            const currentLang = (node && node.properties && node.properties.lenguaje) ? node.properties.lenguaje : "Python";

            const defaultName = window.t ? window.t("code_editor.default_new_template_name", { lang: currentLang }) : `${currentLang}: Mi Plantilla Personalizada`;
            const promptMsg = window.t ? window.t("code_editor.prompt_name", { lang: currentLang }) : `Introduce un nombre para la nueva plantilla (${currentLang}):`;
            const name = prompt(promptMsg, defaultName);
            if (!name || !name.trim()) return;

            const tplKey = "user_tpl_" + Date.now();
            const userTemplates = loadStoredUserTemplates();
            userTemplates[tplKey] = {
                name: name.trim(),
                lang: currentLang,
                code: code,
                created_at: new Date().toISOString()
            };

            persistUserTemplates(userTemplates);
            refreshCodeTemplatesDropdown(tplKey);
        }

        function deleteCustomCodeTemplate() {
            const select = document.getElementById("pyxis-code-template-select");
            if (!select || !select.value) {
                alert(window.t ? window.t("code_editor.alert_select_to_delete") : "Por favor selecciona primero una de tus plantillas personalizadas en la lista para poder eliminarla.");
                return;
            }

            const tplKey = select.value;
            const userTemplates = loadStoredUserTemplates();

            if (!userTemplates[tplKey]) {
                alert(window.t ? window.t("code_editor.alert_cannot_delete_builtin") : "Las plantillas de ejemplo del sistema no se pueden eliminar. Solo puedes eliminar tus plantillas personalizadas.");
                return;
            }

            const tplName = userTemplates[tplKey].name || "esta plantilla";
            const confirmMsg = window.t ? window.t("code_editor.confirm_delete", { name: tplName }) : `¿Estás seguro de que deseas eliminar permanentemente la plantilla "${tplName}"?`;
            const confirmed = confirm(confirmMsg);
            if (!confirmed) return;

            delete userTemplates[tplKey];
            persistUserTemplates(userTemplates);
            refreshCodeTemplatesDropdown("");
        }

        function saveCodigoScriptModal() {

                } else {
                    const textarea = document.getElementById("pyxis-code-textarea");

                node.properties[propName] = code;
                if (node.widgets) {
