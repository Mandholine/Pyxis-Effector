        function applyCodeTemplate(tplKey) {
            if (!tplKey) return;

            const isEn = window.PyxisI18n && window.PyxisI18n.getCurrentLanguage && window.PyxisI18n.getCurrentLanguage() === "en";
            const pyComment = isEn ? "# Toggle ASS colors by syllable index (odd/even)" : "# Alternar colores ASS por índice de sílaba (impar/par)";
            const luaComment = isEn ? "-- Toggle ASS colors by syllable index (odd/even)" : "-- Alternar colores ASS por índice de sílaba (impar/par)";

            const builtInTpls = {
                "python_default": {
                    lang: "Python",
                    code: `${pyComment}\nif syl.i % 2 == 1:\n    result = in1 if in1 else '&H0000FF&'\nelse:\n    result = in2 if in2 else '&H00FFFF&'`
                },
                "lua_default": {
                    lang: "Lua",
                    code: `${luaComment}\nif syl.i % 2 == 1 then\n    result = (in1 and in1 ~= '') and in1 or '&H0000FF&'\nelse\n    result = (in2 and in2 ~= '') and in2 or '&H00FFFF&'\nend`
                }
            };

            const userTemplates = loadStoredUserTemplates();
            let selectedTpl = builtInTpls[tplKey] || userTemplates[tplKey];

            if (selectedTpl && selectedTpl.code) {
                if (window.__pyxis_ace_editor) {
                    window.__pyxis_ace_editor.setValue(selectedTpl.code, 1);
                    window.__pyxis_ace_editor.focus();
                }
            }
        }

        function isFilePathPropOrVal(propKey, val) {
            if (!val || typeof val !== "string") return false;
            const p = String(propKey || "").toLowerCase();
            if (p === "text" || p === "texto" || p === "valor" || p === "value" || p === "formato" || p === "format" || p === "key" || p === "default" || p === "tag" || p === "variables" || p === "code" || p.startsWith("in")) {
                return false;
            }
            if (p === "image_path" || p === "audio_path" || p === "file_path" || p === "path" || p.includes("ruta")) {
                return true;
            }
            const str = val.trim();
            if (/^[a-zA-Z]:[\\\/]/.test(str) || /^\\\\[^\\\/]+[\\\/][^\\\/]+/.test(str) || str.startsWith("./") || str.startsWith("../")) {
                return true;
            }
            if ((str.includes("/") || str.includes("\\")) && /\.(png|jpg|jpeg|gif|webp|bmp|wav|mp3|ogg|flac|aac|ass|srt|txt|py|lua|json)$/i.test(str)) {
                return true;
            }
            return false;
        }

        function isCompactTextPropOrVal(propKey, val) {
            if (!val || typeof val !== "string") return false;
            const p = String(propKey || "").toLowerCase();
            if (p === "shape" || p === "forma" || p === "drawing" || p === "code" || p === "code_val" || p === "shp" || p === "shp_val" || p.includes("shape") || p.includes("forma") || p.includes("dibujo")) {
                return true;
            }
            const str = val.trim();
            if (/^m\s+[-?\d]/i.test(str) || /^m\s*[-?\d]/i.test(str) || str.startsWith("m ") || str.startsWith("m-") || (str.includes(" b ") && str.startsWith("m"))) {
                return true;
            }
            return false;
        }

        let __pyxis_measure_canvas_ctx = null;
        function getExactTextWidth(text, font) {
            if (!text) return 0;
            try {
                if (!__pyxis_measure_canvas_ctx) {
                    const canvas = document.createElement("canvas");
                    __pyxis_measure_canvas_ctx = canvas.getContext("2d");
                }
                if (__pyxis_measure_canvas_ctx) {
                    let f = font || "bold 11px Consolas, monospace";
                    if (f === "bold 11px monospace") f = "bold 11px Consolas, monospace";
                    __pyxis_measure_canvas_ctx.font = f;
                    return __pyxis_measure_canvas_ctx.measureText(String(text)).width;
                }
            } catch(e) {}
            return String(text).length * 7.2;
        }

        function formatPathForDisplay(val, maxPxWidth, font) {
            if (!val) return "";
            const fontStr = font || "bold 11px monospace";
            const availableWidth = maxPxWidth || 100;
            if (getExactTextWidth(val, fontStr) <= availableWidth) return val;

            const parts = String(val).replace(/\\/g, "/").split("/");
            const filename = parts[parts.length - 1] || val;
            const shortText = ".../" + filename;
            if (getExactTextWidth(shortText, fontStr) <= availableWidth) {
                return shortText;
            }
            let sub = filename;
            while (sub.length > 4 && getExactTextWidth("..." + sub, fontStr) > availableWidth) {
                sub = sub.substring(1);
            }
            return "..." + sub;
        }

        function getNodeRightReserve(node) {
            if (!node) return 20;
            const isSalidaNode = !!(node.title === "Output" || node.title === "Salida" || (node.type && (String(node.type).includes("Output") || String(node.type).includes("Salida"))));
            if (isSalidaNode) {
                return 95;
            }
            let max_out_w = 0;
            const outputs = node.outputs || [];
            outputs.forEach(out => {
                if (out.name) {
                    const ow = getExactTextWidth(out.name, "10px sans-serif");
                    if (ow > max_out_w) max_out_w = ow;
                }
            });
            return max_out_w > 0 ? Math.ceil(max_out_w + 38) : 20;
        }

        function getInlineBoxWidth(node, widget, titleName, propertyName, width) {
            const propKey = propertyName || (widget ? widget.property : null);
            const curVal = String((node && node.properties && propKey && node.properties[propKey] !== undefined)
                ? node.properties[propKey]
                : (widget && widget.value !== undefined ? widget.value : ""));
            const nodeW = (node && node.size && node.size[0]) ? node.size[0] : (width || 200);

            const isFormatDinamico = node && (node.type === "Dynamic Format" || (node.title && String(node.title).includes("Format Din")));
            if (isFormatDinamico) {
                return Math.max(80, nodeW - 24);
            }

            const isSalidaNode = !!(node && (node.title === "Output" || node.title === "Salida" || (node.type && (String(node.type).includes("Output") || String(node.type).includes("Salida")))));
            const margin = 22;
            const rightReserve = getNodeRightReserve(node);

            let dispText = curVal.length > 0 ? curVal : ((widget ? widget.name : titleName) || "");
            const isPathProp = isFilePathPropOrVal(propKey, curVal);
            const isCompactProp = isCompactTextPropOrVal(propKey, curVal);
            if (curVal.length > 0 && isPathProp) {
                const parts = curVal.replace(/\\/g, "/").split("/");
                dispText = ".../" + (parts[parts.length - 1] || curVal);
            } else if (curVal.length > 0 && isCompactProp) {
                dispText = curVal.length > 10 ? (curVal.substring(0, 10) + "...") : curVal;
            }
            
            let textWidth = getExactTextWidth(dispText, "bold 11px Consolas, monospace");
            if (isPathProp || isCompactProp) {
                textWidth = Math.min(65, textWidth);
            }

            const minBoxW = isSalidaNode ? 75 : 65;
            // 8px padding izq + 3px bordes + 17px margen/cursor = 28px
            const calcW = Math.max(minBoxW, Math.ceil(textWidth + 28));
            const maxW = Math.max(minBoxW, nodeW - margin - rightReserve);
            return Math.min(maxW, calcW);
        }

        function openInlineSingleLineEditor(node, widget, propertyName, titleName, event) {
            const existing = document.getElementById("pyxis-inline-text-editor");
            if (existing) {
                if (typeof existing._saveAndClose === "function") existing._saveAndClose();
                else existing.remove();
            }

            const canvas = LGraphCanvas.active_canvas;
            if (!canvas || !canvas.canvas) return;

            const propKey = propertyName || widget.property;
            const curVal = String((node.properties && propKey && node.properties[propKey] !== undefined)
                ? node.properties[propKey]
                : (widget.value !== undefined ? widget.value : ""));

            const drawY = (widget.last_y !== undefined) ? widget.last_y : ((widget.y !== undefined) ? widget.y : 11);
            const isFormatDinamico = node && (node.type === "Dynamic Format" || (node.title && String(node.title).includes("Format Din")));
            const margin = isFormatDinamico ? 12 : 22;
            const wHeight = 18;

            const rect = canvas.canvas.getBoundingClientRect();
            const scale = canvas.ds ? canvas.ds.scale : 1.0;
            const offset = canvas.ds ? canvas.ds.offset : [0, 0];

            // Medida exacta idéntica a la calculada para la caja en el lienzo
            const wWidth = getInlineBoxWidth(node, widget, titleName, propertyName);

            const screenX = rect.left + (node.pos[0] + margin + offset[0]) * scale;
            const screenY = rect.top + (node.pos[1] + drawY + offset[1]) * scale;
            const screenW = wWidth * scale;
            const screenH = wHeight * scale;

            if (widget) widget._is_inline_editing = true;
            if (canvas.draw) canvas.draw(true, true);

            const isSalidaNode = !!(node && (node.title === "Output" || node.title === "Salida" || (node.type && (String(node.type).includes("Output") || String(node.type).includes("Salida")))));
            const initialPadLeft = isSalidaNode ? Math.max(2, Math.round(6 * scale)) : Math.max(4, Math.round(8 * scale));
            const initialPadRight = isSalidaNode ? Math.max(2, Math.round(8 * scale)) : Math.max(2, Math.round(6 * scale));

            const inputEl = document.createElement("input");
            inputEl.id = "pyxis-inline-text-editor";
            inputEl.type = "text";
            inputEl.value = curVal;
            inputEl.placeholder = widget.name || titleName || "";
            inputEl.style.position = "fixed";
            inputEl.style.left = screenX + "px";
            inputEl.style.top = screenY + "px";
            inputEl.style.width = screenW + "px";
            inputEl.style.height = screenH + "px";
            inputEl.style.boxSizing = "border-box";
            inputEl.style.borderRadius = (5 * scale) + "px";
            inputEl.style.background = "#12161f";
            inputEl.style.border = (1.5 * scale) + "px solid #8b5cf6";
            inputEl.style.color = "#a7f3d0";
            inputEl.style.font = "bold " + Math.max(9, Math.round(11 * scale)) + "px Consolas, monospace";
            inputEl.style.padding = "0 " + initialPadRight + "px 0 " + initialPadLeft + "px";
            inputEl.style.lineHeight = (screenH - 3 * scale) + "px";
            inputEl.style.zIndex = "100000";
            inputEl.style.outline = "none";
            inputEl.style.textIndent = "0px";
            inputEl.style.textAlign = "left";
            inputEl.style.boxShadow = "0 0 10px rgba(139, 92, 246, 0.6)";
            inputEl.style.overflow = "hidden";

            document.body.appendChild(inputEl);
            setTimeout(() => {
                inputEl.focus();
                inputEl.setSelectionRange(0, inputEl.value.length);
            }, 10);

            inputEl.oninput = function() {
                const cleanVal = String(inputEl.value || "").replace(/[\r\n]+/g, " ");
                if (node.properties && propKey) node.properties[propKey] = cleanVal;
                if (widget) widget.value = cleanVal;

                if (typeof node.computeSize === "function") {
                    const minSz = node.computeSize();
                    if (minSz && Array.isArray(minSz)) {
                        node.size = [minSz[0], minSz[1]];
                    }
                }

                if (canvas.setDirtyCanvas) canvas.setDirtyCanvas(true, true);
                if (canvas.draw) canvas.draw(true, true);

                const newRect = canvas.canvas.getBoundingClientRect();
                const newScale = canvas.ds ? canvas.ds.scale : 1.0;
                const newOffset = canvas.ds ? canvas.ds.offset : [0, 0];
                const newW = getInlineBoxWidth(node, widget, titleName, propertyName);

                const newScreenX = newRect.left + (node.pos[0] + margin + newOffset[0]) * newScale;
                const newScreenY = newRect.top + (node.pos[1] + drawY + newOffset[1]) * newScale;
                const newScreenW = newW * newScale;
                const newScreenH = wHeight * newScale;

                inputEl.style.left = newScreenX + "px";
                inputEl.style.top = newScreenY + "px";
                inputEl.style.width = newScreenW + "px";
                inputEl.style.height = newScreenH + "px";
                inputEl.style.borderRadius = (5 * newScale) + "px";
                inputEl.style.border = (1.5 * newScale) + "px solid #8b5cf6";
                inputEl.style.font = "bold " + Math.max(9, Math.round(11 * newScale)) + "px Consolas, monospace";
                const curPadLeft = isSalidaNode ? Math.max(2, Math.round(6 * newScale)) : Math.max(4, Math.round(8 * newScale));
                const curPadRight = isSalidaNode ? Math.max(2, Math.round(8 * newScale)) : Math.max(2, Math.round(6 * newScale));
                inputEl.style.padding = "0 " + curPadRight + "px 0 " + curPadLeft + "px";
                inputEl.style.lineHeight = (newScreenH - 3 * newScale) + "px";
            };

            inputEl.onkeyup = function() {};

            function saveAndClose() {
                if (widget) delete widget._is_inline_editing;
                const cleanVal = String(inputEl.value || "").replace(/[\r\n]+/g, " ");
                if (node.properties && propKey) node.properties[propKey] = cleanVal;
                widget.value = cleanVal;
                if (typeof node.computeSize === "function") {
                    const minSz = node.computeSize();
                    if (minSz && Array.isArray(minSz)) {
                        node.size = [minSz[0], minSz[1]];
                    }
                }
                if (node.setDirtyCanvas) node.setDirtyCanvas(true, true);
                if (canvas.setDirtyCanvas) canvas.setDirtyCanvas(true, true);
                if (canvas.draw) canvas.draw(true, true);
                if (window.PyxisUndoManager) window.PyxisUndoManager.recordState("inline-text-edit");
                if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                inputEl.remove();
            }
            inputEl._saveAndClose = saveAndClose;

            inputEl.onkeydown = function(e) {
                if (e.key === "Enter") {
                    e.preventDefault();
                    e.stopPropagation();
                    saveAndClose();
                } else if (e.key === "Escape") {
                    e.preventDefault();
                    e.stopPropagation();
                    if (widget) delete widget._is_inline_editing;
                    inputEl.remove();
                    if (canvas.setDirtyCanvas) canvas.setDirtyCanvas(true, true);
                }
            };

            inputEl.onblur = function() {
                saveAndClose();
            };
        }

        function setupSingleLineTextWidget(node, widget, titleName, propertyName) {
            if (!widget) return;

            widget.type = "custom";
            if (propertyName) widget.property = propertyName;

            widget.mouse = function(event, pos, node) {
                if (event.type === "mousedown" || event.type === "click") {
                    openInlineSingleLineEditor(node, widget, propertyName, titleName, event);
                    return true;
                }
            };

            widget.callback = function(value, canvas, node, pos, event) {
                openInlineSingleLineEditor(node, widget, propertyName, titleName, event);
            };

            widget.computeSize = function(width) {
                const wWidth = getInlineBoxWidth(node, widget, titleName, propertyName, width);
                return [wWidth + 22, 18];
            };

            widget.draw = function(ctx, node, width, y, height) {
                if (widget._is_inline_editing) {
                    return; // El editor HTML input se encarga del renderizado en vivo; evita bordes dobles/fantasma
                }
                const drawY = (widget.last_y !== undefined) ? widget.last_y : ((widget.y !== undefined) ? widget.y : y);
                const propKey = propertyName || widget.property;
                const curVal = String((node.properties && propKey && node.properties[propKey] !== undefined)
                    ? node.properties[propKey]
                    : (widget.value !== undefined ? widget.value : ""));
                
                const isFormatDinamico = node && (node.type === "Dynamic Format" || node.type === "Dynamic Format" || (node.title && String(node.title).includes("Format Din")));
                const margin = isFormatDinamico ? 12 : 22;
                const wWidth = getInlineBoxWidth(node, widget, titleName, propertyName, width);
                let dispText = curVal.length > 0 ? curVal : (widget.name || titleName || "");
                if (curVal.length > 0 && isFilePathPropOrVal(propKey, curVal)) {
                    dispText = formatPathForDisplay(curVal, wWidth - 16, "bold 11px monospace");
                } else if (curVal.length > 0 && isCompactTextPropOrVal(propKey, curVal)) {
                    dispText = curVal.length > 10 ? (curVal.substring(0, 10) + "...") : curVal;
                }
                const wHeight = 18;
                const borderRadius = 5;

                ctx.save();
                ctx.fillStyle = "#12161f";
                ctx.strokeStyle = "#8b5cf6";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(margin, drawY, wWidth, wHeight, borderRadius);
                else ctx.rect(margin, drawY, wWidth, wHeight);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(margin + 2, drawY + 2, wWidth - 4, wHeight - 4, Math.max(4, borderRadius - 2));
                else ctx.rect(margin + 2, drawY + 2, wWidth - 4, wHeight - 4);
                ctx.clip();

                if (!widget._is_inline_editing) {
                    ctx.fillStyle = curVal.length > 0 ? "#a7f3d0" : "#64748b";
                    ctx.font = "bold 11px Consolas, monospace";
                    ctx.textAlign = "left";

                    const isSalidaNode = !!(node && (node.title === "Output" || node.title === "Salida" || (node.type && (String(node.type).includes("Output") || String(node.type).includes("Salida")))));
                    const textPadLeft = isSalidaNode ? 6 : 8;
                    const textY = drawY + 13;
                    ctx.fillText(dispText, margin + textPadLeft, textY);
                }
                ctx.restore();
            };
        }

        function getTitleModeInfo(node) {
            if (!node) return null;
            const title = String(node.title || node.type || "");
            if (title.includes("IMG to pixels") || title.includes("Imagen a Partículas")) return null;
            for (const key in DYNAMIC_NODE_MODES) {
                const matches = (key === "Math" ? (title === "Math" || title === "Mates") : 
                                (key === "Text" ? (title === "Text" || title === "Texto" || (node && (node.type === "Text" || node.type === "Texto"))) : 
                                (key === "Text on Path" ? (title.includes("Text on Path") || (node && node.type && String(node.type).includes("Text on Path"))) :
                                (key === "Bezier Curve" ? (title.includes("Bezier") || title.includes("Bézier") || title.includes("Curva") || (node && node.type && String(node.type).includes("Bezier"))) :
                                (key === "Shape Walker" ? (title.includes("Shape Walker") || title.includes("Recorredor") || (node && node.type && String(node.type).includes("Shape Walker"))) :
                                (key === "Shape Manipulator" ? (title.includes("Shape Manipulator") || title.includes("Manipulador") || (node && node.type && String(node.type).includes("Shape Manipulator"))) :
                                (key === "Shape Transform" ? (title.includes("Shape Transform") || title.includes("Trans. Shape") || (node && node.type && String(node.type).includes("Shape Transform"))) :
                                (key === "Shape Array" ? (title.includes("Shape Array") || title.includes("Array") || (node && node.type && String(node.type).includes("Shape Array"))) :
                                (key === "Shapes Library" ? (title.includes("Shapes Library")) : title.includes(key))))))))));
                if (matches) {
                    const entry = DYNAMIC_NODE_MODES[key];
                    const modeList = Array.isArray(entry) ? entry : (entry.modes || []);
                    const propKey = Array.isArray(entry) ? "modo" : (entry.propKey || "modo");
                    const currentFull = String(node.properties ? (node.properties[propKey] || modeList[0].full) : modeList[0].full);
                    
                    let foundIdx = modeList.findIndex(m => m.full === currentFull || m.short === currentFull);
                    if (foundIdx < 0) foundIdx = 0;

                    const res = {
                        key: key,
                        propKey: propKey,
                        modeList: modeList,
                        currentIdx: foundIdx,
                        currentShort: modeList[foundIdx].short,
                        currentFull: modeList[foundIdx].full,
                        isSlicer: key === "Shape Slicer",
                        isShapesLib: key === "Shapes Library" || title.includes("Shapes Library") || title.includes("Formas")
                    };

                    if (!Array.isArray(entry) && entry.secondaryPropKey && (entry.secondaryModes || entry.secondaryModesMap)) {
                        const secProp = entry.secondaryPropKey;
                        const secModesMap = entry.secondaryModesMap;
                        const secModes = secModesMap ? (secModesMap[res.currentFull] || secModesMap[res.currentShort] || Object.values(secModesMap)[0]) : entry.secondaryModes;
                        const secFull = String(node.properties ? (node.properties[secProp] || secModes[0].full) : secModes[0].full);
                        let secIdx = secModes.findIndex(m => m.full === secFull || m.short === secFull);
                        if (secIdx < 0) secIdx = 0;
                        res.secondaryPropKey = secProp;
                        res.secondaryModes = secModes;
                        res.secondaryIdx = secIdx;
                        res.secondaryShort = secModes[secIdx].short;
                        res.secondaryFull = secModes[secIdx].full;
                    }

                    if (!Array.isArray(entry) && entry.tertiaryPropKey && entry.tertiaryModes) {
                        const terProp = entry.tertiaryPropKey;
                        const terModes = entry.tertiaryModes;
                        const terFull = String(node.properties ? (node.properties[terProp] || terModes[0].full) : terModes[0].full);
                        let terIdx = terModes.findIndex(m => m.full === terFull || m.short === terFull);
                        if (terIdx < 0) terIdx = 0;
                        res.tertiaryPropKey = terProp;
                        res.tertiaryModes = terModes;
                        res.tertiaryIdx = terIdx;
                        res.tertiaryShort = terModes[terIdx].short;
                        res.tertiaryFull = terModes[terIdx].full;
                    }

                    return res;
                }
            }
            return null;

        const GEOMETRIC_ANCHOR_MODES = [
            { full: "center", short: "Center" },
            { full: "origin", short: "Origin" },
            { full: "zero", short: "0,0" },
            { full: "pos", short: "Pos" }

        const ANCHOR_MODES = SLICER_ANCHOR_MODES;

        const OUT_MODES = [
            { full: "Shape", short: "Shape" },
            { full: "Clip", short: "\\clip" },
            { full: "iClip", short: "\\iclip" }
        ];

        function updateNodeModeInputs(node) {
            if (!node) return;
            const modeInfo = getTitleModeInfo(node);
            const title = String(node.title || node.type || "");

            let specList = null;
            const isSysVar = title.includes("Sys Var") || title.includes("SysVar");
            if (isSysVar) {
                const varName = String((node.properties ? (node.properties.var_name || node.properties.variable || node.properties.modo) : "") || "").trim();
                const cleanV = varName.toLowerCase().replace("fx.", "");
                if (MODE_INPUT_SPECS["Sys Var"] && MODE_INPUT_SPECS["Sys Var"][cleanV]) {
                    specList = MODE_INPUT_SPECS["Sys Var"][cleanV];
                } else if (MODE_INPUT_SPECS["Variables/Sys Var"] && MODE_INPUT_SPECS["Variables/Sys Var"][cleanV]) {
                    specList = MODE_INPUT_SPECS["Variables/Sys Var"][cleanV];
                } else if (MODE_INPUT_SPECS["Sys Var"] && MODE_INPUT_SPECS["Sys Var"][varName]) {
                    specList = MODE_INPUT_SPECS["Sys Var"][varName];
                } else {
                    specList = [];
                }
            } else if (modeInfo) {
                const nodeKey = modeInfo.key;
                const curMode = modeInfo.currentFull;
                if (MODE_INPUT_SPECS[nodeKey]) {
                    if (nodeKey === "Math") {
                        const secMode = node.properties ? (node.properties["operacion"] || "Suma") : "Suma";
                        specList = MODE_INPUT_SPECS["Math"][secMode] || MODE_INPUT_SPECS["Math"]["Suma"];
                    } else if (nodeKey === "Shape Array") {
                        const secMode = node.properties ? (node.properties["modo"] || "Grid") : "Grid";
                        specList = MODE_INPUT_SPECS["Shape Array"][secMode] || MODE_INPUT_SPECS["Shape Array"]["Grid"];
                    } else {
                        specList = MODE_INPUT_SPECS[nodeKey][curMode] || MODE_INPUT_SPECS[nodeKey]["DEFAULT"];
                    }
                }

                // Adjust property values dynamically when switching modes for MultiRandom
                if (nodeKey === "MultiRandom") {
                    if (!node.properties) node.properties = {};
                    if (curMode === "Rcolor") {
                        if (node.properties.min === "0" || node.properties.min === "50" || node.properties.min === undefined) {
                            node.properties.min = "&HFFFFFF&";
                        }
                        if (node.properties.max === "100" || node.properties.max === "360" || node.properties.max === undefined) {
                            node.properties.max = "&H000000&";
                        }
                    } else if (curMode === "Rstep") {
                        if (node.properties.max === "100" || node.properties.max === "&H000000&") {
                            node.properties.max = "360";
                        }
                        if (node.properties.step === "" || node.properties.step === undefined) {
                            node.properties.step = "45";
                        }
                        if (node.properties.min && (node.properties.min.startsWith("&H") || node.properties.min.startsWith("#"))) {
                            node.properties.min = "0";
                        }
                    } else if (curMode === "Rbool") {
                        if (node.properties.min === "0" || (node.properties.min && (node.properties.min.startsWith("&H") || node.properties.min.startsWith("#")))) {
                            node.properties.min = "50";
                        }
                    } else if (curMode === "Re") {
                        if (node.properties.options === undefined || node.properties.options === "") {
                            node.properties.options = "opc1, opc2, opc3";
                        }
                    } else if (curMode === "Rfake") {
                        if (node.properties.counter === undefined || node.properties.counter === "") {
                            node.properties.counter = "i";
                        }
                        if (node.properties.min && (node.properties.min.startsWith("&H") || node.properties.min.startsWith("#"))) {
                            node.properties.min = "0";
                        }
                        if (node.properties.max && (node.properties.max.startsWith("&H") || node.properties.max.startsWith("#"))) {
                            node.properties.max = "100";
                        }
                    } else {
                        if (node.properties.min && (node.properties.min.startsWith("&H") || node.properties.min.startsWith("#"))) {
                            node.properties.min = "0";
                        }
                        if (node.properties.max && (node.properties.max.startsWith("&H") || node.properties.max.startsWith("#") || node.properties.max === "360")) {
                            node.properties.max = "100";
                        }
                    }
                }
            }

            if (!specList) {
                if (MODE_INPUT_SPECS[title]) {
                    specList = MODE_INPUT_SPECS[title]["DEFAULT"] || Object.values(MODE_INPUT_SPECS[title])[0];
                } else {
                    for (const key in MODE_INPUT_SPECS) {
                        if (key === "Particles" && title.includes("Imagen a Partículas")) continue;
                        if (title.includes(key) || (key.includes("/") && key.split("/").some(k => title.includes(k.trim())))) {
                            specList = MODE_INPUT_SPECS[key]["DEFAULT"] || Object.values(MODE_INPUT_SPECS[key])[0];
                            break;
                        }
                    }
                }
            }

            if (!specList && node.inputs && node.inputs.length > 0) {
                specList = node.inputs.map(inp => {
                    const name = inp.name;
                    const propKey = inp.property || (inp.name && inp.name.startsWith("In") ? inp.name : name.toLowerCase());
                    const defVal = (node.properties && node.properties[propKey] !== undefined) ? String(node.properties[propKey]) : "";
                    return { name: name, default: defVal, property: propKey };
                });
            }

            if (!specList) return;

            const oldInputs = node.inputs ? [...node.inputs] : [];
            node.inputs = [];
            node.widgets = [];

            // If node is expandable, collect all extra inputs (In3, In4...) so every input gets both a port and a text box
            const fullSpecList = [...specList];
            if (node.properties && node.properties.expandable) {
                const existingNames = new Set(fullSpecList.map(s => s.name));
                oldInputs.forEach(oldInp => {
                    if (oldInp && oldInp.name && !existingNames.has(oldInp.name)) {
                        existingNames.add(oldInp.name);
                        const pKey = oldInp.property || oldInp.name;
                        const defVal = (node.properties && node.properties[pKey] !== undefined) ? String(node.properties[pKey]) : "";
                        fullSpecList.push({ name: oldInp.name, default: defVal, property: pKey });
                    }
                });
            }

            const graph = node.graph || (window.LGraphCanvas && window.LGraphCanvas.active_canvas ? window.LGraphCanvas.active_canvas.graph : null);
            const remainingOldInputs = [...oldInputs];

            const startY = 11;
            fullSpecList.forEach((spec, idx) => {
                const portName = spec.name;
                const propKey = spec.property || portName;
                if (!node.properties) node.properties = {};
                if (node.properties[propKey] === undefined) {
                    node.properties[propKey] = spec.default;
                }
                
                const oldInpIdx = remainingOldInputs.findIndex(i => (i && i.property && i.property === propKey) || (i && i.name && (i.name === portName || i.name === propKey)));
                let linkId = null;
                if (oldInpIdx !== -1) {
                    const oldInp = remainingOldInputs[oldInpIdx];
                    linkId = oldInp.link;
                    remainingOldInputs.splice(oldInpIdx, 1);
                }

                const yPos = startY + idx * 23;
                const isNoSocket = !!spec.no_socket;

                if (!isNoSocket) {
                    if (linkId !== null && linkId !== undefined && graph && graph.links && graph.links[linkId]) {
                        const linkObj = graph.links[linkId];
                        if (Array.isArray(linkObj)) {
                            linkObj[4] = node.inputs.length;
                        } else if (typeof linkObj === "object") {
                            linkObj.target_slot = node.inputs.length;
                        }
                    }

                    const dotY = yPos + 9;
                    node.inputs.push({
                        name: portName,
                        type: 0,
                        link: linkId,
                        pos: [10, dotY],
                        label: " ",
                        property: propKey
                    });
                }

                const curVal = String(node.properties[propKey] !== undefined ? node.properties[propKey] : spec.default);
                const w = node.addWidget("text", portName, curVal, function(val) {
                    const cleanVal = String(val || "").replace(/[\r\n]+/g, " ");
                    if (node.properties) {
                        node.properties[propKey] = cleanVal;
                    }
                    if (node.computeSize) {
                        const sz = node.computeSize();
                        node.size[0] = Math.max(node.size[0], sz[0]);
                        node.size[1] = Math.max(node.size[1], sz[1]);
                    }
                    if (node.setDirtyCanvas) node.setDirtyCanvas(true, true);
                    if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                });
                w.property = propKey;
                w.last_y = yPos;
                w.y = yPos;

                if (spec.type === "button") {
                    w.type = "custom";
                    w.isCyclicButtonWidget = true;
                    if (portName === "Binarize Mode") {
                        const BIN_MODES = [
                            { full: "Luminancia", short: "Grises" },
                            { full: "Silueta", short: "Silueta" },
                            { full: "Bordes", short: "Bordes" }
                        ];
                        w.draw = function(ctx, n, width, y, height) {
                            const drawY = (w.last_y !== undefined) ? w.last_y : y;
                            const curB = (n.properties && n.properties.bin_mode) ? n.properties.bin_mode : (w.value || "Luminancia");
                            const bObj = BIN_MODES.find(m => m.full.toLowerCase() === curB.toLowerCase()) || BIN_MODES[0];

                            ctx.save();
                            ctx.font = "bold 11px monospace";
                            ctx.fillStyle = "#94a3b8";
                            ctx.textAlign = "left";
                            const labelText = "Modo Bin:";
                            ctx.fillText(labelText, 22, drawY + 13);

                            const textW = ctx.measureText(labelText).width;
                            const btnX = Math.ceil(22 + textW + 8);
                            const btnW = 68;
                            const btnH = 18;

                            ctx.fillStyle = "#12161f";
                            ctx.strokeStyle = "#8b5cf6";
                            ctx.lineWidth = 1.5;
                            ctx.beginPath();
                            if (ctx.roundRect) ctx.roundRect(btnX, drawY, btnW, btnH, 5);
                            else ctx.rect(btnX, drawY, btnW, btnH);
                            ctx.fill();
                            ctx.stroke();

                            ctx.fillStyle = "#a7f3d0";
                            ctx.textAlign = "center";
                            ctx.fillText(bObj.short, btnX + btnW / 2, drawY + 13);
                            ctx.restore();
                        };
                        w.onClick = function(canvas) {
                            const curB = (node.properties && node.properties.bin_mode) ? node.properties.bin_mode : "Luminancia";
                            const curIdx = BIN_MODES.findIndex(m => m.full.toLowerCase() === curB.toLowerCase());
                            const nextIdx = (curIdx === -1) ? 0 : ((curIdx + 1) % BIN_MODES.length);
                            const nextObj = BIN_MODES[nextIdx];
                            node.properties.bin_mode = nextObj.full;
                            w.value = nextObj.full;

            node.properties = node.properties || { expandable: true, separador: "nil" };

            node.updateConcatenarInputs = function(targetCount) {
                let count = targetCount;
                if (count === undefined) {
                    count = 0;
                    if (this.inputs) {
                        for (let i = 0; i < this.inputs.length; i++) {
                            if (this.inputs[i].name && this.inputs[i].name.startsWith("In")) count++;
                        }
                    }
                    if (count < 2) count = 2;
                }

                if (!this.inputs) this.inputs = [];
                for (let i = 1; i <= count; i++) {
                    const name = "In" + i;
                    const exists = this.inputs.some(inp => inp.name === name);
                    if (!exists) {
                        this.addInput(name, "data");
                    }
                }

                for (let i = this.inputs.length - 1; i >= 0; i--) {
                    const inp = this.inputs[i];
                    if (inp.name && inp.name.startsWith("In")) {
                        const num = parseInt(inp.name.substring(2));
                        if (num > count) {
                            this.removeInput(i);
                        }
                    }
                }

                if (!this.outputs || this.outputs.length === 0) {
                    this.addOutput("String", "data");
                }

                this.widgets = [];
                for (let i = 1; i <= count; i++) {
                    const prop = "In" + i;
                    const name = "In" + i;
                    if (this.properties[prop] === undefined) {
                        this.properties[prop] = "";
                    }
                    const curVal = String(this.properties[prop] || "");

                } else if (titleText.includes("Audio Modulator") || (this.type && this.type.includes("Audio"))) {
                    req_w = Math.max(req_w, 225);
                } else if (titleText.includes("Curva") || titleText.includes("Bezier")) {
                    req_w = Math.max(req_w, 235);
                    req_h = Math.max(req_h, 150);
                } else if (titleText.includes("Shape Walker") || titleText.includes("Recorredor")) {
                    req_w = Math.max(req_w, 235);
                } else if (titleText.includes("Clip") || titleText.includes("Shape Manipulator") || titleText.includes("Manipulador") || titleText.includes("Shape Transform") || titleText.includes("Trans. Shape") || titleText.includes("Shape Stroke") || titleText.includes("Stroke") || titleText.includes("Trazo") || titleText.includes("Ipol") || titleText.includes("Interpolator")) {
                    req_w = Math.max(req_w, 215);
                }

                const isShapesLib = titleText.includes("Shapes Library") || titleText.includes("Formas");
                if (isShapesLib) {
                    req_w = Math.max(req_w, 205);
                    req_h = Math.max(req_h, 54);
                }
                const isSysVar = titleText.includes("Sys Var") || titleText.includes("SysVar");
                const isModuleNode = titleText.includes("Module") || titleText.includes("Módulo") || titleText.includes("Modulo") || (this.type && this.type.includes("Module"));
                if (isSysVar) {
                    req_w = Math.max(req_w, 185);
                    req_h = Math.max(req_h, 52);
                } else if (isModuleNode) {
                    req_w = Math.max(req_w, 180);
                    req_h = Math.max(req_h, 95);
                }
                if (this.properties && this.properties.expandable) {
                    req_w = Math.max(req_w, 160);
                    req_h = 11 + nodeInputs.length * 23 + 28;
                }
                return [req_w, req_h];
            };

            const oldDraw = node.onDrawForeground;
            node.onDrawForeground = function(ctx) {
                if (oldDraw) oldDraw.call(this, ctx);
                if (this.flags && this.flags.collapsed) return;

                // Render Title Bar Cyclic Mode Buttons
                const modeInfo = getTitleModeInfo(this);
                if (modeInfo) {
                    ctx.save();
                    ctx.font = "bold 10px monospace";
                    const btnH = 20;
                    const btnY = -25;

                    if (modeInfo.secondaryModes) {
                        const hasTertiary = Boolean(modeInfo.tertiaryModes);
                        const w3 = hasTertiary ? 22 : 0;
                        const btnText2 = modeInfo.secondaryShort;
                        const btnText1 = modeInfo.currentShort;
                        const textW2 = ctx.measureText(btnText2).width;
                        const textW1 = ctx.measureText(btnText1).width;
                        const w2 = Math.max(35, textW2 + 10);
                        const w1 = Math.max(38, textW1 + 10);

                        const btnX3 = hasTertiary ? (this.size[0] - w3 - 8) : this.size[0];
                        const btnX2 = hasTertiary ? (btnX3 - w2 - 5) : (this.size[0] - w2 - 8);
                        const btnX1 = btnX2 - w1 - 5;

                        // Badge 3 (Icono Forma/Contraforma Invertir - Sin Texto)
                        if (hasTertiary) {
                            const terVal = String(modeInfo.tertiaryFull).toLowerCase();
                            const isInverted = terVal === "invertido" || terVal === "invert" || terVal === "true" || terVal === "1";

                            ctx.fillStyle = "rgba(18, 22, 31, 0.85)";
                            ctx.strokeStyle = isInverted ? "#f59e0b" : "#8b5cf6";
                            ctx.lineWidth = 1.2;
                            ctx.beginPath();
                            if (ctx.roundRect) ctx.roundRect(btnX3, btnY, w3, btnH, 10);
                            else ctx.rect(btnX3, btnY, w3, btnH);
                            ctx.fill();
                            ctx.stroke();

                            // Icono vectorial 2D Forma/Contraforma (Círculo dividido en 2 mitades de contraste)
                            const iconCX = btnX3 + w3 / 2;
                            const iconCY = btnY + btnH / 2;
                            const iconR = 5.0;

                            ctx.save();
                            ctx.beginPath();
                            ctx.arc(iconCX, iconCY, iconR, 0, Math.PI * 2);
                            ctx.fillStyle = "#12161f";
                            ctx.fill();

                            // Mitad de relleno (izquierda en Normal, derecha en Invertido)
                            ctx.beginPath();
                            if (isInverted) {
                                ctx.arc(iconCX, iconCY, iconR, Math.PI * 1.5, Math.PI * 0.5, false);
                            } else {
                                ctx.arc(iconCX, iconCY, iconR, Math.PI * 0.5, Math.PI * 1.5, false);
                            }
                            ctx.closePath();
                            ctx.fillStyle = isInverted ? "#fbbf24" : "#a7f3d0";
                            ctx.fill();

                            // Borde exterior del círculo
                            ctx.beginPath();
                            ctx.arc(iconCX, iconCY, iconR, 0, Math.PI * 2);
                            ctx.strokeStyle = isInverted ? "#fbbf24" : "#a7f3d0";
                            ctx.lineWidth = 1.2;
                            ctx.stroke();
                            ctx.restore();
                        }

                        // Badge 2 (Anclaje / orden)
                        ctx.fillStyle = "rgba(18, 22, 31, 0.85)";
                        ctx.strokeStyle = "#0284c7";
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        if (ctx.roundRect) ctx.roundRect(btnX2, btnY, w2, btnH, 10);
                        else ctx.rect(btnX2, btnY, w2, btnH);
                        ctx.fill();
                        ctx.stroke();

                        ctx.fillStyle = "#38bdf8";
                        ctx.textAlign = "center";
                        ctx.fillText(btnText2, btnX2 + w2 / 2, btnY + 14);

                        // Badge 1 (Modo)
                        ctx.fillStyle = "rgba(18, 22, 31, 0.85)";
                        ctx.strokeStyle = "#8b5cf6";
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        if (ctx.roundRect) ctx.roundRect(btnX1, btnY, w1, btnH, 10);
                        else ctx.rect(btnX1, btnY, w1, btnH);
                        ctx.fill();
                        ctx.stroke();

                        ctx.fillStyle = "#a7f3d0";
                        ctx.textAlign = "center";
                        ctx.fillText(btnText1, btnX1 + w1 / 2, btnY + 14);
                    } else {
                        const btnText = modeInfo.currentShort;
                        const textW = ctx.measureText(btnText).width;
                        const isPickerPill = modeInfo.isSlicer || modeInfo.isShapesLib;
                        const btnW = Math.max(55, textW + (isPickerPill ? 26 : 14));
                        const btnX = this.size[0] - btnW - 8;

                        // Button pill background
                        ctx.fillStyle = "rgba(18, 22, 31, 0.85)";
                        ctx.strokeStyle = "#8b5cf6";
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        if (ctx.roundRect) ctx.roundRect(btnX, btnY, btnW, btnH, 10);
                        else ctx.rect(btnX, btnY, btnW, btnH);
                        ctx.fill();
                        ctx.stroke();

                        // Text
                        ctx.fillStyle = "#a7f3d0";
                        ctx.textAlign = "left";
                        ctx.fillText(btnText, btnX + (isPickerPill ? 7 : (btnW - textW) / 2), btnY + 14);

                        if (isPickerPill) {
                            const iconX = btnX + btnW - 16;
                            const iconY = btnY + 4;
                            ctx.strokeStyle = "#a7f3d0";
                            ctx.lineWidth = 1.0;
                            if (modeInfo.isSlicer) {
                                ctx.strokeRect(iconX, iconY, 9, 9);
                                ctx.beginPath();
                                ctx.moveTo(iconX + 4.5, iconY);
                                ctx.lineTo(iconX + 4.5, iconY + 9);
                                ctx.moveTo(iconX, iconY + 4.5);
                                ctx.lineTo(iconX + 9, iconY + 4.5);
                                ctx.stroke();
                            } else {
                                ctx.beginPath();
                                ctx.arc(iconX + 4.5, iconY + 4.5, 4, 0, Math.PI * 2);
                                ctx.stroke();
                            }
                        }
                    }
                    ctx.restore();
                }

                if (this.widgets) {
                    for (let i = 0; i < this.widgets.length; i++) {
                        const yPos = 11 + i * 23;
                        const w = this.widgets[i];
                        w.y = yPos;
                        w.last_y = yPos;
                        if (w.draw) {
                            w.draw(ctx, this, this.size[0], yPos, 18);
                        }
                    }
                }

                if (this.inputs) {
                    for (let i = 0; i < this.inputs.length; i++) {
                        const yPos = 11 + i * 23;
                        this.inputs[i].label = " ";
                        this.inputs[i].pos = [10, yPos + 9];
                    }
                }

                // Footer Loop Counters for Loop/Generator nodes
                let footerCounterText = "";
                const titleText = String(this.title || this.type || "");
                if (titleText.includes("Slicer")) {
                    footerCounterText = "s_i, s_n";
                } else if (titleText.includes("Shape Array") || titleText.includes("Array")) {
                    const outMode = String((this.properties && this.properties.out_mode) || "Loops").toLowerCase();
                    if (outMode.includes("loop")) {
                        footerCounterText = "a_i, a_n";
                    }
                } else if (titleText.includes("Text to Particle") || titleText.includes("From Text")) {
                    footerCounterText = "tp_i, tp_n";
                } else if (titleText.includes("IMG to pixels") || titleText.includes("IMG to Pixels") || titleText.includes("IMG to Particle") || titleText.includes("Particles")) {
                    footerCounterText = "p_i, p_n";
                } else if (titleText.includes("IMG to Shape") || titleText.includes("IMG to shape")) {
                    footerCounterText = "j, total_frames";
                } else if (titleText.includes("Concentric Borders") || titleText.includes("Concentric Borders") || titleText.includes("Bordes")) {
                    footerCounterText = "b_i, b_n";
                } else if (titleText.includes("Clip Gradient") || titleText.includes("Clip")) {
                    footerCounterText = "c_i, c_n";
                } else if (titleText.includes("MaxLoop") || titleText.includes("Max Loop")) {
                    const varName = (this.properties && this.properties.var_name) ? String(this.properties.var_name).trim() : "j";
                    footerCounterText = `${varName}, max${varName}`;
                } else if (titleText.includes("Module") || titleText.includes("Módulo") || titleText.includes("Modulo")) {
                    // Extraer nombres dinámicos de los datos activos (prioridad: cable > caja de texto)
                    function resolveLoopPort(graph, inputPort, defaultVal, isTotal) {
                        if (graph && inputPort && inputPort.link !== null && inputPort.link !== undefined) {
                            const linkObj = graph.links[inputPort.link];
                            if (linkObj) {
                                const originNode = graph.getNodeById(linkObj.origin_id);
                                if (originNode) {
                                    const origTitle = String(originNode.title || originNode.type || "");
                                    const slot = linkObj.origin_slot;

                                    if (origTitle.includes("Main Loop") || origTitle.includes("MainLoop") || origTitle.includes("Bucle Primario")) {
                                        const iter = String((originNode.properties && originNode.properties.iterador) || "syl").toLowerCase();
                                        if (slot === 1) return `${iter}.i`;
                                        if (slot === 2) return `${iter}.n`;
                                        return isTotal ? `${iter}.n` : `${iter}.i`;
                                    }
                                    if (origTitle.includes("MaxLoop") || origTitle.includes("Max Loop")) {
                                        const vName = String((originNode.properties && originNode.properties.var_name) || "j").trim() || "j";
                                        if (slot === 1) return vName;
                                        if (slot === 2) return `max${vName}`;
                                        return isTotal ? `max${vName}` : vName;
                                    }
                                    if (origTitle.includes("Shape Array") || origTitle.includes("Array")) {
                                        if (slot === 5) return "a_i";
                                        if (slot === 6) return "a_n";
                                        return isTotal ? "a_n" : "a_i";
                                    }
                                    if (origTitle.includes("Slicer")) {
                                        return isTotal ? "s_n" : "s_i";
                                    }
                                    if (origTitle.includes("Text to Particle") || origTitle.includes("From Text")) {
                                        return isTotal ? "tp_n" : "tp_i";
                                    }
                                    if (origTitle.includes("IMG to pixels") || origTitle.includes("IMG to Pixels") || origTitle.includes("IMG to Particle") || origTitle.includes("Particles")) {
                                        return isTotal ? "p_n" : "p_i";
                                    }
                                    if (origTitle.includes("Concentric Borders") || origTitle.includes("Bordes")) {
                                        return isTotal ? "b_n" : "b_i";
                                    }
                                    if (origTitle.includes("Clip Gradient") || origTitle.includes("Clip")) {
                                        return isTotal ? "c_n" : "c_i";
                                    }
                                    if (originNode.outputs && originNode.outputs[slot]) {
                                        const outName = originNode.outputs[slot].name || "";
                                        const mMatch = outName.match(/\(([^)]+)\)/);
                                        return mMatch ? mMatch[1] : outName;
                                    }
                                }
                            }
                        }
                        return defaultVal;
                    }

                    let rawIter = (this.properties && (this.properties.iter !== undefined ? this.properties.iter : this.properties.i)) || "i";
                    let rawTotal = (this.properties && (this.properties.total !== undefined ? this.properties.total : this.properties.N)) || "N";

                    if (this.widgets) {
                        if (this.widgets[0] && this.widgets[0].value !== undefined && String(this.widgets[0].value).trim() !== "") rawIter = String(this.widgets[0].value).trim();
                        if (this.widgets[1] && this.widgets[1].value !== undefined && String(this.widgets[1].value).trim() !== "") rawTotal = String(this.widgets[1].value).trim();
                    }

                    const iterLabel = resolveLoopPort(this.graph, (this.inputs && this.inputs[0]), rawIter, false);
                    const totalLabel = resolveLoopPort(this.graph, (this.inputs && this.inputs[1]), rawTotal, true);

                    footerCounterText = `${iterLabel}, ${totalLabel}`;
                }

                if (footerCounterText) {
                    ctx.save();
                    ctx.font = "italic 11px monospace";
                    ctx.fillStyle = "#94a3b8";
                    ctx.textAlign = "center";
                    ctx.fillText(footerCounterText, this.size[0] / 2, this.size[1] - 6);
                    ctx.restore();
                }
            };
        }

        function setupPolaresNode(node) {
            if (!node.properties) node.properties = {};
            if (node.properties.x === undefined) node.properties.x = "0";
            if (node.properties.y === undefined) node.properties.y = "0";
            if (node.properties.angle === undefined) node.properties.angle = "0";
            if (node.properties.radius === undefined) node.properties.radius = "100";

            node.widgets_up = true;

            const reqInputs = [
                { name: "Origin X", type: "data", label: " " },
                { name: "Origin Y", type: "data", label: " " },
                { name: "Angle (°)", type: "data", label: " " },
                { name: "Radius", type: "data", label: " " }
            ];

            const reqOutputs = [
                { name: "\\pos Tag", type: "data" },
                { name: "X", type: "data" },
                { name: "Y", type: "data" },
                { name: "dX", type: "data" },
                { name: "dY", type: "data" }
            ];

            function updatePolaresInputs() {
                if (!node.inputs) node.inputs = [];
                reqInputs.forEach((req, idx) => {
                    if (idx >= node.inputs.length) {
                        node.addInput(req.name, req.type);
                    }
                    const inp = node.inputs[idx];
                    inp.name = req.name;
                    inp.type = req.type;
                    inp.label = req.label;
                });

                if (!node.outputs) node.outputs = [];
                reqOutputs.forEach((req, idx) => {
                    if (idx >= node.outputs.length) {
                        node.addOutput(req.name, req.type);
                    }
                    const out = node.outputs[idx];
                    out.name = req.name;
                    out.type = req.type;
                });

                node.widgets = [];

                const propsConfig = [
                    { name: "Origin X", prop: "x", aliases: ["x", "Origin X", "x_origen"], default: "0", y: 11, dotY: 20 },
                    { name: "Origin Y", prop: "y", aliases: ["y", "Origin Y", "y_origen"], default: "0", y: 34, dotY: 43 },
                    { name: "Angle (°)", prop: "angle", aliases: ["angle", "angulo", "Angle (°)", "Angle", "ang"], default: "0", y: 57, dotY: 66 },
                    { name: "Radius", prop: "radius", aliases: ["radius", "radio", "Radius", "rad", "r"], default: "100", y: 80, dotY: 89 }
                ];

                propsConfig.forEach((item, idx) => {
                    let foundVal = undefined;
                    for (const a of item.aliases) {
                        if (node.properties[a] !== undefined && node.properties[a] !== null) {
                            foundVal = node.properties[a];
                            break;
                        }
                    }
                    const curVal = String(foundVal !== undefined ? foundVal : item.default);
                    node.properties[item.prop] = curVal;
                    item.aliases.forEach(a => { node.properties[a] = curVal; });

                    const w = node.addWidget("text", item.name, curVal, function(val) {
                        const cleanVal = String(val || "").replace(/[\r\n]+/g, " ");
                        node.properties[item.prop] = cleanVal;
                        item.aliases.forEach(a => { node.properties[a] = cleanVal; });
                        if (node.computeSize) node.size = node.computeSize();
                        if (node.setDirtyCanvas) node.setDirtyCanvas(true, true);
                        if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                    });
                    w.property = item.prop;
                    w.last_y = item.y;
                    w.y = item.y;
                    setupSingleLineTextWidget(node, w, item.name, item.prop);

                    if (node.inputs[idx]) {
                        node.inputs[idx].label = " ";
                        node.inputs[idx].pos = [10, item.dotY];
                    }
                });

                if (node.computeSize) {
                    node.size = node.computeSize();
                }
                if (node.setDirtyCanvas && node.graph) node.setDirtyCanvas(true, true);
            }

            node.computeSize = function() {
                let base_w = 205;
                let text_req_w = 0;
                if (node.properties) {
                    ["x", "y", "angle", "radius"].forEach(k => {
                        const val = String(node.properties[k] || "");
                        if (val.length > 0) {
                            const tw = getExactTextWidth(val, "bold 11px Consolas, monospace");
                            if (tw > text_req_w) text_req_w = tw;
                        }
                    });
                }
                const right_space = getNodeRightReserve(this);
                const boxW = Math.max(65, Math.ceil(text_req_w + 28));
                return [Math.max(base_w, 22 + boxW + right_space), 115];
            };

            const oldDraw = node.onDrawForeground;
            node.onDrawForeground = function(ctx) {
                if (oldDraw) oldDraw.call(this, ctx);
                if (this.flags && this.flags.collapsed) return;

                if (this.widgets && this.widgets.length >= 4) {
                    this.widgets[0].y = 11; this.widgets[0].last_y = 11;
                    this.widgets[1].y = 34; this.widgets[1].last_y = 34;
                    this.widgets[2].y = 57; this.widgets[2].last_y = 57;
                    this.widgets[3].y = 80; this.widgets[3].last_y = 80;
                }

                if (this.inputs && this.inputs.length >= 4) {
                    this.inputs[0].label = " "; this.inputs[0].pos = [10, 20];
                    this.inputs[1].label = " "; this.inputs[1].pos = [10, 43];
                    this.inputs[2].label = " "; this.inputs[2].pos = [10, 66];
                    this.inputs[3].label = " "; this.inputs[3].pos = [10, 89];
                }
            };

            const oldConfigure = node.onConfigure;
            node.onConfigure = function(info) {
                if (oldConfigure) oldConfigure.call(this, info);
                updatePolaresInputs();
            };

            updatePolaresInputs();
        }

        function getNodePreviewAspectRatio(node) {
            if (node) {
                const nodeIdStr = String(node.id !== undefined ? node.id : "");
                const p = (nodeIdStr && window.PyxisNodePlayerManager && window.PyxisNodePlayerManager.activePlayers) 
                    ? window.PyxisNodePlayerManager.activePlayers[nodeIdStr] 
                    : null;

                // 1. Medición directa del elemento <video> real si ya tiene metadata cargada
                if (p && p.art && p.art.template && p.art.template.$video) {
                    const vid = p.art.template.$video;
                    if (vid.videoWidth > 0 && vid.videoHeight > 0) {
                        const vidAspect = vid.videoWidth / vid.videoHeight;
                        node.preview_aspect_ratio = vidAspect;
                        if (node.properties) node.properties.preview_aspect_ratio = vidAspect;
                        return vidAspect;
                    }
                }

                // 2. Aspect ratio asignado específicamente al nodo o serializado en properties
                if (node.preview_aspect_ratio && !isNaN(node.preview_aspect_ratio) && node.preview_aspect_ratio > 0) {
                    return node.preview_aspect_ratio;
                }
                if (node.properties && node.properties.preview_aspect_ratio && !isNaN(node.properties.preview_aspect_ratio) && node.properties.preview_aspect_ratio > 0) {
                    node.preview_aspect_ratio = node.properties.preview_aspect_ratio;
                    return node.properties.preview_aspect_ratio;
                }

                // 3. Aspect ratio según la fuente activa del nodo (base o aegisub)
                const curSrc = (node.properties && node.properties.preview_source) || "base";
                if (curSrc === "base" && window.PyxisPreviewConfigBase && window.PyxisPreviewConfigBase.aspect_ratio) {
                    return window.PyxisPreviewConfigBase.aspect_ratio;
                }
                if (curSrc === "aegisub" && window.PyxisPreviewConfigAegi && window.PyxisPreviewConfigAegi.aspect_ratio) {
                    return window.PyxisPreviewConfigAegi.aspect_ratio;
                }
            }

            // 4. Configuración global por fuente si está disponible
            if (window.PyxisPreviewConfigBase && window.PyxisPreviewConfigBase.aspect_ratio) {
                return window.PyxisPreviewConfigBase.aspect_ratio;
            }
            if (window.PyxisPreviewConfig && window.PyxisPreviewConfig.aspect_ratio && !isNaN(window.PyxisPreviewConfig.aspect_ratio) && window.PyxisPreviewConfig.aspect_ratio > 0) {
                return window.PyxisPreviewConfig.aspect_ratio;
            }

            return 16 / 9;
        }

        function getDynamicMinPreviewWidth(aspect) {
            let a = aspect;
            if (!a || isNaN(a) || a <= 0) {
                a = getNodePreviewAspectRatio(null);
            }
            if (a < 0.75) {
                // Vertical (ej. 9:16 Shorts/TikTok)
                return 340;
            } else if (a < 1.15) {
                // Cuadrado / Casi cuadrado (ej. 1:1, 4:5)
                return 380;
            } else if (a < 1.5) {
                // Formato clásico (ej. 4:3, 5:4)
                return 420;
            } else {
                // Formato panorámico (ej. 16:9, 16:10, 21:9)
                return 440;
            }
        }

        function calculatePrevisualizadorNodeHeight(w, customAspect) {
            const sideMargin = 10;
            const topOffset = 46;
            const bottomMargin = 10;
            const controlsHeight = 68;
            
            let aspect = customAspect;
            if (!aspect || isNaN(aspect) || aspect <= 0) {
                aspect = getNodePreviewAspectRatio(null);
            }

            const playerW = Math.max(100, w - (sideMargin * 2));
            const videoH = Math.round(playerW / aspect);
            const wrapperH = videoH + controlsHeight;
            return wrapperH + topOffset + bottomMargin;
        }

        function setupPrevisualizadorNode(node) {
            if (!node.properties) node.properties = {};
            if (node.properties.salida_ids === undefined) node.properties.salida_ids = "";
            if (node.properties.preview_source === undefined) node.properties.preview_source = "base";

            node.widgets_up = true;

            if (!node.inputs || node.inputs.length === 0) {
                node.inputs = [{ name: "Output", type: "data", multiple: true, label: " ", pos: [10, 23] }];
            } else {
                while (node.inputs.length > 1) {
                    node.removeInput(node.inputs.length - 1);
                }
                node.inputs[0].name = "Output";
                node.inputs[0].type = "data";
                node.inputs[0].multiple = true;
                node.inputs[0].label = " ";
                node.inputs[0].pos = [10, 23];
            }

            node.widgets = [];
            let curVal = String(node.properties.salida_ids || "");
            const w = node.addWidget("text", "Output IDs", curVal, function(val) {
                const cleanVal = String(val || "").replace(/[\r\n]+/g, " ");
                node.properties.salida_ids = cleanVal;
                if (node.setDirtyCanvas) node.setDirtyCanvas(true, true);
                if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
            });
            w.property = "salida_ids";
            w.last_y = 14;
            w.y = 14;
            setupSingleLineTextWidget(node, w, "Output IDs", "salida_ids");

            node.resizable = true;
            if (!node.flags) node.flags = {};
            node.flags.resizable = true;

            node.computeSize = function() {
                let text_req_w = 0;
                const props = this.properties || node.properties || {};
                const val = String(props.salida_ids || "");
                if (val.length > 0) {
                    text_req_w = getExactTextWidth(val, "bold 11px Consolas, monospace");

        function setupFormatDinamicoNode(node) {
            if (!node) return;
            if (!node.properties) node.properties = {};
            if (node.properties.Formato === undefined) node.properties.Formato = "%s";
            node.properties.expandable = true;
            node.widgets_up = true;

            node.computeSize = function() {
                const props = this.properties || node.properties || {};
                const valStr = String(props.Formato !== undefined ? props.Formato : "%s");
                const textWidth = getExactTextWidth(valStr, "bold 11px Consolas, monospace");
                const boxW = Math.max(80, Math.ceil(textWidth + 36));
                const count = (this.inputs || node.inputs) ? (this.inputs || node.inputs).length : 1;
                const reqH = 56 + count * 22 + 10;
                return [Math.max(180, boxW + 24), reqH];
            };

            node.updateFormatDinamicoInputs = function(targetCount) {
                let count = targetCount;
                if (count === undefined) {
                    count = 0;
                    if (this.inputs) {
                        for (let i = 0; i < this.inputs.length; i++) {
                            if (this.inputs[i].name && this.inputs[i].name.startsWith("In")) count++;
                        }
                    }
                    if (count < 1) count = 1;
                }

                if (!this.inputs) this.inputs = [];

                // 1. Agregar entradas faltantes
                for (let i = 1; i <= count; i++) {
                    const name = "In" + i;
                    const exists = this.inputs.some(inp => inp.name === name);
                    if (!exists) {
                        this.addInput(name, "data");
                    }
                }

                // 2. Eliminar entradas sobrantes
                for (let i = this.inputs.length - 1; i >= 0; i--) {
                    const inp = this.inputs[i];
                    if (inp.name && inp.name.startsWith("In")) {
                        const num = parseInt(inp.name.substring(2));
                        if (num > count) {
                            this.removeInput(i);
                        }
                    } else if (inp.name === "Formato") {
                        this.removeInput(i);
                    }
                }

                if (!this.outputs || this.outputs.length === 0) {
                    this.addOutput("String", "data");
                }

                // 3. Posicionar entradas en el nodo
                for (let i = 0; i < this.inputs.length; i++) {
                    const dotY = 56 + i * 22;
                    this.inputs[i].name = "In" + (i + 1);
                    this.inputs[i].label = " ";
                    this.inputs[i].pos = [10, dotY];
                }

                // 4. Widget de Formato (único widget en el nodo)
                this.widgets = [];
                const curVal = String(this.properties.Formato !== undefined ? this.properties.Formato : "%s");
                const w = this.addWidget("text", "Formato", curVal, value => {
                    const cleanVal = String(value || "").replace(/[\r\n]+/g, " ");

                    }
                    if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                    if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                });
                w.property = "Formato";
                w.y = 28;
                w.last_y = 28;
                setupSingleLineTextWidget(this, w, "Formato", "Formato");

                if (this.computeSize) {
                    this.size = this.computeSize();
                }
            };

            node.onMouseDown = function(e, local_pos, canvas) {
                if (local_pos) {
                    if (local_pos[1] >= 4 && local_pos[1] <= 26) {
                        const plusBtnX = 22;
                        const plusBtnW = 26;
                        const minusBtnX = 54;
                        const minusBtnW = 26;

                        if (local_pos[0] >= plusBtnX - 2 && local_pos[0] <= plusBtnX + plusBtnW + 2) {
                            const curCount = this.inputs ? this.inputs.length : 1;
                            this.updateFormatDinamicoInputs(curCount + 1);
                            if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                            const activeCanvas = LGraphCanvas.active_canvas || canvas;
                            if (activeCanvas) activeCanvas.setDirty(true, true);
                            if (window.PyxisUndoManager) window.PyxisUndoManager.recordState("add-input-format");
                            if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                            return true;
                        }

                        if (local_pos[0] >= minusBtnX - 2 && local_pos[0] <= minusBtnX + minusBtnW + 2) {
                            const curCount = this.inputs ? this.inputs.length : 1;
                            if (curCount > 1) {
                                this.updateFormatDinamicoInputs(curCount - 1);
                                if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                                const activeCanvas = LGraphCanvas.active_canvas || canvas;

            node.onDrawForeground = function(ctx) {

                ctx.save();

                const headerY = 6;
                const btnH = 18;
                const plusBtnX = 22;
                const plusBtnW = 26;
                const minusBtnX = 54;
                const minusBtnW = 26;

                // Botón [+]
                ctx.fillStyle = "rgba(18, 22, 31, 0.85)";
                ctx.strokeStyle = "#10b981";
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(plusBtnX, headerY, plusBtnW, btnH, 5);
                else ctx.rect(plusBtnX, headerY, plusBtnW, btnH);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "#a7f3d0";
                ctx.font = "bold 12px monospace";
                ctx.textAlign = "center";
                ctx.fillText("+", plusBtnX + plusBtnW / 2, headerY + 13);

                // Botón [-]
                const canRemove = this.inputs && (this.inputs.length > 1);
                ctx.fillStyle = "rgba(18, 22, 31, 0.85)";
                ctx.strokeStyle = canRemove ? "#ef4444" : "#4b5563";
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(minusBtnX, headerY, minusBtnW, btnH, 5);
                else ctx.rect(minusBtnX, headerY, minusBtnW, btnH);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = canRemove ? "#fca5a5" : "#64748b";
                ctx.fillText("-", minusBtnX + minusBtnW / 2, headerY + 13);

                // Posición de la salida String en el header
                if (this.outputs && this.outputs[0]) {
                    this.outputs[0].pos = [nodeW - 10, 15];

                // Posición del Widget Formato
                if (this.widgets && this.widgets[0]) {

            const oldConfigure = node.onConfigure;
            node.onConfigure = function(info) {
                if (oldConfigure) oldConfigure.call(this, info);
                if (this.widgets && this.widgets[0] && this.properties && this.properties.Formato !== undefined) {

        // --- EDITOR IN-SITU CON AUTOCOMPLETADO Y CRECIMIENTO DINÁMICO EN CANVAS (DEFINE VARS) ---

            const drawY = (varWidget && varWidget.last_y !== undefined) ? varWidget.last_y : 48;

            const scale = canvas.ds ? canvas.ds.scale : 1.0;
