                const availW = Math.max(150, right_col_start - left_col_end - 24);
                const availH = Math.max(150, nodeH - 65);
                const cardSize = Math.floor(Math.min(availW, availH));
                const cardW = cardSize;
                const cardH = cardSize;

                const cardX = Math.floor(left_col_end + (right_col_start - left_col_end - cardW) / 2);
                const cardY = Math.max(12, Math.floor((nodeH - cardH - 32) / 2));

                // Dibujo del Scrubber de GIF Profesional SOBRE la tarjeta (Frame Scrubber)
                if (this._totalFrames && this._totalFrames > 1) {
                    ctx.save();
                    const topBarY = cardY - 22;
                    const topBarH = 18;
                    const stepBtnW = 18;
                    const trackX = cardX + stepBtnW + 4;
                    const trackW = cardW - 2 * stepBtnW - 8;
                    const curF = this._currentFrame || 1;
                    const totF = this._totalFrames || 1;

                    // 1. Botón Anterior
                    ctx.fillStyle = "#12161f";
                    ctx.strokeStyle = curF > 1 ? "#8b5cf6" : "#334155";
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(cardX, topBarY, stepBtnW, topBarH, 4);
                    else ctx.rect(cardX, topBarY, stepBtnW, topBarH);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = curF > 1 ? "#a7f3d0" : "#475569";
                    const arrowLeftCenterX = cardX + stepBtnW / 2;
                    const arrowLeftCenterY = topBarY + topBarH / 2;
                    ctx.beginPath();
                    ctx.moveTo(arrowLeftCenterX - 3, arrowLeftCenterY);
                    ctx.lineTo(arrowLeftCenterX + 2.5, arrowLeftCenterY - 4);
                    ctx.lineTo(arrowLeftCenterX + 2.5, arrowLeftCenterY + 4);
                    ctx.closePath();
                    ctx.fill();

                    // 2. Botón Siguiente
                    ctx.fillStyle = "#12161f";
                    ctx.strokeStyle = curF < totF ? "#8b5cf6" : "#334155";
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(cardX + cardW - stepBtnW, topBarY, stepBtnW, topBarH, 4);
                    else ctx.rect(cardX + cardW - stepBtnW, topBarY, stepBtnW, topBarH);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = curF < totF ? "#a7f3d0" : "#475569";
                    const arrowRightCenterX = cardX + cardW - stepBtnW / 2;
                    const arrowRightCenterY = topBarY + topBarH / 2;
                    ctx.beginPath();
                    ctx.moveTo(arrowRightCenterX + 3, arrowRightCenterY);
                    ctx.lineTo(arrowRightCenterX - 2.5, arrowRightCenterY - 4);
                    ctx.lineTo(arrowRightCenterX - 2.5, arrowRightCenterY + 4);
                    ctx.closePath();
                    ctx.fill();

                    // 3. Track Central con Barra de Progreso y Thumb
                    ctx.fillStyle = "#12161f";
                    ctx.strokeStyle = "#8b5cf6";
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(trackX, topBarY, trackW, topBarH, 5);
                    else ctx.rect(trackX, topBarY, trackW, topBarH);
                    ctx.fill();
                    ctx.stroke();

                    const fillRatio = (curF - 1) / Math.max(1, totF - 1);
                    const fillW = Math.max(6, fillRatio * (trackW - 4));
                    ctx.fillStyle = "rgba(139, 92, 246, 0.35)";
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(trackX + 2, topBarY + 2, fillW, topBarH - 4, 3);
                    else ctx.rect(trackX + 2, topBarY + 2, fillW, topBarH - 4);
                    ctx.fill();

                    const knobX = trackX + 2 + fillRatio * Math.max(0, trackW - 10);
                    ctx.fillStyle = "#34d399";
                    ctx.beginPath();
                    ctx.arc(knobX + 3, topBarY + 9, 4, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#e0e7ff";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("Frame " + curF + " / " + totF, trackX + trackW / 2, topBarY + 9);
                    ctx.restore();
                }

                // Dibujo de Botones (Vista y Refresh) DEBAJO de la tarjeta
                const barY = cardY + cardH + 8;
                const barH = 18;
                const btnH = 18;
                const barTotalW = 150;
                const barStartX = Math.floor(cardX + (cardW - barTotalW) / 2);

                const btnW = 118;
                const btnX = barStartX;
                const refreshW = 28;
                const refreshX = barStartX + 122;

                // 1. Botón Cíclico de Vista
                ctx.save();
                ctx.font = "bold 10px monospace";
                ctx.fillStyle = "#12161f";
                ctx.strokeStyle = "#8b5cf6";
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(btnX, barY, btnW, btnH, 5);
                else ctx.rect(btnX, barY, btnW, btnH);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "#a7f3d0";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("Vista: " + viewMode, btnX + btnW / 2, barY + btnH / 2 + 1);

                // 2. Botón de Recarga (Refresh) con Icono Vectorial ↻
                const isTracing = Boolean(this._isTracing);
                ctx.fillStyle = isTracing ? "#2d1f3d" : "#12161f";
                ctx.strokeStyle = isTracing ? "#fbbf24" : "#8b5cf6";
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(refreshX, barY, refreshW, btnH, 5);
                else ctx.rect(refreshX, barY, refreshW, btnH);
                ctx.fill();
                ctx.stroke();

                const iconCenterX = refreshX + refreshW / 2;
                const iconCenterY = barY + btnH / 2;
                ctx.strokeStyle = isTracing ? "#fbbf24" : "#a7f3d0";
                ctx.fillStyle = isTracing ? "#fbbf24" : "#a7f3d0";
                ctx.lineWidth = 1.5;

                const endAngle = 1.65 * Math.PI;
                ctx.beginPath();
                ctx.arc(iconCenterX, iconCenterY, 4.0, 0.25 * Math.PI, endAngle, false);
                ctx.stroke();

                const endX = iconCenterX + 4.0 * Math.cos(endAngle);
                const endY = iconCenterY + 4.0 * Math.sin(endAngle);

                ctx.beginPath();
                ctx.moveTo(endX + 3.0, endY - 2.5);
                ctx.lineTo(endX - 1.5, endY - 3.5);
                ctx.lineTo(endX - 0.5, endY + 1.0);
                ctx.closePath();
                ctx.fill();

                ctx.restore();

                // Dibujo de la Tarjeta Central
                ctx.save();
                ctx.fillStyle = "rgba(18, 22, 31, 0.95)";
                ctx.strokeStyle = "rgba(139, 92, 246, 0.7)";
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(cardX, cardY, cardW, cardH, 10);
                else ctx.rect(cardX, cardY, cardW, cardH);
                ctx.fill();
                ctx.stroke();

                // Carga de la imagen raster
                const imagePath = String(this.properties ? (this.properties.image_path || "") : "").trim();
                if (imagePath && (this._imgPathKey !== imagePath || (!this._imgObj && !this._imgLoadedPath))) {
                    this._imgPathKey = imagePath;
                    this._imgLoadedPath = null;
                    const img = new Image();
                    img.onload = () => {
                        if (!this._imgLoadedPath) {
                            this._imgObj = img;
                            if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                        }
                    };
                    if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.get_image_file_data_url === 'function') {
                        window.pywebview.api.get_image_file_data_url(imagePath).then(uri => {
                            if (uri && !this._imgLoadedPath) img.src = uri;
                        }).catch(() => {});
                    } else {
                        if (!this._imgLoadedPath) {
                            img.src = imagePath.startsWith("http") ? imagePath : ("file:///" + imagePath.replace(/\\/g, "/"));
                        }
                    }
                } else if (!imagePath) {
                    this._imgObj = null;
                    this._imgLoadedPath = null;
                }

                // Renderizado de Imagen según modo de vista (Superposición o Imagen)
                if (this._imgObj && (viewMode === "Superposición" || viewMode === "Imagen")) {
                    ctx.save();
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(cardX + 2, cardY + 2, cardW - 4, cardH - 4, 8);
                    else ctx.rect(cardX + 2, cardY + 2, cardW - 4, cardH - 4);
                    ctx.clip();

                    const iw = this._imgObj.naturalWidth || this._imgObj.width || 1;
                    const ih = this._imgObj.naturalHeight || this._imgObj.height || 1;
                    const fitScale = Math.min((cardW - 8) / iw, (cardH - 8) / ih);
                    const drawW = iw * fitScale;
                    const drawH = ih * fitScale;
                    const drawX = cardX + (cardW - drawW) / 2;
                    const drawY = cardY + (cardH - drawH) / 2;

                    ctx.drawImage(this._imgObj, drawX, drawY, drawW, drawH);
                    ctx.restore();
                }

                let lastShape = this._lastTracedShape || (this.output_values ? this.output_values[0] : null);
                const cardCenterX = cardX + cardW / 2;
                const cardCenterY = cardY + cardH / 2;

                // Renderizado de Vector según modo de vista (Superposición o Vector)
                if ((viewMode === "Superposición" || viewMode === "Vector") && lastShape && typeof lastShape === 'string' && lastShape.trim().length > 0) {
                    if (!this._cachedShapePath || this._cachedShapeKey !== lastShape) {
                        const svgD = assPathToSvg(lastShape);
                        this._cachedShapePath = new Path2D(svgD);
                        this._cachedShapeKey = lastShape;
                    }

                    if (this._imgObj) {
                        const iw = this._imgObj.naturalWidth || this._imgObj.width || 1;
                        const ih = this._imgObj.naturalHeight || this._imgObj.height || 1;
                        const fitScale = Math.min((cardW - 8) / iw, (cardH - 8) / ih);

                        ctx.save();
                        ctx.translate(cardCenterX, cardCenterY);
                        ctx.scale(fitScale, fitScale);

                        ctx.fillStyle = "rgba(139, 92, 246, 0.35)";
                        ctx.strokeStyle = "#a7f3d0";
                        ctx.lineWidth = 1.5 / Math.max(0.1, fitScale);
                        ctx.lineJoin = "round";
                        ctx.lineCap = "round";
                        ctx.fill(this._cachedShapePath);
                        ctx.stroke(this._cachedShapePath);
                        ctx.restore();
                    } else {
                        const bbox = getAssPathBBox(lastShape);
                        if (bbox && bbox.w > 0 && bbox.h > 0) {
                            const availW = cardW - 24;
                            const availH = cardH - 24;
                            const scale = Math.min(availW / bbox.w, availH / bbox.h);

                            ctx.save();
                            ctx.translate(cardCenterX, cardCenterY);
                            ctx.scale(scale, scale);
                            ctx.translate(-bbox.cx, -bbox.cy);

                            ctx.fillStyle = "rgba(139, 92, 246, 0.35)";
                            ctx.strokeStyle = "#a7f3d0";
                            ctx.lineWidth = 1.5 / Math.max(0.1, scale);
                            ctx.lineJoin = "round";
                            ctx.lineCap = "round";
                            ctx.fill(this._cachedShapePath);
                            ctx.stroke(this._cachedShapePath);
                            ctx.restore();
                        }
                    }
                } else if (isTracing) {
                    ctx.save();
                    ctx.fillStyle = "#fbbf24";
                    ctx.font = "bold 11px monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("Trazando Vector...", cardCenterX, cardCenterY);
                    ctx.restore();
                } else if (!this._imgObj && viewMode !== "Vector") {
                    ctx.save();
                    ctx.fillStyle = "rgba(167, 243, 208, 0.6)";
                    ctx.font = "bold 11px monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("IMG -> SHAPE", cardCenterX, cardCenterY - 8);
                    ctx.fillStyle = "rgba(100, 116, 139, 0.75)";
                    ctx.font = "10px sans-serif";
                    ctx.fillText("Trazado Vectorial", cardCenterX, cardCenterY + 12);
                    ctx.restore();
                }
                ctx.restore();

                if (this.outputs && this.outputs.length > 0) {
                    const stepY = nodeH / (this.outputs.length + 1);
                    this.outputs.forEach((out, idx) => {
                        out.pos = [nodeW - 10, Math.floor(stepY * (idx + 1))];
                    });
                }
            };

            const initSz = node.computeSize();
            if (!node.size || node.size[0] <= 0 || node.size[1] <= 0) {
                node.size = [initSz[0], initSz[1]];
            } else {
                node.size[0] = Math.max(node.size[0], initSz[0]);
                node.size[1] = Math.max(node.size[1], initSz[1]);
            }
        }

        function setupImgToPixelsNode(node) {
            if (!node.properties) node.properties = {};
            if (node.properties.image_path === undefined) node.properties.image_path = "";
            if (!node.properties.particle_shape) node.properties.particle_shape = "";
            if (!node.properties.frame) node.properties.frame = "1";
            if (!node.properties.step) node.properties.step = "2";
            if (!node.properties.alpha_threshold) node.properties.alpha_threshold = "128";
            if (!node.properties.scale) node.properties.scale = "1.0";
            if (!node.properties.anchor) node.properties.anchor = "Center";
            if (!node.properties.order) node.properties.order = "79";
            if (!node.properties.view_mode) node.properties.view_mode = "Superposición";

            if (node.widgets) {
                node.widgets.forEach(w => {
                    if (w.property && node.properties[w.property] !== undefined) {
                        w.value = node.properties[w.property];
                    }
                });
            }

            node.widgets_up = true;
            setupDynamicInlineNode(node);

            const scheduleSampling = (nObj, targetFrame) => {
                if (!window.pywebview || !window.pywebview.api || typeof window.pywebview.api.sample_pixels_api !== 'function') return;
                
                const curF = targetFrame !== undefined ? targetFrame : (nObj._pendingFrame !== undefined ? nObj._pendingFrame : (nObj._currentFrame || 1));
                nObj._currentFrame = curF;
                if (nObj.setDirtyCanvas) nObj.setDirtyCanvas(true, true);

                if (nObj._isTracing) {
                    nObj._pendingFrame = curF;
                    return;
                }

                nObj._isTracing = true;
                nObj._pendingFrame = null;
                const propsCopy = Object.assign({}, nObj.properties, { preview_frame: curF });

                window.pywebview.api.sample_pixels_api(propsCopy).then(res => {
                    nObj._isTracing = false;
                    nObj._lastSampledFrame = curF;
                    if (res) {
                        if (res.pixels_points) nObj._lastSampledPoints = res.pixels_points;
                        if (res.total_pixels !== undefined) nObj._totalPixels = res.total_pixels;
                        if (res.img_width) nObj._imgWidth = res.img_width;
                        if (res.img_height) nObj._imgHeight = res.img_height;
                        if (res.preview_step) nObj._previewStep = res.preview_step;
                        if (res.total_frames) {
                            nObj._totalFrames = res.total_frames;
                        }
                        if (res.frame_index) nObj._currentFrame = res.frame_index;
                    }
                    if (res && res.preview_image_path) {
                        loadPreviewImage(nObj, res.preview_image_path);
                    } else if (nObj.setDirtyCanvas) {
                        nObj.setDirtyCanvas(true, true);
                    }

                    if (nObj._pendingFrame !== null && nObj._pendingFrame !== nObj._currentFrame) {
                        const nextF = nObj._pendingFrame;
                        nObj._pendingFrame = null;
                        scheduleSampling(nObj, nextF);
                    }
                }).catch(() => {
                    nObj._isTracing = false;
                    if (nObj.setDirtyCanvas) nObj.setDirtyCanvas(true, true);
                    if (nObj._pendingFrame !== null && nObj._pendingFrame !== nObj._currentFrame) {
                        const nextF = nObj._pendingFrame;
                        nObj._pendingFrame = null;
                        scheduleSampling(nObj, nextF);
                    }
                });
            };

            scheduleSampling(node);

            const oldPropertyChanged = node.onPropertyChanged;
            node.onPropertyChanged = function(property, value, prev_value) {
                if (oldPropertyChanged) oldPropertyChanged.call(this, property, value, prev_value);
                this._pendingFrame = undefined;
                scheduleSampling(this);
            };

            const oldMouseDown = node.onMouseDown;
            node.onMouseDown = function(e, local_pos, canvas) {
                if (local_pos) {
                    const nodeW = this.size ? this.size[0] : 380;
                    const nodeH = this.size ? this.size[1] : 230;

                    let max_in_text_w = 0;
                    if (this.properties) {
                        for (const k in this.properties) {
                            if (k === "anchor" || k === "order" || k === "view_mode") continue;
                            let val = String(this.properties[k] || "");
                            if (k === "image_path") val = "...image.png";
                            if (val.length > 0) {
                                const tw = Math.min(85, getExactTextWidth(val, "bold 11px monospace"));
                                if (tw > max_in_text_w) max_in_text_w = tw;
                            }
                        }
                    }

                    let max_out_w = 0;
                    (this.outputs || []).forEach(out => {
                        if (out.name) {
                            const ow = getExactTextWidth(out.name, "10px sans-serif");
                            if (ow > max_out_w) max_out_w = ow;
                        }
                    });

                    const left_box_w = Math.max(70, max_in_text_w + 16);
                    const left_col_end = 22 + left_box_w;
                    const right_col_w = max_out_w > 0 ? (max_out_w + 38) : 20;
                    const right_col_start = nodeW - right_col_w;

                    const availW = Math.max(150, right_col_start - left_col_end - 24);
                    const availH = Math.max(150, nodeH - 65);
                    const cardSize = Math.floor(Math.min(availW, availH));
                    const cardW = cardSize;
                    const cardH = cardSize;

                    const cardX = Math.floor(left_col_end + (right_col_start - left_col_end - cardW) / 2);
                    const cardY = Math.max(12, Math.floor((nodeH - cardH - 32) / 2));

                    // Clic / Arrastre en el Scrubber de GIF Profesional (Ubicado SOBRE la tarjeta)
                    if (this._totalFrames && this._totalFrames > 1) {
                        const topBarY = cardY - 22;
                        const topBarH = 18;
                        const stepBtnW = 18;
                        const trackX = cardX + stepBtnW + 4;
                        const trackW = cardW - 2 * stepBtnW - 8;
                        const pad = 4;

                        if (local_pos[1] >= topBarY - pad && local_pos[1] <= topBarY + topBarH + pad) {
                            const selfNode = this;
                            const curF = selfNode._currentFrame || 1;
                            const totF = selfNode._totalFrames || 1;

                            // 1. Botón Anterior
                            if (local_pos[0] >= cardX - pad && local_pos[0] <= cardX + stepBtnW + 2) {
                                const newFrame = Math.max(1, curF - 1);
                                if (newFrame !== curF) {
                                    scheduleSampling(selfNode, newFrame);
                                }
                                return true;
                            }

                            // 2. Botón Siguiente
                            if (local_pos[0] >= cardX + cardW - stepBtnW - 2 && local_pos[0] <= cardX + cardW + pad) {
                                const newFrame = Math.min(totF, curF + 1);
                                if (newFrame !== curF) {
                                    scheduleSampling(selfNode, newFrame);
                                }
                                return true;
                            }

                            // 3. Track Central (Click o Arrastre fluido)
                            if (local_pos[0] >= trackX - 2 && local_pos[0] <= trackX + trackW + 2) {
                                const updateFrameFromEvent = (eMove) => {
                                    const canvasObj = canvas || window.canvas || window.graphcanvas;
                                    if (!canvasObj || !canvasObj.canvas) return;
                                    const rect = canvasObj.canvas.getBoundingClientRect();
                                    const scale = (canvasObj.ds && canvasObj.ds.scale) ? canvasObj.ds.scale : 1.0;
                                    const tx = (canvasObj.ds && canvasObj.ds.offset) ? canvasObj.ds.offset[0] : 0;
                                    const graphX = (eMove.clientX - rect.left) / scale - tx;
                                    const nodeLocalX = graphX - selfNode.pos[0];

                                    const ratio = Math.max(0, Math.min(1, (nodeLocalX - trackX) / Math.max(1, trackW)));
                                    const newFrame = Math.round(1 + ratio * (selfNode._totalFrames - 1));
                                    if (newFrame !== selfNode._currentFrame) {
                                        scheduleSampling(selfNode, newFrame);
                                    }
                                };

                                updateFrameFromEvent(e);

                                const onWindowMove = (eMove) => { updateFrameFromEvent(eMove); };
                                const onWindowUp = (eUp) => {
                                    window.removeEventListener("pointermove", onWindowMove);
                                    window.removeEventListener("pointerup", onWindowUp);
                                    window.removeEventListener("mousemove", onWindowMove);
                                    window.removeEventListener("mouseup", onWindowUp);
                                };

                                window.addEventListener("pointermove", onWindowMove);
                                window.addEventListener("pointerup", onWindowUp);
                                window.addEventListener("mousemove", onWindowMove);
                                window.addEventListener("mouseup", onWindowUp);

                                return true;
                            }
                        }
                    }

                    const barY = cardY + cardH + 8;
                    const barH = 18;
                    const btnH = 18;
                    const barTotalW = 150;
                    const barStartX = Math.floor(cardX + (cardW - barTotalW) / 2);

                    const btnW = 118;
                    const btnX = barStartX;
                    const refreshW = 28;
                    const refreshX = barStartX + 122;
                    const pad = 4;

                    if (local_pos[1] >= barY - pad && local_pos[1] <= barY + barH + pad) {
                        if (local_pos[0] >= btnX - pad && local_pos[0] <= btnX + btnW + 2) {
                            const VIEW_MODES = ["Superposición", "Imagen", "Particles"];
                            const curV = (this.properties && this.properties.view_mode) ? this.properties.view_mode : "Superposición";
                            let curIdx = VIEW_MODES.indexOf(curV);
                            if (curIdx < 0) curIdx = 0;
                            const nextIdx = (curIdx + 1) % VIEW_MODES.length;
                            this.properties.view_mode = VIEW_MODES[nextIdx];
                            if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                            if (window.PyxisUndoManager) window.PyxisUndoManager.recordState("view_mode-cycle-pixels");
                            return true;
                        }
                        else if (local_pos[0] >= refreshX - 2 && local_pos[0] <= refreshX + refreshW + pad) {
                            if (this._isTracing) return true;
                            this._pendingFrame = undefined;
                            scheduleSampling(this);
                            return true;
                        }
                    }
                }
                if (oldMouseDown) return oldMouseDown.call(this, e, local_pos, canvas);
            };

            const oldConfigure = node.onConfigure;
            node.onConfigure = function(info) {
                if (oldConfigure) oldConfigure.call(this, info);
                if (info && info.size && Array.isArray(info.size)) {
                    this._customSize = [info.size[0], info.size[1]];
                    this.size = [info.size[0], info.size[1]];
                } else {
                    const sz = this.computeSize();
                    this.size[0] = Math.max(this.size[0] || 0, sz[0]);
                    this.size[1] = Math.max(this.size[1] || 0, sz[1]);
                }
            };

            const oldResize = node.onResize;
            node.onResize = function(size) {
                if (oldResize) oldResize.call(this, size);
                if (size && size[0] > 0 && size[1] > 0) {
                    this._customSize = [size[0], size[1]];
                }
            };

            node.onDblClick = function(e, local_pos, canvas) {
                if (!local_pos) return false;
                let lx = local_pos[0];
                let ly = local_pos[1];
                if (this.pos && (lx > this.pos[0] + this.size[0] || ly > this.pos[1] + this.size[1])) {
                    lx = lx - this.pos[0];
                    ly = ly - this.pos[1];
                }

                const nodeW = this.size ? this.size[0] : 380;
                const nodeH = this.size ? this.size[1] : 230;

                let max_in_text_w = 0;
                if (this.properties) {
                    for (const k in this.properties) {
                        if (k === "anchor" || k === "order" || k === "view_mode") continue;
                        let val = String(this.properties[k] || "");
                        if (k === "image_path") val = "...image.png";
                        if (val.length > 0) {
                            const tw = Math.min(85, getExactTextWidth(val, "bold 11px monospace"));
                            if (tw > max_in_text_w) max_in_text_w = tw;
                        }
                    }
                }

                let max_out_w = 0;
                (this.outputs || []).forEach(out => {
                    if (out.name) {
                        const ow = getExactTextWidth(out.name, "10px sans-serif");
                        if (ow > max_out_w) max_out_w = ow;
                    }
                });

                const left_box_w = Math.max(70, max_in_text_w + 16);
                const left_col_end = 22 + left_box_w;
                const right_col_w = max_out_w > 0 ? (max_out_w + 38) : 20;
                const right_col_start = nodeW - right_col_w;

                const availW = Math.max(150, right_col_start - left_col_end - 24);
                const availH = Math.max(150, nodeH - 65);
                const cardSize = Math.floor(Math.min(availW, availH));
                const cardW = cardSize;
                const cardH = cardSize;

                const cardX = Math.floor(left_col_end + (right_col_start - left_col_end - cardW) / 2);
                const cardY = Math.max(12, Math.floor((nodeH - cardH - 32) / 2));

                if (lx >= cardX && lx <= cardX + cardW && ly >= cardY && ly <= cardY + cardH) {
                    const updateImagePath = (filePath) => {
                        if (!filePath) return;
                        const prev = this.properties["image_path"];
                        this.properties["image_path"] = filePath;
                        if (this.widgets) {
                            this.widgets.forEach(w => {
                                if (w.property === "image_path" || (w.name && (w.name.includes("Shape") || w.name.includes("Ruta") || w.name.includes("image_path")))) {
                                    w.value = filePath;
                                }
                            });
                        }
                        if (typeof this.onPropertyChanged === "function") {
                            this.onPropertyChanged("image_path", filePath, prev);
                        }
                        if (this.computeSize) this.size = this.computeSize();
                        if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                        if (window.__pyxis_schedule_save) window.__pyxis_schedule_save(50);
                    };

                    if (window.pywebview && window.pywebview.api && window.pywebview.api.select_image_dialog) {
                        window.pywebview.api.select_image_dialog().then(filePath => {
                            updateImagePath(filePath);
                        });
                        return true;
                    }
                    let fileInput = document.createElement("input");
                    fileInput.type = "file";
                    fileInput.accept = "image/png, image/jpeg, image/webp, image/gif, image/*";
                    fileInput.onchange = (evt) => {
                        if (evt.target.files && evt.target.files[0]) {
                            const fileObj = evt.target.files[0];
                            const filePath = fileObj.path || fileObj.name;
                            updateImagePath(filePath);
                        }
                    };
                    fileInput.click();
                    return true;
                }
                return false;
            };

            node.computeSize = function() {
                let max_in_text_w = 0;
                if (this.properties) {
                    for (const k in this.properties) {
                        if (k === "anchor" || k === "order" || k === "view_mode") continue;
                        let val = String(this.properties[k] || "");
                        if (k === "image_path") val = "...image.png";
                        if (val.length > 0) {
                            const tw = Math.min(85, getExactTextWidth(val, "bold 11px monospace"));
                            if (tw > max_in_text_w) max_in_text_w = tw;
                        }
                    }
                }

                let max_out_w = 0;
                (this.outputs || []).forEach(out => {
                    if (out.name) {
                        const ow = getExactTextWidth(out.name, "10px sans-serif");
                        if (ow > max_out_w) max_out_w = ow;
                    }
                });

                const num_in = this.inputs ? this.inputs.length : 8;
                const left_box_w = Math.max(70, max_in_text_w + 16);
                const left_col_end = 22 + left_box_w;
                const card_w = 150;
                const right_col_w = max_out_w > 0 ? (max_out_w + 38) : 20;
                const side_margin = 20;

                const titleW = getExactTextWidth(String(this.title || "IMG to pixels"), "bold 12px sans-serif");
                const req_w = Math.max(380, left_col_end + side_margin + card_w + side_margin + right_col_w, 25 + titleW + 40);
                const req_h = Math.max(280, 11 + num_in * 23 + 24);

                return [req_w, req_h];
            };

            const oldDraw = node.onDrawForeground;
            node.onDrawForeground = function(ctx) {
                if (oldDraw) oldDraw.call(this, ctx);
                if (this.flags && this.flags.collapsed) return;

                const isTracing = Boolean(this._isTracing);
                if (isTracing) {
                    if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                }

                const nodeW = this.size ? this.size[0] : 380;
                const nodeH = this.size ? this.size[1] : 230;
                const viewMode = (this.properties && this.properties.view_mode) ? this.properties.view_mode : "Superposición";

                let max_in_text_w = 0;
                if (this.properties) {
                    for (const k in this.properties) {
                        if (k === "anchor" || k === "order" || k === "view_mode") continue;
                        let val = String(this.properties[k] || "");
                        if (k === "image_path") val = "...image.png";
                        if (val.length > 0) {
                            const tw = Math.min(85, getExactTextWidth(val, "bold 11px monospace"));
                            if (tw > max_in_text_w) max_in_text_w = tw;
                        }
                    }
                }

                let max_out_w = 0;
                (this.outputs || []).forEach(out => {
                    if (out.name) {
                        const ow = getExactTextWidth(out.name, "10px sans-serif");
                        if (ow > max_out_w) max_out_w = ow;
                    }
                });

                const left_box_w = Math.max(70, max_in_text_w + 16);
                const left_col_end = 22 + left_box_w;
                const right_col_w = max_out_w > 0 ? (max_out_w + 38) : 20;
                const right_col_start = nodeW - right_col_w;

                const availW = Math.max(150, right_col_start - left_col_end - 24);
                const availH = Math.max(150, nodeH - 65);
                const cardSize = Math.floor(Math.min(availW, availH));
                const cardW = cardSize;
                const cardH = cardSize;

                const cardX = Math.floor(left_col_end + (right_col_start - left_col_end - cardW) / 2);
                const cardY = Math.max(12, Math.floor((nodeH - cardH - 32) / 2));

                // Dibujo del Scrubber de GIF Profesional SOBRE la tarjeta (Frame Scrubber)
                if (this._totalFrames && this._totalFrames > 1) {
                    ctx.save();
                    const topBarY = cardY - 22;
                    const topBarH = 18;
                    const stepBtnW = 18;
                    const trackX = cardX + stepBtnW + 4;
                    const trackW = cardW - 2 * stepBtnW - 8;
                    const curF = this._currentFrame || 1;
                    const totF = this._totalFrames || 1;

                    // 1. Botón Anterior
                    ctx.fillStyle = "#12161f";
                    ctx.strokeStyle = curF > 1 ? "#8b5cf6" : "#334155";
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(cardX, topBarY, stepBtnW, topBarH, 4);
                    else ctx.rect(cardX, topBarY, stepBtnW, topBarH);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = curF > 1 ? "#a7f3d0" : "#475569";
                    const arrowLeftCenterX = cardX + stepBtnW / 2;
                    const arrowLeftCenterY = topBarY + topBarH / 2;
                    ctx.beginPath();
                    ctx.moveTo(arrowLeftCenterX - 3, arrowLeftCenterY);
                    ctx.lineTo(arrowLeftCenterX + 2.5, arrowLeftCenterY - 4);
                    ctx.lineTo(arrowLeftCenterX + 2.5, arrowLeftCenterY + 4);
                    ctx.closePath();
                    ctx.fill();

                    // 2. Botón Siguiente
                    ctx.fillStyle = "#12161f";
                    ctx.strokeStyle = curF < totF ? "#8b5cf6" : "#334155";
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(cardX + cardW - stepBtnW, topBarY, stepBtnW, topBarH, 4);
                    else ctx.rect(cardX + cardW - stepBtnW, topBarY, stepBtnW, topBarH);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = curF < totF ? "#a7f3d0" : "#475569";
                    const arrowRightCenterX = cardX + cardW - stepBtnW / 2;
                    const arrowRightCenterY = topBarY + topBarH / 2;
                    ctx.beginPath();
                    ctx.moveTo(arrowRightCenterX + 3, arrowRightCenterY);
                    ctx.lineTo(arrowRightCenterX - 2.5, arrowRightCenterY - 4);
                    ctx.lineTo(arrowRightCenterX - 2.5, arrowRightCenterY + 4);
                    ctx.closePath();
                    ctx.fill();

                    // 3. Track Central con Barra de Progreso y Thumb
                    ctx.fillStyle = "#12161f";
                    ctx.strokeStyle = "#8b5cf6";
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(trackX, topBarY, trackW, topBarH, 5);
                    else ctx.rect(trackX, topBarY, trackW, topBarH);
                    ctx.fill();
                    ctx.stroke();

                    const fillRatio = (curF - 1) / Math.max(1, totF - 1);
                    const fillW = Math.max(6, fillRatio * (trackW - 4));
                    ctx.fillStyle = "rgba(139, 92, 246, 0.35)";
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(trackX + 2, topBarY + 2, fillW, topBarH - 4, 3);
                    else ctx.rect(trackX + 2, topBarY + 2, fillW, topBarH - 4);
                    ctx.fill();

                    const knobX = trackX + 2 + fillRatio * Math.max(0, trackW - 10);
                    ctx.fillStyle = "#34d399";
                    ctx.beginPath();
                    ctx.arc(knobX + 3, topBarY + 9, 4, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#e0e7ff";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("Frame " + curF + " / " + totF, trackX + trackW / 2, topBarY + 9);
                    ctx.restore();
                }

                const barY = cardY + cardH + 8;
                const barH = 18;
                const btnH = 18;
                const barTotalW = 150;
                const barStartX = Math.floor(cardX + (cardW - barTotalW) / 2);

                const btnW = 118;
                const btnX = barStartX;
                const refreshW = 28;
                const refreshX = barStartX + 122;

                ctx.save();
                ctx.font = "bold 10px monospace";
                ctx.fillStyle = "#12161f";
                ctx.strokeStyle = "#8b5cf6";
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(btnX, barY, btnW, btnH, 5);
                else ctx.rect(btnX, barY, btnW, btnH);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "#a7f3d0";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("Vista: " + viewMode, btnX + btnW / 2, barY + btnH / 2 + 1);

                ctx.fillStyle = isTracing ? "#2d1f3d" : "#12161f";
                ctx.strokeStyle = isTracing ? "#fbbf24" : "#8b5cf6";
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(refreshX, barY, refreshW, btnH, 5);
                else ctx.rect(refreshX, barY, refreshW, btnH);
                ctx.fill();
                ctx.stroke();

                const iconCenterX = refreshX + refreshW / 2;
                const iconCenterY = barY + btnH / 2;
                ctx.save();
                ctx.translate(iconCenterX, iconCenterY);

                if (isTracing) {
                    const spinAngle = (Date.now() / 150) % (Math.PI * 2);
                    ctx.rotate(spinAngle);
                }

                ctx.strokeStyle = isTracing ? "#fbbf24" : "#a7f3d0";
                ctx.fillStyle = isTracing ? "#fbbf24" : "#a7f3d0";
                ctx.lineWidth = 1.5;

                const endAngle = 1.65 * Math.PI;
                ctx.beginPath();
                ctx.arc(0, 0, 4.0, 0.25 * Math.PI, endAngle, false);
                ctx.stroke();

                const endX = 4.0 * Math.cos(endAngle);
                const endY = 4.0 * Math.sin(endAngle);

                ctx.beginPath();
                ctx.moveTo(endX + 3.0, endY - 2.5);
                ctx.lineTo(endX - 1.5, endY - 3.5);
                ctx.lineTo(endX - 0.5, endY + 1.0);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
                ctx.restore();

                ctx.save();
                ctx.fillStyle = "rgba(18, 22, 31, 0.95)";
                ctx.strokeStyle = isTracing ? "rgba(251, 191, 36, 0.9)" : "rgba(139, 92, 246, 0.7)";
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(cardX, cardY, cardW, cardH, 10);
                else ctx.rect(cardX, cardY, cardW, cardH);
                ctx.fill();
                ctx.stroke();

                const imagePath = String(this.properties ? (this.properties.image_path || "") : "").trim();
                if (imagePath && (this._imgPathKey !== imagePath || (!this._imgObj && !this._imgLoadedPath))) {
                    this._imgPathKey = imagePath;
                    this._imgLoadedPath = null;
                    const img = new Image();
                    img.onload = () => {
                        if (!this._imgLoadedPath) {
                            this._imgObj = img;
                            if (this.setDirtyCanvas) this.setDirtyCanvas(true, true);
                        }
                    };
                    if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.get_image_file_data_url === 'function') {
                        window.pywebview.api.get_image_file_data_url(imagePath).then(uri => {
                            if (uri && !this._imgLoadedPath) img.src = uri;
                        }).catch(() => {});
                    } else {
                        if (!this._imgLoadedPath) {
                            img.src = imagePath.startsWith("http") ? imagePath : ("file:///" + imagePath.replace(/\\/g, "/"));
                        }
                    }
                } else if (!imagePath) {
                    this._imgObj = null;
                    this._imgLoadedPath = null;
                }

                const cardCenterX = cardX + cardW / 2;
                const cardCenterY = cardY + cardH / 2;

                let iw = 1, ih = 1, fitScale = 1, drawX = cardX, drawY = cardY, drawW = cardW, drawH = cardH;
                if (this._imgObj && (viewMode === "Superposición" || viewMode === "Imagen")) {
                    ctx.save();
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(cardX + 2, cardY + 2, cardW - 4, cardH - 4, 8);
                    else ctx.rect(cardX + 2, cardY + 2, cardW - 4, cardH - 4);
                    ctx.clip();

                    iw = this._imgObj.naturalWidth || this._imgObj.width || 1;
                    ih = this._imgObj.naturalHeight || this._imgObj.height || 1;
                    fitScale = Math.min((cardW - 8) / iw, (cardH - 8) / ih);
                    drawW = iw * fitScale;
                    drawH = ih * fitScale;
                    drawX = cardX + (cardW - drawW) / 2;
                    drawY = cardY + (cardH - drawH) / 2;

                    ctx.drawImage(this._imgObj, drawX, drawY, drawW, drawH);
                    ctx.restore();
                }

                const pts = this._lastSampledPoints || [];
                if ((viewMode === "Superposición" || viewMode === "Particles") && pts.length > 0) {
                    ctx.save();
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(cardX + 2, cardY + 2, cardW - 4, cardH - 4, 8);
                    else ctx.rect(cardX + 2, cardY + 2, cardW - 4, cardH - 4);
                    ctx.clip();

                    if (!this._imgObj) {
                        iw = this._imgWidth || 200;
                        ih = this._imgHeight || 200;
                        fitScale = Math.min((cardW - 8) / iw, (cardH - 8) / ih);
                        drawW = iw * fitScale;
                        drawH = ih * fitScale;
                        drawX = cardX + (cardW - drawW) / 2;
                        drawY = cardY + (cardH - drawH) / 2;
                    }

                    const actualStep = this._previewStep || Number(this.properties ? (this.properties.step || 2) : 2);
                    const pSize = Math.max(1.0, actualStep * fitScale + 0.05);

                    const maxGridX = Math.floor((iw - 1) / actualStep) * actualStep;
                    const maxGridY = Math.floor((ih - 1) / actualStep) * actualStep;
                    const totalGridW = maxGridX + actualStep;
                    const totalGridH = maxGridY + actualStep;
                    const offX = (iw - totalGridW) / 2.0;
                    const offY = (ih - totalGridH) / 2.0;

                    for (let i = 0; i < pts.length; i++) {
                        const pt = pts[i];
                        const px = drawX + (pt[0] + offX) * fitScale;
                        const py = drawY + (pt[1] + offY) * fitScale;
                        const r = pt[2], g = pt[3], b = pt[4], a = (pt[5] !== undefined ? pt[5] / 255.0 : 1.0);
                        ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
                        ctx.fillRect(px, py, pSize, pSize);
                    }
                    ctx.restore();
                }

                if (isTracing) {
                    ctx.save();
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(cardX + 2, cardY + 2, cardW - 4, cardH - 4, 8);
                    else ctx.rect(cardX + 2, cardY + 2, cardW - 4, cardH - 4);
                    ctx.fillStyle = "rgba(18, 22, 31, 0.65)";
                    ctx.fill();

                    const ringAngle = (Date.now() / 120) % (Math.PI * 2);
                    ctx.strokeStyle = "#34d399";
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(cardCenterX, cardCenterY - 6, 16, ringAngle, ringAngle + 1.25 * Math.PI);
                    ctx.stroke();

                    ctx.fillStyle = "#fbbf24";
                    ctx.font = "bold 11px monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    const curF = this._currentFrame || 1;
                    const totF = this._totalFrames || 1;
                    const statusText = totF > 1 ? ("Frame " + curF + "/" + totF + "...") : "Muestreando...";
                    ctx.fillText(statusText, cardCenterX, cardCenterY + 18);
                    ctx.restore();
                } else if (!this._imgObj && viewMode !== "Particles" && pts.length === 0) {
                    ctx.save();
                    ctx.fillStyle = "rgba(167, 243, 208, 0.6)";
                    ctx.font = "bold 11px monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("IMG -> PIXELS", cardCenterX, cardCenterY - 8);
                    ctx.fillStyle = "rgba(100, 116, 139, 0.75)";
                    ctx.font = "10px sans-serif";
                    ctx.fillText("Muestreador Partículas", cardCenterX, cardCenterY + 12);
                    ctx.restore();
                }
                ctx.restore();
            };

            const initSz = node.computeSize();
            if (!node.size || node.size[0] <= 0 || node.size[1] <= 0) {
                node.size = [initSz[0], initSz[1]];
            } else {
                node.size[0] = Math.max(node.size[0], initSz[0]);
                node.size[1] = Math.max(node.size[1], initSz[1]);
            }
        }

        function createNodeConstructor(category, node_name, definition, is_system) {
            const node_kind = definition.node_kind || "data";
            return function() {
                this.title = definition.name || node_name;
                this.type = category ? (category + "/" + (definition.name || node_name)) : (definition.name || node_name);
                addProperties(this, definition);
                this.resizable = true;

                const nodeCat = typeof window.getNodeCategory === "function" ? window.getNodeCategory(this) : category;
                if (window.CATEGORY_COLORS && window.CATEGORY_COLORS[nodeCat]) {
                    this.color = window.CATEGORY_COLORS[nodeCat];
                    this.boxcolor = (window.PYXIS_THEME && window.PYXIS_THEME.textMuted) || "#94a3b8";
                }
                if (window.PYXIS_THEME && window.PYXIS_THEME.nodeBgGradient && window.PYXIS_THEME.nodeBgGradient.start) {
                    this.bgcolor = window.PYXIS_THEME.nodeBgGradient.start;
                }

                this.computeSize = function() {
                    let title_text = this.title || node_name || "";
                    let title_len = title_text.length;
                    
                    let num_in = this.inputs ? this.inputs.length : 0;
                    let num_out = this.outputs ? this.outputs.length : 0;
                    let max_slots = Math.max(num_in, num_out);
                    let num_wid = this.widgets ? this.widgets.length : 0;

                    let max_slot_label_len = 0;
                    let max_in_label_len = 0;
                    if (this.inputs) {
                        for (let i = 0; i < this.inputs.length; i++) {
                            if (this.inputs[i].name) {
                                max_slot_label_len = Math.max(max_slot_label_len, this.inputs[i].name.length);
                                max_in_label_len = Math.max(max_in_label_len, this.inputs[i].name.length);
                            }
                        }
                    }
                    let max_out_label_len = 0;
                    if (this.outputs) {
                        for (let i = 0; i < this.outputs.length; i++) {
                            if (this.outputs[i].name) {
                                max_slot_label_len = Math.max(max_slot_label_len, this.outputs[i].name.length);
                                max_out_label_len = Math.max(max_out_label_len, this.outputs[i].name.length);
                            }
                        }
                    }

                    let combined_slot_w = (max_in_label_len > 0 && max_out_label_len > 0) ? (max_in_label_len * 7 + max_out_label_len * 7 + 45) : (max_slot_label_len * 7 + 34);
                    let req_w = Math.max(105, title_len * 7.5 + 28, combined_slot_w);
                    if (num_wid > 0) {
                        if (node_name === "Concatenate") {
                            req_w = Math.max(145, title_len * 8.5 + 48, max_slot_label_len * 7.5 + 50);
                        } else if (node_name === "Output") {
                            req_w = Math.max(200, title_len * 8.5 + 48, max_slot_label_len * 7.5 + 50);
                        } else if (node_name === "Dynamic Format" || node_name === "Number" || node_name === "Text" || node_name === "Get Var") {
                            req_w = Math.max(130, title_len * 7.5 + 34, max_slot_label_len * 7 + 36);
                        } else if (node_name === "Define Vars") {
                            req_w = Math.max(220, title_len * 7.5 + 34);
                        } else {
                            req_w = Math.max(req_w, 150);
                        }
                    }
                    if (this.title === "Main Loop" || node_name === "Main Loop" || this.title === "Bucle Primario") req_w = 255;
                    if (num_wid === 0 && max_slots <= 1) {
                        req_w = Math.max(105, title_len * 7.2 + 24, max_slot_label_len * 7 + 28);
                    }

                    // Anchos específicos ajustados para nodos compactos sin solapamientos
                    if (node_name === "Lead In" || node_name === "Lead Out" || node_name === "Middle 1" || node_name === "Middle 2" || node_name === "Loop 1" || node_name === "Loop 2") req_w = Math.max(req_w, 140);
                    else if (node_name === "Benchmark Math") req_w = Math.max(req_w, 225);
                    else if (node_name.includes("Shape Slicer") || title_text.includes("Slicer")) req_w = Math.max(req_w, 225);
                    else if (node_name.includes("Bordes") || title_text.includes("Bordes") || node_name.includes("Concentric") || title_text.includes("Concentric")) req_w = Math.max(req_w, 235);
                    else if (node_name.includes("Audio Modulator") || title_text.includes("Audio")) req_w = Math.max(req_w, 225);
                    else if (node_name.includes("MultiRandom") || node_name.includes("MultiTag")) req_w = Math.max(req_w, 210);
                    else if (node_name.includes("module") || title_text.includes("module")) req_w = Math.max(req_w, 145);
                    else if (node_name === "SquareWave" || node_name === "SineWave" || node_name === "SawtoothWave") req_w = Math.max(req_w, 150);
                    else if (node_name.startsWith("Flor Sakura")) req_w = Math.max(req_w, 145);
                    else if (node_name === "Seno" || node_name === "Coseno" || node_name === "Tangente") req_w = Math.max(req_w, 145);
                    else if (node_name === "RadToDeg" || node_name === "DegToRad") req_w = Math.max(req_w, 135);
                    else if (node_name === "EaseIn" || node_name === "EaseOut" || node_name === "EaseInOut") req_w = Math.max(req_w, 155);
                    else if (node_name === "Parse ASS Time") req_w = Math.max(req_w, 205);
                    else if (node_name === "Format ASS Time") req_w = Math.max(req_w, 200);
                    else if (node_name === "Offset") req_w = Math.max(req_w, 200);
                    else if (node_name === "Duración") req_w = Math.max(req_w, 235);
                    else if (node_name === "Esquinas Redondeadas") req_w = Math.max(req_w, 185);
                    else if (node_name === "Corazón Borde") req_w = Math.max(req_w, 135);

        function registerDataNodes(data_nodes, overwrite = false) {
            if (!data_nodes) return;
            for (const category in data_nodes) {
                for (const node_name in data_nodes[category]) {
                    const definition = { inputs: data_nodes[category][node_name], outputs: [], properties: {}, widgets: [] };
                    const full_name = (category && category !== "Root" && category !== "Raíz") ? (category + "/" + node_name) : node_name;
                    if (!overwrite && LiteGraph.registered_node_types[full_name]) continue;
                    const DynamicNode = createNodeConstructor(category, node_name, definition, false);
                    DynamicNode.title = node_name;
                    LiteGraph.registerNodeType(full_name, DynamicNode);
                }
            }
        }

        function registerSystemNodes(system_nodes, overwrite = false) {
            if (!system_nodes) return;

            for (const k in LiteGraph.registered_node_types) {
                if (k.startsWith("Shape/Formas/") || k.startsWith("Shape/Estrellas/") ||
                    k.startsWith("Shape/Especiales/") || k.startsWith("Shape/Notas/") ||
                    k.startsWith("Shape/Sakura/") || k.startsWith("Shape/Corte/") ||
                    k.startsWith("Text/Operaciones/") || k.startsWith("Text/Especial/") ||
                    k.startsWith("Partículas/")) {
                    delete LiteGraph.registered_node_types[k];
                }
            }

            for (const category in system_nodes) {
                for (const node_name in system_nodes[category]) {
                    const full_name = (category && category !== "Root" && category !== "Raíz") ? (category + "/" + node_name) : node_name;
                    if (!overwrite && LiteGraph.registered_node_types[full_name]) continue;
                    const definition = system_nodes[category][node_name];
                    const SystemNode = createNodeConstructor(category, node_name, definition, true);
                    SystemNode.title = node_name;
                    LiteGraph.registerNodeType(full_name, SystemNode);
                }
            }
        }

        function loadDefaultGraph() {
            // Asegurar que los nodos esenciales estén registrados en LiteGraph antes de intentar crearlos
            registerSystemNodes(FALLBACK_SYSTEM_NODES, false);

            if (window.PyxisNodePlayerManager && typeof window.PyxisNodePlayerManager.destroyAllPlayers === "function") {
                window.PyxisNodePlayerManager.destroyAllPlayers();
            }

            graph.clear();

            if (canvas && canvas.canvas && typeof canvas.resize === "function") {
                canvas.resize();
            }

            // Calcular el centro exacto de la zona delimitada de LiteGraph (0, 0, canvas.width, canvas.height)
            let cw = 1280;
            let ch = 720;
            if (canvas && canvas.canvas) {
                if (canvas.canvas.width > 0) cw = canvas.canvas.width;
                else if (canvas.canvas.offsetWidth > 0) cw = canvas.canvas.offsetWidth;
                if (canvas.canvas.height > 0) ch = canvas.canvas.height;
                else if (canvas.canvas.offsetHeight > 0) ch = canvas.canvas.offsetHeight;
            } else if (window.innerWidth) {
                cw = window.innerWidth;
                ch = Math.max(400, window.innerHeight - 52);
            }

            const centerX = cw / 2;
            const centerY = ch / 2;
            const totalW = 720;
            const startX = Math.round(centerX - (totalW / 2));
            const startY = Math.round(centerY - 70);

            var node_loop = LiteGraph.createNode("Loops/Main Loop");
            if (node_loop) { node_loop.pos = [startX, startY]; graph.add(node_loop); }

            var node_vars = LiteGraph.createNode("Variables/Define Vars");
            if (node_vars) { node_vars.pos = [startX + 280, startY]; graph.add(node_vars); }

            var node_out = LiteGraph.createNode("System/Output");
            if (node_out) { node_out.pos = [startX + 540, startY]; graph.add(node_out); }

            if (node_loop && node_vars) node_loop.connect(0, node_vars, 0);
            if (node_vars && node_out) node_vars.connect(0, node_out, 0);

            window.__pyxis_active_template_id = null;
            window.__pyxis_active_template_name = null;
            localStorage.removeItem("pyxis_active_template_id");
            localStorage.removeItem("pyxis_active_template_name");
            localStorage.removeItem("pyxis_last_used_template_id");

            if (typeof window.update_template_checkpoint === "function") {
                window.update_template_checkpoint();
            }

            const btnTop = document.getElementById("btn-quick-save-template");
            if (btnTop) btnTop.style.display = "none";

            if (window.PyxisUndoManager) {
                window.PyxisUndoManager.initInitialState();
            }

            if (typeof window.updateTemplateUIState === "function") window.updateTemplateUIState();
            if (typeof window.__pyxis_schedule_save === "function") window.__pyxis_schedule_save(50);

            resetView();
            canvas.draw(true, true);
            canvas.setDirty(true, true);
        }

        async function initDynamicNodes() {

                            manifest = JSON.parse(rawManifest);
                            break;
                        }
                    } catch (e) {
                        console.warn("Pyxis: reintentando lectura de manifest IPC...", attempts);
                    }

                try { sessionData = await window.pywebview.api.get_session_graph(); } catch (error) {}

                    // Actualizar información de previsualización para Aegisub y Base

                                            try {

                                                    ? calculatePrevisualizadorNodeHeight(p.originalSize[0], nodeAspect)
                                                    : p.originalSize[1];
                                            }
                                            if (typeof p.node.setDirtyCanvas === 'function') p.node.setDirtyCanvas(true, true);
                                            if (window.canvas) { window.canvas.setDirty(true, true); window.canvas.draw(true, true); }
                                        }
                                    }
                                } else if (curSrc === "aegisub" && hasAegi) {
                                    if (typeof window.pywebview.api.get_preview_video_data_url === "function") {
                                        const newVid = await window.pywebview.api.get_preview_video_data_url("aegisub", connectedOutputs, serialized);
                                        const isArtInError = Boolean(p.art && p.art.template && p.art.template.$player && p.art.template.$player.classList.contains('art-error'));
                                        if (newVid && p.art && (p.videoUrl !== newVid || isArtInError)) {
                                            p.videoUrl = newVid;
                                            if (p.art.template && p.art.template.$player) {
                                                p.art.template.$player.classList.remove('art-error');

                                            if (p.art.mask) p.art.mask.show = false;

                                            try {

                                            const newH = typeof calculatePrevisualizadorNodeHeight === "function"
                                                ? calculatePrevisualizadorNodeHeight(curW, nodeAspect)

                                            if (!p.node.size || Math.abs(p.node.size[1] - newH) > 1.5) {

            // Registrar nodos de respaldo estáticos inmediatamente para blindaje total
            registerSystemNodes(FALLBACK_SYSTEM_NODES, false);

            // Aplicar configuración persistida del usuario (INSTANTÁNEA)
            if (userConfig) {
                window.pyxisDaemonMode = userConfig.daemon_mode !== undefined ? !!userConfig.daemon_mode : true;

            setLoadingStatus("Construyendo interfaz de nodos...");
            try {
                const has_new_format = manifest.data_nodes || manifest.system_nodes;
                const data_nodes = has_new_format ? (manifest.data_nodes || {}) : manifest;
                const system_nodes = has_new_format ? (manifest.system_nodes || {}) : {};

                registerDataNodes(data_nodes, true);
                registerSystemNodes(system_nodes, true);
                graph.start();

                // Garantizar la restpyxisción de la sesión o la carga del preset predeterminado sin pantallas en blanco
                let loadedSuccessfully = false;
                if (sessionData) {
                    try {
                        const saved_graph = JSON.parse(sessionData);
                        if (saved_graph && Array.isArray(saved_graph.nodes) && saved_graph.nodes.length > 0) {
                            graph.clear();

                                loadedSuccessfully = true;

                if (!loadedSuccessfully) {
                    console.warn("Pyxis: no se detectaron nodos válidos en la sesión, cargando preset predeterminado.");

        function syncWidgetsToProperties() {

                n.widgets.forEach(w => {

                            n.properties[w.property] = w.value;

                            w.value = n.properties[w.property];
                        }
                    }

    <script>
        (function() {

            function updateInNodePlayersPosition() {
                if (!window.graph || !window.canvas) return;

                const tx = window.canvas.ds.offset[0] || 0;
                const ty = window.canvas.ds.offset[1] || 0;

                const nodes = window.graph._nodes || [];

                nodes.forEach(node => {
                    if (!node || node.id === undefined) return;
                    const nodeIdStr = String(node.id);
                    const nType = (node.type || '').toLowerCase();
                    const nTitle = (node.title || '').toLowerCase();
                    if (nType.includes('preview') || nType.includes('previsualizador') || nTitle.includes('previsualizador') || nTitle.includes('preview')) {
                        currentPreviewNodes[nodeIdStr] = node;

                        const p = activePlayers[nodeIdStr];

                        if (!p || !p.isPinned) {
                            const curAspect = getNodePreviewAspectRatio(node);
                            const minW = getDynamicMinPreviewWidth(curAspect);
                            const curW = (node.size && node.size[0] && node.size[0] >= minW) ? node.size[0] : 520;
                            const targetH = typeof calculatePrevisualizadorNodeHeight === "function" 
                                ? calculatePrevisualizadorNodeHeight(curW, curAspect) 
                                : 330;
                            if (!node.size || node.size[0] < minW || Math.abs(node.size[1] - targetH) > 1.5) {
                                node.size = [curW, targetH];
                                if (typeof node.setDirtyCanvas === 'function') node.setDirtyCanvas(true, true);
                            }
                        } else {
                            if (!node.size || node.size[0] !== 300 || node.size[1] !== 54) {
                                node.size = [300, 54];
                                if (typeof node.setDirtyCanvas === 'function') node.setDirtyCanvas(true, true);
                            }
                        }

                        if (!activePlayers[nodeIdStr] && !creatingPlayers[nodeIdStr]) {
                            createInNodePlayer(node);
                        }

                        const pUpdated = activePlayers[nodeIdStr];
                        if (pUpdated) {
                            if (pUpdated.isFullscreen) {
                                return;
                            }
                            if (pUpdated.headerActions) {
                                const headX = (node.pos[0] + node.size[0] - 143 + tx) * scale;
                                const headY = (node.pos[1] + 9 + ty) * scale;
                                pUpdated.headerActions.style.left = headX + 'px';
                                pUpdated.headerActions.style.top = headY + 'px';
                                pUpdated.headerActions.style.transform = `scale(${scale})`;
                                pUpdated.headerActions.style.transformOrigin = 'top left';
                            }
                            if (pUpdated.wrapper && !pUpdated.isPinned) {
                                const topOffset = 46;
                                const sideMargin = 10;
                                const bottomMargin = 10;
                                const screenX = (node.pos[0] + sideMargin + tx) * scale;
                                const screenY = (node.pos[1] + topOffset + ty) * scale;
                                const unscaledW = Math.max(100, node.size[0] - (sideMargin * 2));
                                const unscaledH = Math.max(100, node.size[1] - topOffset - bottomMargin);

                                pUpdated.wrapper.style.left = screenX + 'px';
                                pUpdated.wrapper.style.top = screenY + 'px';
                                pUpdated.wrapper.style.width = unscaledW + 'px';
                                pUpdated.wrapper.style.height = unscaledH + 'px';
                                pUpdated.wrapper.style.transform = 'scale(' + scale + ')';
                                pUpdated.wrapper.style.transformOrigin = 'top left';

                                if (pUpdated.art && typeof pUpdated.art.resize === 'function') {
                                    if (pUpdated.lastW !== node.size[0] || pUpdated.lastH !== node.size[1]) {
                                        pUpdated.lastW = node.size[0];
                                        pUpdated.lastH = node.size[1];
                                        pUpdated.art.resize();
                                    }
                                }
                            }
                        }
                    }
                });

                Object.keys(activePlayers).forEach(nodeIdStr => {
                    if (!currentPreviewNodes[nodeIdStr]) {
                        destroyInNodePlayer(nodeIdStr);
                    }
                });

                // Limpieza de wrappers y headers huérfanos en el DOM
                const allWrappers = document.querySelectorAll('.pyxis-node-player-wrapper');
                allWrappers.forEach(wrap => {
                    const wId = wrap.id.replace('pyxis-player-wrapper-', '');
                    if (!currentPreviewNodes[wId]) {
                        if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
                    }
                });
                const allHeaders = document.querySelectorAll('.pyxis-node-header-actions');
                allHeaders.forEach(head => {

            function logPlayer(msg) {
                console.log("[PYXIS PLAYER]", msg);

            async function updateJassubTrack(jassub, assText) {
                if (!jassub || !assText) return;
                try {
                    logPlayer("updateJassubTrack start, assText len: " + assText.length);
                    if (jassub._loaded) {
                        try { await jassub._loaded; } catch (e) {}
                    }
                    if (typeof jassub.setTrack === 'function') {
                        jassub.setTrack(assText);
                        logPlayer("setTrack executed successfully.");
                    } else if (typeof jassub.setTrackByUrl === 'function') {
                        const blob = new Blob([assText], { type: 'text/plain;charset=utf-8' });
                        const blobUrl = URL.createObjectURL(blob);
                        jassub.setTrackByUrl(blobUrl);
                        logPlayer("setTrackByUrl executed successfully.");
                    }
                    if (typeof jassub.resize === 'function') {
                        try { jassub.resize(); } catch (e) {}
                    }
                } catch (e) {
                    console.warn("[Pyxis JASSUB track update warning]", e);
                    logPlayer("updateJassubTrack exception: " + String(e));
                }
            }

            function convertFontEntryToUint8Array(fontEntry) {
                if (!fontEntry) return null;
                let dataUrl = "";
                if (typeof fontEntry === "string") {
                    dataUrl = fontEntry;
                } else if (typeof fontEntry === "object") {
                    dataUrl = fontEntry.data || fontEntry.data_url || "";
                }
                if (!dataUrl || typeof dataUrl !== "string") return null;
                const commaIdx = dataUrl.indexOf(",");
                if (commaIdx === -1) return null;
                try {
                    const base64Str = dataUrl.substring(commaIdx + 1);
                    const binStr = window.atob(base64Str);
                    const len = binStr.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binStr.charCodeAt(i);
                    }
                    return bytes;
                } catch (e) {
                    console.error("[Pyxis Font Decode Error]", e);
                    return null;
                }
            }

            function injectFontsIntoJassub(jassub, fontsMap) {
                if (!jassub) {
                    console.error("[Pyxis Font Chivato] ERROR: injectFontsIntoJassub llamado sin instancia de JASSUB!");
                    return;
                }
                if (!fontsMap || typeof fontsMap !== "object") {
                    console.warn("[Pyxis Font Chivato] AVISO: injectFontsIntoJassub llamado con fontsMap vacío/inválido:", fontsMap);
                    return;
                }
                window.__pyxis_last_fonts_map = fontsMap;
                const fontKeys = Object.keys(fontsMap);
                console.log("[Pyxis Font Chivato] Inyectando fuentes en JASSUB. Total claves:", fontKeys.length, fontKeys);
                const processed = new Set();
                let successCount = 0;
                for (const [fName, fEntry] of Object.entries(fontsMap)) {
                    const cacheKey = (typeof fEntry === 'object' && fEntry.path) ? fEntry.path : fName.toLowerCase();
                    if (processed.has(cacheKey)) continue;
                    processed.add(cacheKey);

                    const u8 = convertFontEntryToUint8Array(fEntry);
                    if (!u8) {
                        console.error("[Pyxis Font Chivato] ERROR al decodificar binario de la fuente '" + fName + "'. Entrada:", fEntry);
                        continue;
                    }
                    try {
                        if (typeof jassub.addFont === "function") {
                            jassub.addFont(u8);
                            successCount++;
                            logPlayer("Chivato Font -> Éxito addFont en JASSUB: " + fName + " (" + u8.length + " bytes)");
                        } else {
                            console.error("[Pyxis Font Chivato] ERROR: jassub.addFont NO es una función!");
                        }
                    } catch (e) {
                        console.error("[Pyxis Font Chivato] EXCEPCIÓN al invocar jassub.addFont para " + fName + ":", e);
                    }
                }
                console.log("[Pyxis Font Chivato] Resumen de inyección: " + successCount + " fuentes binarias cargadas en libass.");
            }

            function attachPyxisDelayTooltip(el, tooltipText, delayMs = 1000) {
                if (!el) return;
                let hoverTimer = null;
                let tooltipEl = null;

                function showTooltip() {
                    if (tooltipEl) return;
                    tooltipEl = document.createElement("div");
                    tooltipEl.className = "pyxis-btn-tooltip";
                    tooltipEl.innerText = typeof tooltipText === "function" ? tooltipText() : tooltipText;

                    const rect = el.getBoundingClientRect();
                    tooltipEl.style.position = "fixed";
                    tooltipEl.style.left = (rect.left + rect.width / 2) + "px";
                    tooltipEl.style.top = (rect.top - 28) + "px";
                    document.body.appendChild(tooltipEl);

                    requestAnimationFrame(() => {
                        if (tooltipEl) tooltipEl.classList.add("visible");
                    });
                }

                function hideTooltip() {
                    if (hoverTimer) {
                        clearTimeout(hoverTimer);
                        hoverTimer = null;
                    }
                    if (tooltipEl) {
                        if (tooltipEl.parentNode) tooltipEl.parentNode.removeChild(tooltipEl);
                        tooltipEl = null;
                    }
                }

                el.addEventListener("mouseenter", () => {
                    hideTooltip();
                    hoverTimer = setTimeout(showTooltip, delayMs);
                });

                el.addEventListener("mouseleave", hideTooltip);
                el.addEventListener("mousedown", hideTooltip);
                el.addEventListener("click", hideTooltip);
            }

                                <path d="M12 17v5"/>

                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 11v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8H4z"/>
                                <path d="M4 11V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6H4z"/>
                                <path d="M9 3l-2 8"/>
                                <path d="M15 3l-2 8"/>
                            </svg>

                    const btnSource = headerActions.querySelector('#btn-source-' + nodeIdStr);
                    const btnPin = headerActions.querySelector('#btn-pin-' + nodeIdStr);

                    if (btnSource) {
