name: Build release packages

# Construye PyxisEffector-v<versión>-<plataforma>.zip para cada sistema operativo
# (la macro de Aegisub descarga estos archivos). Ver tools/build_release.py.
#
# - Al subir una etiqueta v* se crean los paquetes y se adjuntan a la release.
# - Con "Run workflow" solo se generan como artefactos descargables (prueba).
#
# ffmpeg se descarga y se verifica (SHA-256) desde los proveedores definidos en
# tools/get_ffmpeg.py; no hace falta indicar URLs aquí.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win64
            runner: windows-latest
          - platform: linux64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-latest
          - platform: macos-x64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/build_release.py --platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: PyxisEffector-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* pyxis.NodeEngine.lua --repo "$GITHUB_REPOSITORY" --clobber
